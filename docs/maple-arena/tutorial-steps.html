<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>반응형 튜토리얼 데이터</title><style>@font-face{font-family:P;src:url('../../fonts/Pretendard-Regular.woff2')}*{box-sizing:border-box}body{margin:0;background:#fff;color:#263238;font:14px P,sans-serif}header{padding:16px 20px;border-bottom:1px solid #d6dde1;background:#f8faf9}h1{font-size:20px;margin:0 0 12px}nav{display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit;padding:8px 12px;border:1px solid #bcc9c4;border-radius:4px;background:white}button{cursor:pointer}button[aria-pressed=true]{background:#e5f1eb;color:#186642;border-color:#30845d}label{display:block;margin-top:12px}input{width:min(340px,90%)}.status{padding:10px 20px;color:#65746c;font-size:12px}.grid{overflow:auto;height:calc(100vh - 190px);min-height:290px;border-top:1px solid #ccd5cf;outline-offset:-2px}table{border-collapse:separate;border-spacing:0;font-size:13px}th,td{border-right:1px solid #dce2de;border-bottom:1px solid #dce2de;padding:8px 10px;vertical-align:top;min-width:130px;max-width:360px;white-space:pre-wrap;overflow-wrap:anywhere}thead th{position:sticky;top:0;background:#eef3f0;z-index:3;white-space:nowrap}th:first-child,td:first-child{position:sticky;left:0;min-width:45px;width:45px;background:#f1f4f2;text-align:center;z-index:2;color:#607067}thead th:first-child{z-index:4}tr:nth-child(even) td:not(:first-child){background:#fafcfb}td:nth-child(2){min-width:100px}td.long{min-width:320px}tr:hover td:not(:first-child){background:#eef6f1}.empty{padding:24px}a{color:#216649}footer{padding:10px 20px;font-size:12px}table{table-layout:fixed}th:nth-child(2),td:nth-child(2){position:sticky;left:45px;min-width:150px;max-width:150px;background:#f8faf9!important;z-index:2;box-shadow:1px 0 #bbc7c0}thead th:nth-child(2){z-index:4}@media(min-width:700px){.grid[data-sheet="SkillData"] th:nth-child(3),.grid[data-sheet="SkillData"] td:nth-child(3){position:sticky;left:195px;background:#f8faf9;z-index:2}.grid[data-sheet="SkillData"] thead th:nth-child(3){z-index:4}}</style></head><body><header><h1>반응형 튜토리얼 데이터</h1><nav aria-label="데이터 시트"></nav><label>시트 검색 <input type="search" placeholder="이름, ID, 대사, 조건 검색"></label></header><div class="status" aria-live="polite"></div><div class="grid" tabindex="0" role="region" aria-label="데이터 표"></div><footer>제공 데이터의 열과 값을 유지한 읽기 전용 시트입니다.</footer><script>const tabs=[{"name": "튜토리얼", "headers": ["IDX", "NextDialogueTrigger", "DialogueText", "Ani_Type", "FocusUI1", "FocusUI2"], "rows": [[1.0, "space 입력", "아레나 월드에 온걸 환영해.\\난 안내를 맡은 오빈이야.", "talk", "Null", "Null"], [2.0, "space 입력", "먼저 아레나 월드에서 가장 중요한 아레나 전투에 대해서 설명해줄게", "talk", "Null", null], [3.0, "입력대기상태. 배틀로얄 모드 상태에서 플레이버튼 입력", "모드를 배틀로얄 모드로 바꾸고\\플레이 버튼을 눌러 결투장으로 이동해봐", "talk", "GameStart", "MatchStatus"], [4.0, "space 입력", "여기는 배틀 대기 공간이야.\\ 플레이어 모두 준비가 완료될 경우\n 결투장으로 자동 이동해", "talk", "Null", null], [5.0, "space 입력", "전투 시작 전 플레이 할 캐릭터를 고를 수 있고\\캐릭터는 저마다 고유한 스킬을 가지고 있어.", "talk", "Null", null], [6.0, "space 입력", "원하는 캐릭터를 선택해봐", "idle", "Null", null], [7.0, "캐릭터 입력대기 상태. 캐릭터 선택시 전환", "Null", "Null", "Null", null], [8.0, "space 입력", "다음은 무기를 고를 차례야.", "talk", "Null", null], [9.0, "space 입력", "무기는 저마다 특별한 공격 매커니즘을 가지고있고\\무기 레벨을 올릴 경우 특별한 무기 스킬도 사용이 가능해", "talk", "Null", null], [10.0, "space 입력", "참고로 캐릭터 마다 어울리는 전용무기가 있고\\전용 무기 선택시 약간의 추가 보너스 스탯이 존재해.", "talk", "Null", null], [11.0, "space 입력", "자 이제 원하는 무기를 선택해봐.", "idle", "Null", null], [12.0, "무기 입력대기 상태. 무기 선택시 전환", "Null", "Null", "Null", null], [13.0, "space 입력", "이제 모든 준비가 완료되었어.\\본격적인 실전으로 들어가보자구", "react", "Null", null], [14.0, "전투 진행 상태. 두 플레이어 사이의 거리가 1유닛 이하일경우 전환", "Null", "Null", "Null", null], [15.0, "space 입력", "기본 스킬인 대시는 방향키와 함께 사용하면\\앞 또는 뒤로 빠르게 이동할 수 있어.", "talk", "Null", null], [16.0, "대쉬 입력 대기상태. 대쉬 스킬 사용 시 전환", "대쉬 스킬을 사용해봐.", "idle", "Dash", null], [17.0, "전투 진행 상태. 라운드 종료 및 선택라운드 진입 시 전환", "Null", "Null", "Null", null], [18.0, "space 입력", "매 전투 라운드가 종료되면\\선택 라운드가 진행돼.", "talk", "Null", null], [19.0, "space 입력", "유물은 전투에 도움을 주는 각종 효과를 가지고있어.\\원하는 유물을 선택해봐.", "idle", "Null", null], [20.0, "유물 입력 대기상태. 유물 선택 시 전환", "Null", "Null", "Null", null], [21.0, "space 입력", "스킬 선택 라운드에서는 전투에서 사용할 추가 스킬을 획득 할 수 있어.\\스킬 선택은 한 매치당 2번까지만 진행되니 신중하게 생각하라구.", "talk", "Null", null], [22.0, "space 입력", "원하는 스킬을 선택해봐", "idle", "Null", null], [23.0, "스킬 입력 대기상태. 스킬 선택 시 전환", "Null", "Null", "Null", null], [24.0, "space 입력", "플레이어 정보 버튼을 클릭하면\\모든 플레이어의 유물, 스킬 정보를 확인할 수 있어.", "talk", "Null", null], [25.0, "플레이어 정보 버튼 입력 대기상태. 클릭 시 전환", "한번 클릭해봐.", "idle", "PlayerInformationButton", null], [26.0, "플레이어 정보 UI에서 X 버튼 입력 대기상태. 클릭 시 전환", "Null", "Null", "Null", null], [27.0, "space 입력", "전투 관련 사항은 모두 알려준것 같아\\이제 너의 실력을 보여주라고", "talk", "Null", null], [28.0, "전투 종료및 로비 이동 대기상태. 로비로 이동 시 전환", "Null", "Null", "Null", null], [29.0, "space 입력", "벌써 아레나에 익숙해진것 같네?", "react", "Null", null], [30.0, "space 입력", "마지막으로 더욱 강해질수 있는 방법에 대해서 알려줄게", "talk", "Null", null], [31.0, "아레나룸 버튼 입력 대기상태. 클릭 시 전환", "아레나룸 버튼을 클릭해서 입장해봐.", "idle", "Btn_ArenaRoom", null], [32.0, "space 입력", "아레나룸에선 게임을 진행하면서 얻은 재화로\\캐릭터나 무기레벨을 영구적으로 강화할수 있어.", "talk", "Null", null], [33.0, "space 입력", "캐릭터와 무기를 강화한다면\\전투에서 더욱 쉽게 이길 수 있겠지?", "talk", "Null", null], [34.0, "space 입력", "자세한건 우측 상단의 도움말을 참조해보라구.", "talk", "Null", null]]}];let active=0;const nav=document.querySelector('nav'),q=document.querySelector('input'),grid=document.querySelector('.grid'),status=document.querySelector('.status');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function draw(){grid.dataset.sheet=tabs[active].name;let t=tabs[active],query=q.value.toLowerCase().replace(/\s/g,''),rows=t.rows.map((r,i)=>({r,i})).filter(x=>x.r.some(v=>String(v??'').toLowerCase().replace(/\s/g,'').includes(query)));grid.innerHTML='<table><thead><tr><th>#</th>'+t.headers.map(h=>'<th scope="col">'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(x=>'<tr><th scope="row">'+(x.i+1)+'</th>'+t.headers.map((h,i)=>'<td class="'+(/Dialogue|Trigger|Desc|memo|설명|내용/.test(h)?'long':'')+'">'+esc(x.r[i])+'</td>').join('')+'</tr>').join('')+'</tbody></table>'+(rows.length?'':'<p class="empty">검색 결과가 없습니다.</p>');status.textContent=rows.length+' / '+t.rows.length+'행 · '+t.headers.length+'열 · 좌우로 스크롤하여 전체 항목 확인';nav.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===active)))}tabs.forEach((t,i)=>{let b=document.createElement('button');b.textContent=t.name;b.onclick=()=>{active=i;q.value='';grid.scrollLeft=0;grid.scrollTop=0;draw()};nav.append(b)});q.addEventListener('input',draw);draw();</script></body></html>
