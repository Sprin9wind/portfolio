<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포트폴리오 편집기</title>
<script src="data.js"></script>
<style>
:root{
  --radius-1:10px; --radius-2:16px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:36px;
  --topbar-h:56px;
  --font:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,monospace;
}
:root,[data-theme="dark"]{
  --bg-0:#000000; --bg-1:#000000; --bg-2:#0c0c0c; --bg-3:#161616;
  --border-1:#1f1f1f; --border-2:#2e2e2e;
  --text-1:#f2f5f4; --text-2:#9ea6a4; --text-3:#6b7271;
  --accent:#3ecfb2; --accent-2:#6fe3cb; --accent-dim:rgba(62,207,178,.12); --accent-text:#04231e;
  --brown:#45b8d1; --brown-dim:rgba(69,184,209,.13);
  --primary:#2aa189; --primary-hover:#33b89d; --primary-text:#fff;
  --info:#6fe3cb;
  --danger:#e0785c; --warn:#45b8d1;
  --advanced:#3ecfb2; --advanced-dim:rgba(62,207,178,.12);
  --practice-dim:rgba(69,184,209,.13);
  --shadow-1:0 2px 14px rgba(0,0,0,.7); --shadow-2:0 18px 54px rgba(0,0,0,.85);
}
[data-theme="light"]{
  --bg-0:#e6ece9; --bg-1:#f5f8f7; --bg-2:#ffffff; --bg-3:#eef3f1;
  --border-1:#e0e7e4; --border-2:#c6d2ce;
  --text-1:#1c2624; --text-2:#5d6a67; --text-3:#8b9794;
  --accent:#0b8072; --accent-2:#08675c; --accent-dim:#dcf4ef; --accent-text:#ffffff;
  --brown:#0f7a86; --brown-dim:#ddf0f3;
  --danger:#b6553c; --warn:#0f7a86;
  --advanced:#08675c; --advanced-dim:#dcf4ef; --practice-dim:#ddf0f3;
  --shadow-1:0 1px 2px rgba(28,38,36,.05),0 6px 20px rgba(28,38,36,.06);
  --shadow-2:0 6px 18px rgba(28,38,36,.10),0 22px 50px rgba(28,38,36,.10);
  --primary:#0b8072; --primary-hover:#08675c; --primary-text:#fff;
  --info:#08675c;
}
*,::before,::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.5;color:var(--text-1);
  background:var(--bg-1);-webkit-font-smoothing:antialiased}
#app{height:100%;display:flex;flex-direction:column}
.topbar{flex:0 0 var(--topbar-h);height:var(--topbar-h);display:flex;align-items:center;
  gap:var(--space-2);padding:0 var(--space-4);background:var(--bg-2);
  border-bottom:1px solid var(--border-1);z-index:50}
.topbar-title{font-size:15px;font-weight:600}
.topbar-title small{font-weight:400;color:var(--text-3);margin-left:8px;font-size:12px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-1);
  background:var(--bg-2);color:var(--text-1);border:1px solid var(--border-1);
  border-radius:var(--radius-1);padding:6px 12px;font-family:var(--font);font-size:13px;
  line-height:1.4;cursor:pointer;transition:background .12s,border-color .12s;
  user-select:none;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--bg-3);border-color:var(--border-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--bg-3);color:var(--text-1)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.btn.accent:hover{background:var(--accent-2);border-color:var(--accent-2);color:var(--accent-text)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.xs{padding:1px 6px;font-size:11px;border-radius:4px}

/* 레이아웃 */
.wrap{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:var(--side-w,300px) 1fr}
.wrap.side-off{grid-template-columns:0 1fr}
.wrap.side-off .side{display:none}
.side{position:relative;border-right:1px solid var(--border-1);background:var(--bg-2);
  display:flex;flex-direction:column;min-width:0;overflow:hidden}
.side-top{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:9px 10px;
  border-bottom:1px solid var(--border-1)}
.side-top input{flex:1 1 auto;min-width:0;padding:6px 10px;font-size:12.5px}
.side-tree{flex:1 1 auto;min-height:0;overflow:auto;padding:var(--space-3)}
/* 오른쪽 경계선을 잡아 폭을 바꾼다. 더블클릭하면 통째로 접힌다 */
.side-grip{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:5}
.side-grip:hover,.side-grip.on{background:var(--accent-dim)}
.side-empty{padding:16px 10px;color:var(--text-3);font-size:12px;text-align:center}
.main{overflow:auto;padding:var(--space-5) var(--space-5) 80px}
/* --doc-w 는 사이트 본문 폭(--wrap 1080px)과 같게 둔다. 편집 화면 = 결과 화면 */
.main-inner{max-width:1180px;margin:0 auto;--doc-w:1080px}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{border-right:none;border-bottom:1px solid var(--border-1);max-height:38vh}
  .side-grip{display:none}
  .main{padding:var(--space-4)}
}

/* 사이드 트리 */
.tree-unit{margin-bottom:var(--space-3)}
.tree-unit-head{display:flex;align-items:center;gap:6px;padding:6px 4px;font-weight:700;font-size:13px}
.tree-unit-head input{flex:1 1 auto;min-width:0}
.tree-mid{margin:4px 0 4px 8px;padding-left:8px;border-left:2px solid var(--border-1)}
.tree-mid-head{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px;
  font-weight:600;color:var(--text-2)}
.tree-mid-head input{flex:1 1 auto;min-width:0}
.tree-lesson{display:flex;align-items:center;gap:4px;width:100%;text-align:left;
  padding:7px 10px;margin:2px 0;background:var(--bg-1);border:1px solid var(--border-1);
  border-radius:var(--radius-1);cursor:pointer;color:var(--text-1);font-size:13px;
  font-family:var(--font)}
.tree-lesson:hover{background:var(--bg-3);border-color:var(--border-2)}
.tree-lesson.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent-2);font-weight:600}
.tree-lesson span{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-add{width:100%;margin:2px 0;padding:5px;background:transparent;border:1px dashed var(--border-1);
  border-radius:var(--radius-1);color:var(--text-3);font-size:12px;cursor:pointer;font-family:var(--font)}
.tree-add:hover{border-color:var(--accent);color:var(--accent-2)}
.icon-btn{flex:0 0 auto;width:20px;height:20px;padding:0;display:flex;align-items:center;
  justify-content:center;background:transparent;border:none;color:var(--text-3);
  cursor:pointer;border-radius:4px;font-size:12px;line-height:1}
.icon-btn:hover{background:var(--bg-3);color:var(--text-1)}
.icon-btn.del:hover{background:var(--danger);color:#fff}



/* ---------- 본문 블록 조작 ---------- */
.editor-wrap{position:relative;margin-left:58px}
/* 그룹 머리말 — index.html 의 .phead · .cover · .jump 와 같은 값. 읽기 전용 미리보기, 문서 이동만 된다 */
.gp{max-width:var(--doc-w);margin:0 0 6px 58px;color:var(--ink);
  font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",system-ui,sans-serif}
.gp h1{margin:0 0 10px;font-size:clamp(28px,4.4vw,46px);font-weight:900;letter-spacing:-.035em;line-height:1.15}
.gp .meta{margin:0;font-size:15px;color:var(--ink-2);font-weight:600;width:100%;background:transparent;border:1px solid transparent;
  padding:2px 6px;font-family:inherit;border-radius:6px}
.gp .meta:hover,.gp .meta:focus{border-color:var(--border-2);box-shadow:none}
.gp .links{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4)}
.gp .links a{display:inline-flex;padding:10px 18px;border-radius:8px;background:var(--accent);color:var(--accent-ink);
  font-weight:700;font-size:14px;text-decoration:none}
.gp .vid-row{display:flex;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s4)}
.gp .vid-row .vid{flex:1 1 320px;margin:0}
.gp .cover{width:100%;aspect-ratio:21/9;object-fit:cover;display:block;border-radius:var(--r-big);
  border:1px solid var(--line-soft);box-shadow:var(--shadow);margin-top:var(--s5)}
.gp .jump{display:flex;gap:6px;overflow-x:auto;padding:var(--s3) 0;margin:var(--s5) 0 var(--s4);border-bottom:1px solid var(--line-soft)}
.gp .jump button{flex:0 0 auto;background:transparent;border:1px solid var(--line-soft);border-radius:8px;padding:6px 14px;
  font:600 13px inherit;font-family:inherit;color:var(--ink-3);cursor:pointer;white-space:nowrap}
.gp .jump button:hover{color:var(--ink);border-color:var(--ink-3)}
.gp .jump button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep)}
.gp .gp-hint{font-size:11px;color:var(--text-3);margin:4px 0 0}
/* 문서 제목·태그는 사이트의 .doc-head 처럼 — 입력칸 티를 내지 않는다 */
.doc-head-edit{max-width:var(--doc-w);margin:0 0 6px 58px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.doc-head-edit #fTitle{flex:1 1 320px;background:transparent;border:1px solid transparent;padding:4px 6px;
  font-size:clamp(22px,2.6vw,30px);font-weight:900;letter-spacing:-.03em;line-height:1.25}
.doc-head-edit #fTag{flex:0 0 130px;width:130px;background:var(--accent-dim);color:var(--accent);border:1px solid transparent;
  font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:6px}
.doc-head-edit input:hover,.doc-head-edit input:focus{border-color:var(--border-2);box-shadow:none}
.doc-links-edit{flex:1 0 100%;font-size:12px;color:var(--text-2)}
.doc-links-edit summary{cursor:pointer;color:var(--text-3);padding:2px 6px}
.doc-links-edit #linkList{margin:6px 0}
#blkRail{position:absolute;left:-58px;top:0;width:54px;height:100%;pointer-events:none}
#blkRail .g{position:absolute;left:28px;width:24px;height:24px;display:flex;align-items:center;
  justify-content:center;border-radius:6px;color:var(--text-3);font-size:13px;line-height:1;
  cursor:grab;pointer-events:auto;user-select:none;opacity:.35;
  transition:opacity .12s,background .12s,color .12s}
.editor-wrap:hover #blkRail .g{opacity:.75}
#blkRail .g:hover{opacity:1;background:var(--bg-3);color:var(--accent)}
#blkRail .g:active{cursor:grabbing}
#blkRail .g.on{opacity:1;background:var(--accent-dim);color:var(--accent)}
#blkRail .g.plus{left:2px;cursor:pointer;font-size:15px}
#blkRail .g.plus:hover{background:var(--accent-dim);color:var(--accent)}
.editor:hover > *{outline:1px dashed rgba(255,255,255,.07);outline-offset:5px;border-radius:3px}
[data-theme="light"] .editor:hover > *{outline-color:rgba(0,0,0,.08)}
.editor > .blk-hi{outline:1px dashed var(--accent)!important;outline-offset:5px}
.blk-drag{opacity:.3}
/* 여러 블록을 한꺼번에 고른 상태 */
.editor > .blk-sel{background:var(--accent-soft);box-shadow:0 0 0 6px var(--accent-soft);
  border-radius:3px}
.editor > .blk-sel::selection,.editor > .blk-sel *::selection{background:transparent}
#blkRail .g.sel{opacity:1;background:var(--accent-dim);color:var(--accent)}
/* 레일 빈 곳을 끌면 블록을 범위로 고른다 */
#blkRail{pointer-events:auto;cursor:default}
#blkBand{position:absolute;z-index:60;border:1px solid var(--accent);
  background:var(--accent-dim);pointer-events:none;border-radius:3px}
#blkTools .cnt{font-size:11px;color:var(--accent);padding:0 6px;font-weight:600}
#blkTools button.wide{width:auto;padding:0 7px;font-size:11.5px}
/* 표 안에 커서가 있을 때 뜨는 도구 */
#tblTools{position:fixed;z-index:150;display:flex;align-items:center;gap:1px;padding:3px;
  background:var(--bg-2);border:1px solid var(--border-2);border-radius:8px;
  box-shadow:var(--shadow-1);white-space:nowrap}
#tblTools[hidden]{display:none}
#tblTools button{background:transparent;border:none;color:var(--text-2);cursor:pointer;
  font-family:var(--font);font-size:11.5px;padding:4px 7px;border-radius:5px;line-height:1.4}
#tblTools button:hover{background:var(--bg-3);color:var(--text-1)}
#tblTools button.del:hover{background:var(--danger);color:#fff}
#tblTools .sep{width:1px;height:14px;background:var(--border-1);margin:0 2px}
#tblTools .lbl{font-size:11px;color:var(--text-3);padding:0 4px}
.blk-drop{box-shadow:0 -2px 0 var(--accent)}
.blk-drop-after{box-shadow:0 2px 0 var(--accent)}
.blk-drop-left{box-shadow:-3px 0 0 var(--accent)}
.blk-drop-right{box-shadow:3px 0 0 var(--accent)}
#blkTools{position:fixed;z-index:70;display:none;align-items:center;gap:1px;padding:3px;
  background:var(--bg-2);border:1px solid var(--border-2);border-radius:8px;
  box-shadow:var(--shadow-1);white-space:nowrap}
#blkTools.show{display:flex}
#blkTools button{background:transparent;border:none;color:var(--text-2);cursor:pointer;
  width:22px;height:22px;padding:0;display:flex;align-items:center;justify-content:center;
  border-radius:5px;font-size:12px;line-height:1}
#blkTools button:hover{background:var(--bg-3);color:var(--text-1)}
#blkTools button.del:hover{background:var(--danger);color:#fff}

/* ---------- 트리 (재작성) ---------- */
.tree-fold{flex:0 0 auto;width:16px;height:16px;padding:0;display:flex;align-items:center;
  justify-content:center;background:transparent;border:none;border-radius:4px;cursor:pointer;
  color:var(--text-3);font-size:9px;line-height:1;transition:transform .12s}
.tree-fold:hover{background:var(--bg-3);color:var(--text-1)}
.tree-fold.closed{transform:rotate(-90deg)}
.tree-unit.fold > .tree-mid,.tree-unit.fold > .tree-layout,
.tree-unit.fold > .tree-add{display:none}
.tree-mid.fold > .tree-lesson,.tree-mid.fold > .tree-add{display:none}
.tree-count{flex:0 0 auto;font-size:10px;color:var(--text-3);padding:0 3px;font-weight:400}
.tree-hit{background:var(--accent-dim)!important;border-color:var(--accent)!important}
/* 드래그 정렬 */
.tree-mid-head[draggable="true"],.tree-unit-head[draggable="true"]{cursor:grab}
.tree-dragging{opacity:.35}
.tree-before{box-shadow:0 -2px 0 var(--accent)}
.tree-after{box-shadow:0 2px 0 var(--accent)}
.tree-into{background:var(--accent-dim);border-radius:var(--radius-1);
  box-shadow:inset 0 0 0 1px var(--accent)}
.tree-idx{flex:0 0 auto;width:16px;font-size:11px;color:var(--text-3);text-align:center}
.tree-acts{flex:0 0 auto;display:flex;gap:1px;opacity:0;transition:opacity .12s}
.tree-unit-head:hover .tree-acts,.tree-mid-head:hover .tree-acts,
.tree-lesson:hover .tree-acts,.tree-lesson.active .tree-acts{opacity:1}
.tree-layout{display:flex;align-items:center;gap:7px;margin:2px 0 8px 24px;
  font-size:11px;color:var(--text-3)}
.tree-layout > span{flex:0 0 auto;white-space:nowrap}
.tree-layout select{flex:1 1 auto;min-width:0;padding:4px 7px;font-size:11.5px;
  background:var(--bg-1);border:1px solid var(--border-1);border-radius:6px;color:var(--text-2)}
.tree-layout select:focus{border-color:var(--accent);outline:none}
.cover-btn{flex:0 0 auto;width:30px;height:22px;padding:0;overflow:hidden;cursor:pointer;
  background:var(--bg-1);border:1px dashed var(--border-2);border-radius:5px;
  color:var(--text-3);font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
.cover-btn:hover{border-color:var(--accent);color:var(--accent)}
.cover-btn.has{border-style:solid;border-color:var(--accent)}
.cover-btn img{width:100%;height:100%;object-fit:cover;display:block}
.tree-lesson{display:flex;align-items:center;gap:6px;width:100%;padding:7px 9px;margin:2px 0;
  background:var(--bg-1);border:1px solid var(--border-1);border-radius:var(--radius-1);
  cursor:pointer;color:var(--text-1);font-size:13px;font-family:var(--font);user-select:none}
.tree-lesson:hover{background:var(--bg-3);border-color:var(--border-2)}
.tree-lesson.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent-2);font-weight:600}
.tree-lesson:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tree-lesson-t{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-tag{flex:0 0 auto;font-size:10px;color:var(--text-3);padding:1px 6px;
  background:var(--bg-3);border-radius:999px}
.tree-lesson.active .tree-tag{background:transparent;color:var(--accent-2)}
.tree-add.strong{margin-top:10px;border-color:var(--border-2);color:var(--text-2)}

/* 폼 */
.field{display:flex;flex-direction:column;gap:var(--space-1);margin-bottom:var(--space-3)}
.field>label{font-size:12px;color:var(--text-2);font-weight:600}
.field>.hint{font-size:11px;color:var(--text-3)}
input[type=text],textarea,select{background:var(--bg-2);color:var(--text-1);
  border:1px solid var(--border-1);border-radius:var(--radius-1);padding:7px 10px;
  font-family:var(--font);font-size:13px;outline:none;width:100%;
  transition:border-color .12s,box-shadow .12s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
.row{display:flex;gap:var(--space-3)}
.row>*{flex:1 1 0;min-width:0}
.section-title{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);margin:var(--space-5) 0 var(--space-2);
  padding-bottom:6px;border-bottom:1px solid var(--border-1)}
.section-title:first-child{margin-top:0}

/* 툴바 + 에디터 */
.toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:8px;background:var(--bg-2);
  border:1px solid var(--border-1);border-bottom:none;border-radius:var(--radius-1) var(--radius-1) 0 0}
.toolbar .sep{width:1px;background:var(--border-1);margin:2px 4px}
/* ---------- 편집 지면 ----------
   index.html의 디자인 토큰과 .doc 타이포를 그대로 옮겨 왔다.
   "편집 화면 = 결과 화면"이 되도록 두 파일의 값을 항상 같이 고칠 것. */
.toolbar{max-width:var(--doc-w);margin-left:58px}
.main-inner{
  --s1:4px; --s2:8px; --s3:12px; --s4:18px; --s5:28px; --s6:44px; --s7:72px;
  --r-card:14px; --r-big:20px; --r-pill:999px;
  --bg:#fffaea; --band:#f6eed4; --card:#ffffff;
  --ink:#2e2c2b; --ink-2:#5f5b56; --ink-3:#6f6a62;
  --line:rgba(46,44,43,.16); --line-soft:rgba(46,44,43,.09);
  --accent:#d22e2e; --accent-deep:#a92020; --accent-soft:rgba(210,46,46,.15); --accent-ink:#fffaea;
  --honey:#c98a2e; --honey-soft:rgba(201,138,46,.14);
  --shadow:0 1px 2px rgba(46,44,43,.05),0 10px 30px rgba(46,44,43,.07);
}
.editor{
  --s1:4px; --s2:8px; --s3:12px; --s4:18px; --s5:28px; --s6:44px; --s7:72px;
  --r-card:14px; --r-big:20px; --r-pill:999px;
  --bg:#fffaea; --band:#f6eed4; --card:#ffffff;
  --ink:#2e2c2b; --ink-2:#5f5b56; --ink-3:#6f6a62;
  --line:rgba(46,44,43,.16); --line-soft:rgba(46,44,43,.09);
  --accent:#d22e2e; --accent-deep:#a92020; --accent-soft:rgba(210,46,46,.15); --accent-ink:#fffaea;
  --honey:#c98a2e; --honey-soft:rgba(201,138,46,.14);
  --shadow:0 1px 2px rgba(46,44,43,.05),0 10px 30px rgba(46,44,43,.07);
  min-height:420px;max-height:none;max-width:var(--doc-w);
  padding:var(--s5) var(--s5) var(--s6);
  background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",system-ui,sans-serif;
  font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word;
  border:1px solid var(--border-1);
  border-radius:0 0 var(--radius-1) var(--radius-1);outline:none;overflow:auto}
[data-theme="dark"] .main-inner,[data-theme="dark"] .editor{
  --bg:#17110f; --band:#1f1815; --card:#241c19;
  --ink:#f4ece0; --ink-2:#b5aca1; --ink-3:#948b80;
  --line:rgba(244,236,224,.17); --line-soft:rgba(244,236,224,.1);
  --accent:#f2554d; --accent-deep:#ff736b; --accent-soft:rgba(242,85,77,.2);
  --honey:#e0a951; --honey-soft:rgba(224,169,81,.16);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45)}
.editor:focus{border-color:var(--border-2)}
.editor > *:first-child{margin-top:0}
.editor h2{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:var(--s6) 0 var(--s3);
  padding-bottom:9px;border-bottom:1px solid var(--line)}
.editor h3{font-size:16.5px;font-weight:800;margin:var(--s5) 0 var(--s2);color:var(--accent)}
.editor p{margin:0 0 var(--s3)}
.editor ul,.editor ol{margin:0 0 var(--s4);padding-left:22px}
.editor li{margin-bottom:7px;color:var(--ink-2)}
.editor li::marker{color:var(--ink-3)}
.editor strong{color:var(--ink);font-weight:700}
.editor em{font-style:normal;color:var(--accent);font-weight:700}
.editor a{color:var(--accent);text-decoration-color:var(--accent-soft);text-underline-offset:3px}
.editor .mark{color:var(--accent);padding:0 .08em;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
  background:linear-gradient(to top,transparent 0,transparent .05em,
    var(--accent-soft) .05em,var(--accent-soft) .34em,transparent .34em)}
.editor hr{border:none;border-top:1px solid var(--line);margin:var(--s5) 0}
.editor .timeline{margin:0 0 var(--s4);padding:0;list-style:none}
.editor .timeline li{position:relative;padding:0 0 var(--s5) 22px;border-left:1px solid var(--line);
  color:var(--ink-2);margin-bottom:0}
.editor .timeline li:last-child{padding-bottom:0}
.editor .timeline li::before{content:"";position:absolute;left:-5px;top:9px;width:9px;height:9px;
  border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.editor .timeline b{display:block;color:var(--ink);font-size:15.5px;font-weight:700;margin-bottom:2px}
.editor .timeline .when{font-size:12.5px;color:var(--ink-3);font-weight:600}
.editor img{max-width:100%;height:auto;display:block;border-radius:var(--r-card);
  border:1px solid var(--line-soft);box-shadow:var(--shadow);margin:0 0 var(--s3)}
.editor .doc-img.center{margin-left:auto;margin-right:auto}
/* ---------- 영상 카드 (index.html 과 같은 값) ----------
   유튜브 링크는 버튼 대신 썸네일 + 재생 아이콘으로. 누르면 새 창에서 영상이 열린다 */
.editor .vid,.gp .vid{position:relative;display:block;width:100%;max-width:520px;aspect-ratio:16/9;
  border-radius:var(--r-card);overflow:hidden;border:1px solid var(--line-soft);
  box-shadow:var(--shadow);background:#141210;text-decoration:none;color:#fff;
  margin:0 0 var(--s4);cursor:pointer}
.editor .vid img,.gp .vid img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;
  display:block;margin:0;border:0;border-radius:0;box-shadow:none;transition:transform .5s ease}
.editor .vid::after,.gp .vid::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0) 50%)}
.editor .vid:hover img,.gp .vid:hover img{transform:scale(1.04)}
.editor .vid-play,.gp .vid-play{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;
  border-radius:50%;background:rgba(255,255,255,.94);box-shadow:0 6px 24px rgba(0,0,0,.35);
  z-index:2;transition:transform .2s ease,background .2s ease}
.editor .vid-play::before,.gp .vid-play::before{content:"";position:absolute;left:27px;top:20px;border-style:solid;
  border-width:13px 0 13px 22px;border-color:transparent transparent transparent var(--accent)}
.editor .vid:hover .vid-play,.gp .vid:hover .vid-play{transform:scale(1.08);background:#fff}
.editor .vid-cap,.gp .vid-cap{position:absolute;left:14px;bottom:12px;z-index:2;font-size:12.5px;font-weight:800;
  color:var(--accent-ink);background:var(--accent);padding:5px 10px;border-radius:6px;
  letter-spacing:-.01em}
.editor .vid,.editor .vid:hover,.gp .vid,.editor .vid:hover{text-decoration:none}
.editor .vid-row,.gp .vid-row{display:flex;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s4)}
.editor .vid-row .vid,.gp .vid-row .vid{flex:1 1 320px;margin:0}
@media(max-width:640px){.editor .vid{max-width:none}}
.editor .vid.blk-sel,.gp .vid.blk-sel{outline:3px solid var(--accent)}

.editor .img-row{display:flex;gap:14px;align-items:flex-start;margin:0 0 var(--s4);outline-offset:6px}
.editor .img-row > img{flex:1 1 0;min-width:0;width:100%;height:auto;margin:0;display:block}
@media(max-width:640px){.editor .img-row{flex-wrap:wrap}.editor .img-row > img{flex:1 1 46%}}
.editor img.img-sel{outline:2px solid var(--accent);outline-offset:2px}
/* 이미지를 끌어 옮기는 중 — 놓을 자리를 이미지 옆면에 표시한다 */
.editor img.img-drag{opacity:.35}
.editor img.img-drop-left{box-shadow:-4px 0 0 var(--accent)}
.editor img.img-drop-right{box-shadow:4px 0 0 var(--accent)}
/* 빈 문단에 '/' 안내를 띄운다 (저장 전에 is-empty 클래스는 벗겨낸다) */
.editor > p.is-empty::before{content:"'/' 를 누르면 블록을 넣을 수 있습니다";
  color:var(--ink-3);opacity:.65;pointer-events:none}

/* inset:0 이 없으면 fixed 요소가 정적 위치(문서 맨 아래)에 놓여 안의 absolute 막대가 엉뚱한 곳에 뜬다 */
#imgTools{position:fixed;inset:0;z-index:150;pointer-events:none}
#imgTools[hidden]{display:none}
#imgTools .it-bar{position:absolute;display:flex;align-items:center;gap:3px;padding:4px;
  background:var(--bg-2);border:1px solid var(--border-2);border-radius:var(--radius-1);
  box-shadow:var(--shadow-1);pointer-events:auto;white-space:nowrap}
#imgTools .it-bar button{background:transparent;border:none;color:var(--text-2);
  font-family:var(--font);font-size:12px;padding:3px 7px;border-radius:4px;cursor:pointer}
#imgTools .it-bar button:hover{background:var(--bg-3);color:var(--text-1)}
#imgTools .it-bar button.on{background:var(--accent-dim);color:var(--accent-2);font-weight:600}
#imgTools .it-bar button.del:hover{background:var(--danger);color:#fff}
#imgTools .it-bar .sep{width:1px;height:14px;background:var(--border-1);margin:0 2px}
#imgTools .it-bar .pct{font-size:11px;color:var(--text-3);padding:0 4px;min-width:34px;text-align:right}
#imgTools .it-handle{position:absolute;width:14px;height:14px;background:var(--accent);
  border:2px solid var(--bg-1);border-radius:3px;cursor:nwse-resize;pointer-events:auto}
.editor table{width:100%;border-collapse:collapse;margin:0 0 var(--s4);font-size:14.5px;
  border:1px solid var(--line-soft);border-radius:var(--r-card);overflow:hidden}
.editor th,.editor td{padding:10px 14px;text-align:left;vertical-align:top;
  border-bottom:1px solid var(--line-soft)}
.editor th{background:var(--band);color:var(--ink-2);font-weight:700;font-size:13px;white-space:nowrap}
.editor td{color:var(--ink-2)}
.editor tr:last-child th,.editor tr:last-child td{border-bottom:0}
.editor .skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:var(--s3);margin:0 0 var(--s4)}
.editor .skill{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px 18px;
  background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-card);
  box-shadow:var(--shadow)}
.editor .skill-head{display:flex;align-items:center;gap:9px;min-width:0;width:100%}
.editor .skill-ico{flex:0 0 auto;width:22px;height:22px;object-fit:contain;display:block;
  border:0;border-radius:5px;margin:0;padding:0;background:none;box-shadow:none}
.editor .skill-ico-emoji{flex:0 0 auto;font-size:19px;line-height:1}
.editor .skill-name{flex:1 1 auto;min-width:0;font-weight:700;font-size:15px;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.editor .skill-level{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:6px;
  background:var(--accent-soft);color:var(--accent-deep);white-space:nowrap}
.editor .skill-level.l2,.editor .skill-level.l1{background:var(--honey-soft);color:var(--honey)}
.editor .callout{display:flex;gap:13px;padding:16px 18px;background:var(--card);
  border:1px solid var(--line-soft);border-left:4px solid var(--accent);
  border-radius:var(--r-card);margin:0 0 var(--s4)}
.editor .callout.insight{border-left-color:var(--accent);background:var(--accent-soft)}
.editor .callout.problem{border-left-color:var(--honey);background:var(--honey-soft)}
.editor .callout-ico{flex:0 0 auto;font-size:16px;line-height:1.6}
.editor .callout-body{flex:1 1 auto;min-width:0}
.editor .callout-body p:last-child{margin-bottom:0}
.editor .quote{margin:0 0 var(--s4);padding:var(--s5) var(--s6);background:var(--band);
  border:1px solid var(--line-soft);border-radius:var(--r-big);
  font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.5;text-align:center}
.editor .quote span{display:block;margin-top:9px;font-size:13.5px;font-weight:600;color:var(--ink-2);
  letter-spacing:0}

/* ---------- 노션식 보조 UI: 슬래시 메뉴 · 선택 툴바 ---------- */
#slashMenu{position:fixed;z-index:200;width:270px;max-height:300px;overflow:auto;padding:5px;
  background:var(--bg-2);border:1px solid var(--border-2);border-radius:var(--radius-1);
  box-shadow:var(--shadow-2)}
#slashMenu[hidden]{display:none}
#slashMenu .sm-empty{padding:10px 12px;color:var(--text-3);font-size:12px}
#slashMenu .sm-i{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:7px;
  cursor:pointer;color:var(--text-2)}
#slashMenu .sm-i .k{flex:0 0 26px;height:26px;display:flex;align-items:center;justify-content:center;
  border-radius:6px;background:var(--bg-3);color:var(--text-2);font-size:13px}
#slashMenu .sm-i .n{font-size:13px;color:var(--text-1);font-weight:600}
#slashMenu .sm-i .d{font-size:11px;color:var(--text-3)}
#slashMenu .sm-i.on{background:var(--accent-dim)}
#slashMenu .sm-i.on .n{color:var(--accent)}
#selBar{position:fixed;z-index:200;display:flex;align-items:center;gap:1px;padding:3px;
  background:var(--bg-2);border:1px solid var(--border-2);border-radius:8px;
  box-shadow:var(--shadow-1);white-space:nowrap}
#selBar[hidden]{display:none}
#selBar button{background:transparent;border:none;color:var(--text-2);cursor:pointer;
  font-family:var(--font);font-size:12px;padding:4px 8px;border-radius:5px;line-height:1.4}
#selBar button:hover{background:var(--bg-3);color:var(--text-1)}
#selBar .sep{width:1px;height:14px;background:var(--border-1);margin:0 2px}
#selBar input{width:52px;padding:3px 4px;border:1px solid var(--border-1);border-radius:5px;
  background:var(--bg-1);color:var(--text-1);font-family:var(--font);font-size:12px;text-align:center;
  outline:none;-moz-appearance:textfield}
#selBar input::-webkit-outer-spin-button,#selBar input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#selBar input:focus{border-color:var(--accent)}

/* 링크 목록 */
.linkrow{display:flex;gap:var(--space-2);margin-bottom:var(--space-2)}
.linkrow input{flex:1 1 0}
.linkrow input.lbl{flex:0 0 150px}

/* 상태 표시 */
.status{font-size:12px;color:var(--text-3);margin-right:var(--space-2)}
.status.saved{color:var(--advanced)}
.status.dirty{color:var(--warn)}

/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;
  justify-content:center;z-index:100;padding:var(--space-4)}
.overlay[hidden]{display:none}
.modal{background:var(--bg-1);border:1px solid var(--border-1);border-radius:var(--radius-2);
  box-shadow:var(--shadow-2);width:min(560px,100%);max-height:85vh;display:flex;flex-direction:column}
.modal-header{padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--border-1);
  font-weight:600}
.modal-body{padding:var(--space-4);overflow:auto;display:flex;flex-direction:column;gap:var(--space-3)}
.modal-footer{padding:var(--space-3) var(--space-4);border-top:1px solid var(--border-1);
  display:flex;justify-content:flex-end;gap:var(--space-2)}
.note{padding:12px 14px;background:var(--bg-2);border:1px solid var(--border-1);
  border-left:3px solid var(--accent);border-radius:var(--radius-1);font-size:13px;color:var(--text-2)}
.note.warn{border-left-color:var(--warn);background:var(--practice-dim)}
.note b{color:var(--text-1)}
.toast-root{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;
  gap:var(--space-2);z-index:200;pointer-events:none}
.toast{min-width:200px;background:var(--bg-2);border:1px solid var(--border-1);
  border-left:3px solid var(--accent);border-radius:var(--radius-1);box-shadow:var(--shadow-1);
  padding:12px 16px;font-size:13px}
.toast.err{border-left-color:var(--danger)}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-title">포트폴리오 편집기<small id="crumb"></small></div>
    <div class="topbar-right">
      <span class="status" id="status">불러오는 중</span>
      <a class="btn ghost" href="index.html" title="포트폴리오 화면으로">← 사이트</a>
      <button class="btn ghost" id="sideBtn" title="목록 접기 / 펼치기 (Ctrl+\\)">☰ 목록</button>
      <button class="btn ghost" id="versionBtn">🕘 버전</button>
      <button class="btn ghost" id="loadBtn">불러오기</button>
      <button class="btn ghost" id="profileBtn">프로필</button>
      <button class="btn ghost" id="interviewBtn" title="모의면접 질문·답변 시트">🎙 모의면접</button>
      <button class="btn ghost" id="previewBtn">미리보기</button>
      <button class="btn ghost" id="helpBtn" title="사용법 (F1)">? 도움말</button>
      <button class="btn ghost" id="themeBtn">☾ 어둡게</button>
      <button class="btn primary" id="saveBtn" title="Ctrl+S">💾 저장</button>
    </div>
  </header>
  <div class="wrap">
    <aside class="side" id="side">
      <div class="side-top">
        <input type="search" id="treeFind" placeholder="문서 검색" autocomplete="off">
        <button class="icon-btn" id="treeFoldAll" title="모두 접기 / 펼치기">⌄</button>
      </div>
      <div class="side-tree" id="tree"></div>
      <div class="side-grip" id="sideGrip" title="드래그해서 폭 조절 · 더블클릭하면 접기"></div>
    </aside>
    <main class="main"><div class="main-inner" id="form"></div></main>
  </div>
</div>

<div class="overlay" id="overlay" hidden><div class="modal">
  <div class="modal-header" id="modalTitle"></div>
  <div class="modal-body" id="modalBody"></div>
  <div class="modal-footer" id="modalFooter"></div>
</div></div>
<div class="toast-root" id="toastRoot"></div>
<input type="file" id="imgPicker" accept="image/*" hidden>
<input type="file" id="rowPicker" accept="image/*" multiple hidden>
<input type="file" id="rowAddPicker" accept="image/*" multiple hidden>
<input type="file" id="dataPicker" accept=".js,text/javascript" hidden>
<input type="file" id="icoPicker" accept="image/*" hidden>
<input type="file" id="coverPicker" accept="image/*" hidden>
<div id="blkTools">
  <span class="cnt" id="blkCnt" hidden></span>
  <button data-blk="up" title="위로 (Alt+↑)">↑</button>
  <button data-blk="down" title="아래로 (Alt+↓)">↓</button>
  <button class="wide" data-blk="turn" title="블록 종류 바꾸기">종류</button>
  <button data-blk="dup" title="복제 (Ctrl+D)">⧉</button>
  <button class="del" data-blk="del" title="삭제 (Delete)">✕</button>
</div>
<div id="tblTools" hidden>
  <span class="lbl">행</span>
  <button data-tbl="rowUp" title="위에 행 추가">＋↑</button>
  <button data-tbl="rowDown" title="아래에 행 추가">＋↓</button>
  <button class="del" data-tbl="rowDel" title="이 행 삭제">✕</button>
  <span class="sep"></span>
  <span class="lbl">열</span>
  <button data-tbl="colLeft" title="왼쪽에 열 추가">＋←</button>
  <button data-tbl="colRight" title="오른쪽에 열 추가">＋→</button>
  <button class="del" data-tbl="colDel" title="이 열 삭제">✕</button>
  <span class="sep"></span>
  <button data-tbl="head" title="첫 줄을 제목 행으로">제목행</button>
</div>
<div id="slashMenu" hidden></div>
<div id="selBar" hidden>
  <button data-cmd="bold" title="굵게 (Ctrl+B)"><b>굵게</b></button>
  <button data-cmd="mark" title="형광펜 (Ctrl+E)">🖍 형광</button>
  <button data-cmd="em" title="색 강조">색 강조</button>
  <button data-cmd="link" title="링크 (Ctrl+K)">🔗 링크</button>
  <span class="sep"></span>
  <button data-size="-1" title="글자 작게 (Ctrl+Shift+,)">A−</button>
  <input id="selSize" type="number" list="selSizeList" min="8" max="96" step="1"
         title="글자 크기(px) · 숫자를 치고 Enter, 또는 목록에서 고르기">
  <datalist id="selSizeList">
    <option value="11"><option value="12"><option value="13"><option value="14"><option value="15">
    <option value="16"><option value="18"><option value="20"><option value="22"><option value="24">
    <option value="28"><option value="32"><option value="36"><option value="40"><option value="48">
  </datalist>
  <button data-size="1" title="글자 크게 (Ctrl+Shift+.)">A+</button>
  <button data-sizereset title="글자 크기 원래대로">기본</button>
  <span class="sep"></span>
  <button data-cmd="h2">큰 제목</button>
  <button data-cmd="h3">소제목</button>
  <button data-cmd="p">본문</button>
  <span class="sep"></span>
  <button data-cmd="clear">서식 지우기</button>
</div>
<div id="imgTools" hidden>
  <div class="it-bar">
    <span class="pct" id="itPct">100%</span>
    <span class="sep"></span>
    <button data-w="25">25</button><button data-w="50">50</button>
    <button data-w="75">75</button><button data-w="100">100</button>
    <span class="sep"></span>
    <button data-align="left" title="왼쪽 정렬">⇤</button>
    <button data-align="center" title="가운데 정렬">↔</button>
    <span class="sep"></span>
    <button data-mv="-1" title="줄에서 왼쪽으로 (Alt+←)">◀</button>
    <button data-mv="1" title="줄에서 오른쪽으로 (Alt+→)">▶</button>
    <span class="sep"></span>
    <button data-rowadd title="이 줄에 이미지 더 넣기">＋</button>
    <button data-rowout title="줄에서 빼내기">⊟</button>
    <button data-imgcopy title="복사 (Ctrl+C)">⧉</button>
    <button class="del" data-imgdel title="이미지 삭제">✕</button>
  </div>
  <div class="it-handle" id="itHandle"></div>
</div>

<script>
/* ============================================================
   상태
   ============================================================ */
const LS_KEY = "portfolio-draft-v1";
let data = null;      // { profile, units }
let sel = null;       // "ui-mi-li"
let dirty = false;

function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }

let hasBase = false;   // data.js를 정상적으로 읽었는가

function countLessons(units){
  return (units || []).reduce((a,u) =>
    a + (u.mids||[]).reduce((b,m) => b + (m.lessons||[]).length, 0), 0);
}

/* data.js 원본의 서명 — 작업본이 어느 원본에서 갈라졌는지 기억해, 원본이 밖에서 바뀌면 알아챈다 */
function sig(o){ const s = JSON.stringify(o); let h = 5381; for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h.toString(36) + s.length; }
function payloadSig(o){ return sig({ profile: o.profile, units: o.units, interview: o.interview || null }); }
function loadData(){
  hasBase = !!(window.PORTFOLIO_PROFILE && window.PORTFOLIO_UNITS);
  const base = hasBase
    ? { profile: deepCopy(window.PORTFOLIO_PROFILE), units: deepCopy(window.PORTFOLIO_UNITS),
        interview: window.PORTFOLIO_INTERVIEW ? deepCopy(window.PORTFOLIO_INTERVIEW) : null }
    : null;

  let draft = null;
  try { const raw = localStorage.getItem(LS_KEY); if (raw) draft = JSON.parse(raw); } catch(_) {}

  // 빈 작업본이 멀쩡한 원본을 가리는 사고 방지
  if (draft && countLessons(draft.units) === 0 && base && countLessons(base.units) > 0){
    try { localStorage.removeItem(LS_KEY); } catch(_) {}
    draft = null;
  }

  const baseSig = base ? payloadSig(base) : "";
  /* 원본이 우리가 내보낸 바로 그 내용이면 작업본은 필요 없다.
     GitHub 커밋 직후에는 사이트 반영에 시간이 걸려 원본이 아직 옛것일 수 있으므로, 그때는 작업본을 그대로 지킨다. */
  if (draft && draft.units && base){
    if (draft.exportedSig && draft.exportedSig === baseSig) draft = null;
    else if (draft.exportedSig) { /* 아직 반영 전 — 조용히 작업본 유지 */ }
    else if (draft.baseSig !== baseSig){
      if (confirm("data.js 원본이 편집기의 작업본과 다릅니다 (편집기 밖에서 바뀌었습니다).\n\n" +
                  "[확인] 원본으로 새로 시작 — 지금 작업본은 「버전」에 남겨 둡니다\n[취소] 작업본을 그대로 씁니다")){
        try { verPut({ id: Date.now(), label: "원본 교체 전 작업본", at: Date.now(), payload: deepCopy(draft) }); } catch(_) {}
        draft = null;
      } else { draft.baseSig = baseSig; }
    }
  }

  if (draft && draft.units){
    data = draft;
    /* 모의면접 데이터가 없는 예전 작업본이면 원본의 것을 붙인다 */
    if (!data.interview && base && base.interview) data.interview = base.interview;
    setStatus(`작업본 · 문서 ${countLessons(data.units)}개`, "saved");
  } else if (base){
    data = base; data.baseSig = baseSig;
    setStatus(`원본 · 문서 ${countLessons(data.units)}개`, "saved");
  } else {
    data = { profile:{ name:"", title:"", tagline:"", cards:[
      {label:"직무",value:""},{label:"소속",value:""},{label:"연락처",value:""}] }, units:[] };
    setStatus("data.js 없음", "dirty");
  }
}

/* data.js를 직접 골라서 불러오기 — 폴더·파일명이 어긋나도 해결됩니다 */
document.getElementById("loadBtn").onclick = () => document.getElementById("dataPicker").click();
document.getElementById("dataPicker").onchange = e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const box = {};
      new Function("window", r.result)(box);
      if (!box.PORTFOLIO_UNITS) throw new Error("PORTFOLIO_UNITS 없음");
      const n = countLessons(box.PORTFOLIO_UNITS);
      if (!confirm(`문서 ${n}개를 찾았습니다.\n지금 편집 중인 내용을 이걸로 바꿀까요?`)) return;
      data = { profile: box.PORTFOLIO_PROFILE || data.profile, units: box.PORTFOLIO_UNITS,
               interview: box.PORTFOLIO_INTERVIEW || data.interview || null };
      hasBase = true; sel = null;
      save(); renderSide(); renderForm();
      toast(`문서 ${n}개를 불러왔습니다`);
    } catch(err){
      toast("data.js를 읽지 못했습니다: " + err.message, true);
    }
  };
  r.readAsText(f, "utf-8");
};

function save(){
  dirty = true; data.exportedSig = "";
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(data));
    setStatus("자동 저장됨", "saved");
  } catch(_) {
    setStatus("저장 실패 — 내보내기로 보관하세요", "dirty");
  }
}
function setStatus(msg, cls){
  const el = document.getElementById("status");
  el.textContent = msg; el.className = "status " + (cls || "");
}
function toast(msg, isErr){
  const t = document.createElement("div");
  t.className = "toast" + (isErr ? " err" : "");
  t.textContent = msg;
  document.getElementById("toastRoot").appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
window.addEventListener("error", e => toast("오류: " + e.message, true));
window.addEventListener("unhandledrejection", e =>
  toast("오류: " + ((e.reason && e.reason.message) || e.reason), true));

const IS_FILE = location.protocol === "file:";

function esc(s){ return String(s == null ? "" : s)
  .replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* 홈에서의 표시 방식 */
const LAYOUT_ORDER = ["gallery", "cards", "list", "inline"];
const LAYOUT_ICON = { gallery:"▦", cards:"▤", list:"☰", inline:"⊞" };
const LAYOUT_NAME = { gallery:"큰 썸네일 카드", cards:"중간 카드", list:"간단한 목록", inline:"홈에 내용 펼치기" };

/* ============================================================
   사이드 트리
   ============================================================ */
/* 접힘 상태는 인덱스가 아니라 객체 자체에 물려 둔다.
   인덱스로 기억하면 순서를 바꾸는 순간 엉뚱한 항목이 접힌다.
   WeakSet이라 data.js로 직렬화될 일도 없다(units는 JSON.stringify로 저장된다). */
const folded = new WeakSet();
let foldReady = false;
function initFold(){
  if (foldReady || !data.units.length) return;
  foldReady = true;
  /* 처음에는 지금 보고 있는 그룹만 펼쳐 둔다. 22개가 한꺼번에 쏟아지면 찾기가 더 어렵다 */
  const [su, sm] = (sel || "").split("-").map(Number);
  data.units.forEach((u, ui) => u.mids.forEach((m, mi) => {
    if (!(ui === su && mi === sm)) folded.add(m);
  }));
}
function toggleFold(o){ folded.has(o) ? folded.delete(o) : folded.add(o); renderSide(); }

let treeQ = "";
let treeSeen = null;   // 마지막으로 화면에 맞춰 스크롤한 문서 키
function hits(l){
  if (!treeQ) return true;
  return ((l.title || "") + " " + (l.tag || "")).toLowerCase().includes(treeQ);
}
function hl(text){
  const t = esc(text);
  if (!treeQ) return t;
  const i = t.toLowerCase().indexOf(treeQ);
  if (i < 0) return t;
  return t.slice(0, i) + '<span class="tree-hit">' + t.slice(i, i + treeQ.length) + "</span>" + t.slice(i + treeQ.length);
}

function renderSide(){
  const box = document.getElementById("tree");
  if (!box) return;
  const keep = box.scrollTop;

  if (!data.units.length){
    box.innerHTML = `<div class="note warn" style="margin-bottom:12px">
      <b>불러온 문서가 없습니다.</b><br>
      위쪽 <b>불러오기</b>로 data.js를 직접 골라 주세요.
    </div>
    <button class="tree-add" data-add="unit">+ 빈 단원으로 새로 시작</button>`;
    return;
  }
  initFold();

  let shown = 0;
  const html = data.units.map((u, ui) => {
    const lay = u.layout || "cards";
    /* 검색 중에는 접힘을 무시하고, 걸린 문서만 남긴다 */
    const mids = u.mids.map((m, mi) => {
      const list = m.lessons.map((l, li) => ({ l, li })).filter(x => hits(x.l));
      if (treeQ && !list.length) return "";
      shown += list.length;
      const open = treeQ ? true : !folded.has(m);
      return `
        <div class="tree-mid${open ? "" : " fold"}" data-mid="${ui}-${mi}">
          <div class="tree-mid-head" draggable="true" data-drag="mid" data-ui="${ui}" data-mi="${mi}">
            <button class="tree-fold${open ? "" : " closed"}" data-fold="mid" data-ui="${ui}" data-mi="${mi}"
              title="${open ? "접기" : "펼치기"}">▼</button>
            <button class="cover-btn${m.cover ? " has" : ""}" data-cover="${ui}-${mi}"
              title="${m.cover ? "썸네일 바꾸기 / 지우기" : "썸네일 넣기"}">${
              m.cover ? `<img src="${m.cover}" alt="">` : "＋"}</button>
            <input type="text" value="${esc(m.title)}" data-edit="mid" data-ui="${ui}" data-mi="${mi}" placeholder="그룹 이름">
            <span class="tree-count">${m.lessons.length}</span>
            <span class="tree-acts">
              <button class="icon-btn del" data-del="mid" data-ui="${ui}" data-mi="${mi}" title="그룹 삭제">✕</button>
            </span>
          </div>
          ${list.map(({ l, li }) => {
            const key = `${ui}-${mi}-${li}`;
            return `<div class="tree-lesson${sel === key ? " active" : ""}" data-open="${key}"
                 draggable="true" data-drag="lesson" data-ui="${ui}" data-mi="${mi}" data-li="${li}"
                 tabindex="0" role="button">
              <span class="tree-lesson-t">${hl(l.title) || "(제목 없음)"}</span>
              ${l.tag ? `<span class="tree-tag">${esc(l.tag)}</span>` : ""}
              <span class="tree-acts">
                <button class="icon-btn del" data-del="lesson" data-ui="${ui}" data-mi="${mi}" data-li="${li}" title="문서 삭제">✕</button>
              </span>
            </div>`;
          }).join("")}
          <button class="tree-add" data-add="lesson" data-ui="${ui}" data-mi="${mi}">+ 문서</button>
        </div>`;
    }).join("");

    if (treeQ && !mids) return "";
    const uOpen = treeQ ? true : !folded.has(u);
    const docs = u.mids.reduce((a, m) => a + m.lessons.length, 0);
    return `
    <div class="tree-unit${uOpen ? "" : " fold"}">
      <div class="tree-unit-head" draggable="true" data-drag="unit" data-ui="${ui}">
        <button class="tree-fold${uOpen ? "" : " closed"}" data-fold="unit" data-ui="${ui}"
          title="${uOpen ? "접기" : "펼치기"}">▼</button>
        <span class="tree-idx">${ui + 1}</span>
        <input type="text" value="${esc(u.title)}" data-edit="unit" data-ui="${ui}" placeholder="섹션 이름">
        <span class="tree-count">${docs}</span>
        <span class="tree-acts">
          <button class="icon-btn del" data-del="unit" data-ui="${ui}" title="섹션 삭제">✕</button>
        </span>
      </div>
      <div class="tree-layout">
        <span>홈 표시</span>
        <select data-layout="${ui}">
          ${LAYOUT_ORDER.map(k => `<option value="${k}"${k === lay ? " selected" : ""}>${LAYOUT_NAME[k]}</option>`).join("")}
        </select>
      </div>
      ${mids}
      <button class="tree-add" data-add="mid" data-ui="${ui}">+ 그룹</button>
    </div>`;
  }).join("");

  box.innerHTML = (treeQ && !shown)
    ? `<div class="side-empty">"${esc(treeQ)}"에 맞는 문서가 없습니다</div>`
    : html + `<button class="tree-add strong" data-add="unit">+ 섹션 추가</button>`;

  box.scrollTop = keep;
  /* 다른 문서로 옮겨 갔을 때만 그 줄을 화면 안으로 끌어온다 */
  if (sel && sel !== treeSeen){
    treeSeen = sel;
    const act = box.querySelector(".tree-lesson.active");
    if (act) act.scrollIntoView({ block:"nearest" });
  }
}

/* 열려 있던 문서를 객체로 기억했다가 옮긴 뒤 다시 찾는다.
   인덱스를 손으로 보정하는 것보다 순서 바꾸기가 아무리 복잡해져도 안 깨진다 */
function selObj(){ const c = current(); return c ? c.l : null; }
function refindSel(obj){
  if (!obj) return;
  data.units.forEach((u, ui) => u.mids.forEach((m, mi) => m.lessons.forEach((l, li) => {
    if (l === obj) sel = `${ui}-${mi}-${li}`;
  })));
}

/* ---- 검색 · 모두 접기 · 폭 조절 ---- */
const treeFind = document.getElementById("treeFind");
treeFind.addEventListener("input", () => {
  treeQ = treeFind.value.trim().toLowerCase();
  renderSide();
});
treeFind.addEventListener("keydown", e => {
  if (e.key === "Escape"){ treeFind.value = ""; treeQ = ""; renderSide(); treeFind.blur(); }
  if (e.key === "Enter"){
    const first = document.querySelector("#tree .tree-lesson");
    if (first){ flush(); sel = first.dataset.open; renderSide(); renderForm(); }
  }
});
document.getElementById("treeFoldAll").onclick = () => {
  const anyOpen = data.units.some(u => !folded.has(u) || u.mids.some(m => !folded.has(m)));
  data.units.forEach(u => {
    anyOpen ? folded.add(u) : folded.delete(u);
    u.mids.forEach(m => anyOpen ? folded.add(m) : folded.delete(m));
  });
  foldReady = true;
  renderSide();
  toast(anyOpen ? "모두 접었습니다" : "모두 펼쳤습니다");
};

const SIDE_W = "pf-side-w";
const wrapEl = document.querySelector(".wrap");
try {
  const w = +localStorage.getItem(SIDE_W);
  if (w >= 200 && w <= 560) wrapEl.style.setProperty("--side-w", w + "px");
} catch(_) {}
function toggleSide(){
  wrapEl.classList.toggle("side-off");
  if (typeof buildRail === "function") buildRail();
  if (typeof placeTools === "function") placeTools();
}
document.getElementById("sideBtn").onclick = toggleSide;
const grip = document.getElementById("sideGrip");
grip.addEventListener("dblclick", toggleSide);
grip.addEventListener("mousedown", e => {
  e.preventDefault();
  grip.classList.add("on");
  const startX = e.clientX;
  const startW = document.getElementById("side").offsetWidth;
  const move = ev => {
    const w = Math.max(200, Math.min(560, startW + ev.clientX - startX));
    wrapEl.style.setProperty("--side-w", w + "px");
  };
  const up = () => {
    grip.classList.remove("on");
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    try { localStorage.setItem(SIDE_W, document.getElementById("side").offsetWidth); } catch(_) {}
    if (typeof buildRail === "function") buildRail();
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
});

/* ---- 트리 드래그 정렬 ----
   문서는 다른 그룹으로, 그룹은 다른 섹션으로 옮길 수 있다.
   위/아래 절반이면 그 앞뒤로, 그룹·섹션 머리 한가운데면 그 안으로 들어간다 */
let treeDrag = null;
/* 제목 칸 안에서 글자를 끌어 고르려 할 때 드래그가 시작되면 편집이 불가능해진다.
   입력칸을 누르는 동안에는 부모의 draggable을 꺼 둔다 */
document.getElementById("side").addEventListener("mousedown", e => {
  const head = e.target.closest("[data-drag]");
  if (head) head.draggable = !e.target.closest("input,select,textarea,button");
}, true);
document.addEventListener("mouseup", () => {
  document.querySelectorAll("#side [data-drag]").forEach(h => { h.draggable = true; });
});

function treeClear(){
  document.querySelectorAll(".tree-before,.tree-after,.tree-into")
    .forEach(x => x.classList.remove("tree-before","tree-after","tree-into"));
}
document.getElementById("side").addEventListener("dragstart", e => {
  const h = e.target.closest("[data-drag]");
  if (!h) return;
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return e.preventDefault();
  treeDrag = { kind:h.dataset.drag, ui:+h.dataset.ui,
               mi:h.dataset.mi === undefined ? -1 : +h.dataset.mi,
               li:h.dataset.li === undefined ? -1 : +h.dataset.li };
  h.classList.add("tree-dragging");
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", "tree");
});
document.getElementById("side").addEventListener("dragend", () => {
  document.querySelectorAll(".tree-dragging").forEach(x => x.classList.remove("tree-dragging"));
  treeClear();
  treeDrag = null;
});
function treeTarget(e){
  if (!treeDrag) return null;
  const row = e.target.closest(".tree-lesson,.tree-mid-head,.tree-unit-head");
  if (!row) return null;
  const r = row.getBoundingClientRect();
  const after = e.clientY > r.top + r.height / 2;
  const middle = e.clientY > r.top + r.height * 0.28 && e.clientY < r.bottom - r.height * 0.28;
  return { row, after, middle };
}
document.getElementById("side").addEventListener("dragover", e => {
  const t = treeTarget(e); if (!t) return;
  e.preventDefault();
  treeClear();
  const cls = dropInto(t) ? "tree-into" : (t.after ? "tree-after" : "tree-before");
  t.row.classList.add(cls);
});
/* 문서를 그룹 머리에 놓으면 그 그룹으로, 그룹을 섹션 머리에 놓으면 그 섹션으로 */
function dropInto(t){
  if (!treeDrag) return false;
  if (treeDrag.kind === "lesson" && t.row.classList.contains("tree-mid-head")) return true;
  if (treeDrag.kind === "mid" && t.row.classList.contains("tree-unit-head")) return true;
  return false;
}
document.getElementById("side").addEventListener("drop", e => {
  const t = treeTarget(e); if (!t) return;
  e.preventDefault();
  treeClear();
  flush();
  const keepObj = selObj();
  const d = treeDrag, row = t.row;
  const ui = +row.dataset.ui, mi = row.dataset.mi === undefined ? -1 : +row.dataset.mi,
        li = row.dataset.li === undefined ? -1 : +row.dataset.li;

  if (d.kind === "lesson"){
    const from = data.units[d.ui].mids[d.mi].lessons;
    let toU = ui, toM = mi, at;
    if (row.classList.contains("tree-lesson")){ at = li + (t.after ? 1 : 0); }
    else if (row.classList.contains("tree-mid-head")){ at = data.units[ui].mids[mi].lessons.length; }
    else { treeDrag = null; return; }
    const [node] = from.splice(d.li, 1);
    const to = data.units[toU].mids[toM].lessons;
    if (d.ui === toU && d.mi === toM && d.li < at) at--;
    to.splice(Math.max(0, Math.min(at, to.length)), 0, node);
  }
  else if (d.kind === "mid"){
    const from = data.units[d.ui].mids;
    let toU, at;
    if (row.classList.contains("tree-mid-head")){ toU = ui; at = mi + (t.after ? 1 : 0); }
    else if (row.classList.contains("tree-unit-head")){ toU = ui; at = data.units[ui].mids.length; }
    else { treeDrag = null; return; }
    const [node] = from.splice(d.mi, 1);
    const to = data.units[toU].mids;
    if (d.ui === toU && d.mi < at) at--;
    to.splice(Math.max(0, Math.min(at, to.length)), 0, node);
  }
  else if (d.kind === "unit"){
    if (!row.classList.contains("tree-unit-head")){ treeDrag = null; return; }
    let at = ui + (t.after ? 1 : 0);
    const [node] = data.units.splice(d.ui, 1);
    if (d.ui < at) at--;
    data.units.splice(Math.max(0, Math.min(at, data.units.length)), 0, node);
  }
  treeDrag = null;
  refindSel(keepObj);
  save(); renderSide(); renderForm();
  toast("순서를 바꿨습니다");
});

document.getElementById("side").addEventListener("click", e => {
  const t = e.target;
  const ui = +t.dataset.ui, mi = +t.dataset.mi, li = +t.dataset.li;
  // 구조를 바꾸기 전에 편집 중이던 본문을 먼저 반영한다
  if (t.dataset.add || t.dataset.del || t.dataset.move) flush();

  if (t.dataset.add){
    if (t.dataset.add === "unit") data.units.push({ title:"새 단원", mids:[{ title:"새 그룹", lessons:[] }] });
    if (t.dataset.add === "mid")  data.units[ui].mids.push({ title:"새 그룹", lessons:[] });
    if (t.dataset.add === "lesson"){
      data.units[ui].mids[mi].lessons.push({ title:"새 문서", tag:"", html:"<p>내용을 입력하세요.</p>" });
      sel = `${ui}-${mi}-${data.units[ui].mids[mi].lessons.length - 1}`;
      folded.delete(data.units[ui].mids[mi]);   /* 접혀 있으면 새 문서가 안 보인다 */
    }
    if (t.dataset.add === "mid") folded.delete(data.units[ui]);
    save(); renderSide(); renderForm(); return;
  }
  if (t.dataset.del){
    const what = { unit:"단원", mid:"그룹", lesson:"문서" }[t.dataset.del];
    if (!confirm(what + "을(를) 삭제할까요? 되돌릴 수 없습니다.")) return;
    if (t.dataset.del === "unit")   data.units.splice(ui, 1);
    if (t.dataset.del === "mid")    data.units[ui].mids.splice(mi, 1);
    if (t.dataset.del === "lesson") data.units[ui].mids[mi].lessons.splice(li, 1);
    if (sel && !current()) sel = null;
    save(); renderSide(); renderForm();
    e.stopPropagation(); return;
  }
  if (t.dataset.move){
    const dir = +t.dataset.dir;
    const kind = t.dataset.move;
    const arr = kind === "unit" ? data.units
              : kind === "mid"  ? data.units[ui].mids
              : data.units[ui].mids[mi].lessons;
    const i = kind === "unit" ? ui : kind === "mid" ? mi : li;
    const j = i + dir;
    if (j < 0 || j >= arr.length){ e.stopPropagation(); return; }
    const keepObj = selObj();
    [arr[i], arr[j]] = [arr[j], arr[i]];
    refindSel(keepObj);
    save(); renderSide(); renderForm();
    e.stopPropagation(); return;
  }

  if (t.dataset.fold){
    const ui = +t.dataset.ui;
    toggleFold(t.dataset.fold === "unit" ? data.units[ui] : data.units[ui].mids[+t.dataset.mi]);
    e.stopPropagation(); return;
  }
  if (t.dataset.cover !== undefined){ pickCover(t.dataset.cover); e.stopPropagation(); return; }
  const openBtn = t.closest("[data-open]");
  if (openBtn){
    flush(); sel = openBtn.dataset.open;
    const c = current();
    if (c){ folded.delete(c.u); folded.delete(c.m); }
    renderSide(); renderForm();
  }
});

document.getElementById("side").addEventListener("change", e => {

    u2.layout = t.value;

/* 문서 줄은 div이므로 키보드로도 열 수 있게. Alt+↑↓ 로 순서도 바꾼다 */
document.getElementById("side").addEventListener("keydown", e => {
  const row = e.target.closest("[data-open]");
  if (!row) return;
  if (e.key === "Enter" || e.key === " "){
    e.preventDefault(); flush(); sel = row.dataset.open; renderSide(); renderForm();
    return;
  }
  if (e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown")){
    e.preventDefault();
    const [ui, mi, li] = row.dataset.open.split("-").map(Number);
    const arr = data.units[ui].mids[mi].lessons;
    const j = li + (e.key === "ArrowUp" ? -1 : 1);
    if (j < 0 || j >= arr.length) return;
    flush();
    const keepObj = selObj();
    [arr[li], arr[j]] = [arr[j], arr[li]];
    refindSel(keepObj);
    save(); renderSide(); renderForm();
    const next = document.querySelector(`#tree [data-open="${ui}-${mi}-${j}"]`);
    if (next) next.focus();
  }
});

document.getElementById("side").addEventListener("input", e => {
  const t = e.target;
  if (t.id === "treeFind") return;
  if (t.dataset.edit === "unit") data.units[+t.dataset.ui].title = t.value;
  if (t.dataset.edit === "mid")  data.units[+t.dataset.ui].mids[+t.dataset.mi].title = t.value;
  save();
});

function current(){
  if (!sel) return null;
  const [ui, mi, li] = sel.split("-").map(Number);
  const u = data.units[ui], m = u && u.mids[mi], l = m && m.lessons[li];
  return l ? { u, m, l, ui, mi, li } : null;
}

/* 그룹 머리말 미리보기 — 사이트의 .phead 와 같은 내용. 문서 바로가기로 문서를 옮겨 다닌다 */
function groupHead(cur){
  const m = cur.m, ui = +sel.split("-")[0], mi = +sel.split("-")[1], li = +sel.split("-")[2];
  if (ui === 0) return "";   /* About Me 는 사이트에서 머리말이 없다 */
  const yt = u => (String(u||"").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/) || [])[1];
  const links = (m.lessons || []).flatMap(l => l.links || []);
  const btns = links.filter(l => !yt(l.url)), vids = links.filter(l => yt(l.url));
  return `<header class="gp">
    <h1>${esc(m.title)}</h1><input class="meta" data-gmeta value="${esc(m.meta || "")}" placeholder="기간 · 역할 · 소속 (예: 2025.03 ~ · 시스템 기획 · Bridge)" title="그룹의 한 줄 정보 — 제목 아래에 표시됩니다">
    ${btns.length ? `<div class="links">${btns.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}</div>` : ""}
    ${vids.length ? `<div class="vid-row">${vids.map(l => `<a class="vid" href="${esc(l.url)}" target="_blank" rel="noopener"><img src="https://img.youtube.com/vi/${yt(l.url)}/hqdefault.jpg" alt=""><span class="vid-play"></span><span class="vid-cap">${esc(String(l.label||"").replace(/^[▶►▷]\s*/, ""))}</span></a>`).join("")}</div>` : ""}
    ${m.cover ? `<img class="cover" src="${esc(m.cover)}" alt="">` : ""}
    ${(m.lessons || []).length > 1 ? `<nav class="jump">${m.lessons.map((l, i) => `<button type="button" data-jump="${ui}-${mi}-${i}"${i === li ? ' class="on"' : ""}>${esc(l.title)}</button>`).join("")}</nav>` : ""}
    <p class="gp-hint">사이트의 그룹 머리말 그대로입니다. 기간 줄은 여기서 바로 고치고, 제목·대표 이미지는 왼쪽 목록의 그룹 줄에서 고칩니다.</p>

}

function bindForm(){

  const cur = current(); if (!cur) return;

  document.getElementById("fTitle").oninput = e => {
    cur.l.title = e.target.value; save();

  document.getElementById("fTag").oninput = e => { cur.l.tag = e.target.value; save(); };

  document.getElementById("linkAdd").onclick = () => {

  });
  document.getElementById("linkList").addEventListener("click", e => {
    if (e.target.dataset.linkdel !== undefined){
      cur.l.links.splice(+e.target.dataset.linkdel, 1); save(); renderForm();
    }

  ed.oninput = e => {
    cur.l.html = edHtml(ed); save(); buildRail(); markEmpty();
    /* 글자를 치고 지우는 건 "type" 으로 묶고, 그 밖(붙여넣기·서식)은 한 단계씩 남긴다 */
    const typing = /^(insert(Text|CompositionText)|delete(Content|Word|SoftLine|HardLine)(Backward|Forward)?)$/
      .test((e && e.inputType) || "");
    histRecord(typing ? "type" : "op");
    if (slashCtx()) slashOpen(); else slashClose();
  };
  document.querySelectorAll("[data-hist]").forEach(b => {
    b.onmousedown = ev => ev.preventDefault();
    b.onclick = () => b.dataset.hist === "undo" ? undo() : redo();
  });
  ed.addEventListener("paste", onPaste);
  ed.addEventListener("drop", onDrop);
  ed.addEventListener("dragover", e => e.preventDefault());
  ed.addEventListener("keydown", onEditorKey);
  ed.addEventListener("focus", () => {
    /* 포커스가 없으면 이 설정이 먹지 않는다. 없으면 엔터마다 <div>가 생겨
       사이트의 p 기준 여백이 안 먹는다 */
    try { document.execCommand("defaultParagraphSeparator", false, "p"); } catch(_) {}
  });
  ed.addEventListener("blur", () => setTimeout(slashClose, 120));
  markEmpty();

  /* 위쪽 도구막대만. #selBar 의 버튼은 자기 리스너가 따로 있어서 여기까지 묶으면 두 번 실행된다 */
  document.querySelectorAll(".toolbar [data-cmd]").forEach(b => {
    b.onmousedown = e => e.preventDefault();  // 선택 영역 유지
    b.onclick = () => applyBlockCmd(b.dataset.cmd, ed);
  });
}

/* 편집 중에만 붙는 표시용 클래스 — data.js에 새어 나가지 않도록 저장 직전에 벗긴다 */
const TEMP_CLASS = ["img-sel","img-drag","img-drop-left","img-drop-right","blk-hi","blk-drag",
                    "blk-drop","blk-drop-after","blk-drop-left","blk-drop-right","is-empty","blk-sel"];
function edHtml(ed){
  const c = ed.cloneNode(true);
  c.querySelectorAll("." + TEMP_CLASS.join(",.")).forEach(el => {
    TEMP_CLASS.forEach(k => el.classList.remove(k));
  });
  c.querySelectorAll('[class=""]').forEach(el => el.removeAttribute("class"));
  c.querySelectorAll(".vid[contenteditable]").forEach(el => el.removeAttribute("contenteditable"));
  return c.innerHTML;
}

function flush(){
  const ed = document.getElementById("editor");
  const cur = current();
  if (ed && cur){ cur.l.html = edHtml(ed); save(); }
  if (typeof histRecord === "function") histRecord("op");
}

/* ============================================================
   툴바 동작
   ============================================================ */
function insertBlock(ed, html){
  ed.focus();
  const sel2 = window.getSelection();
  const frag = document.createRange().createContextualFragment(html);
  const first = frag.firstElementChild, focusEl = frag.querySelector("[data-focus]");
  let host = null;
  if (sel2.rangeCount && ed.contains(sel2.anchorNode)){
    let node = sel2.anchorNode;
    while (node && node.parentNode !== ed) node = node.parentNode;
    host = node;
    if (node) node.after(frag); else ed.appendChild(frag);
  } else ed.appendChild(frag);
  /* 빈 문단에서 넣었다면 그 문단은 없앤다 — 노션처럼 빈 줄이 남지 않게 */
  if (host && host.tagName === "P" && !host.textContent.trim() && !host.querySelector("img"))
    host.remove();
  if (first){
    const r = document.createRange();
    const target = focusEl || first;
    /* 안내 문구가 들어 있으면 통째로 골라 둔다 — 노션처럼 바로 쳐서 덮어쓸 수 있게 */
    r.selectNodeContents(target);
    if (!target.textContent.trim()) r.collapse(false);
    sel2.removeAllRanges(); sel2.addRange(r);
  }
  flush();
  if (typeof buildRail === "function") buildRail();
}

function runCmd(cmd, ed){
  ed.focus();
  switch(cmd){
    case "h2": document.execCommand("formatBlock", false, "h2"); break;
    case "h3": document.execCommand("formatBlock", false, "h3"); break;
    case "p":  document.execCommand("formatBlock", false, "p");  break;
    case "ul": document.execCommand("insertUnorderedList"); break;
    case "ol": document.execCommand("insertOrderedList"); break;
    case "bold": document.execCommand("bold"); break;
    case "mark": {
      const s = window.getSelection().toString();
      if (!s) return toast("강조할 글자를 먼저 선택하세요", true);
      document.execCommand("insertHTML", false, `<span class="mark">${esc(s)}</span>`);
      break;
    }
    case "em": {
      const s = window.getSelection().toString();
      if (!s) return toast("강조할 글자를 먼저 선택하세요", true);
      document.execCommand("insertHTML", false, `<em>${esc(s)}</em>`);
      break;
    }
    case "link": {
      const s = window.getSelection().toString();
      if (!s) return toast("링크를 걸 글자를 먼저 선택하세요", true);
      const url = prompt("링크 주소를 입력하세요", "https://");
      if (url) document.execCommand("createLink", false, url);
      break;
    }
    case "callout":
      insertBlock(ed, `<div class="callout"><div class="callout-ico">💬</div><div class="callout-body"><p data-focus>강조할 내용</p></div></div><p><br></p>`);
      return;
    case "insight":
      insertBlock(ed, `<div class="callout insight"><div class="callout-ico">💡</div><div class="callout-body"><p data-focus>회고·인사이트 내용</p></div></div><p><br></p>`);
      return;
    case "problem":
      insertBlock(ed, `<div class="callout problem"><div class="callout-ico">⚠</div><div class="callout-body"><p data-focus>문제 상황</p></div></div><p><br></p>`);
      return;
    case "quote":
      insertBlock(ed, `<div class="quote"><span style="display:inline;font-size:inherit;font-weight:inherit;color:inherit" data-focus>핵심 문장</span><span>부연 설명</span></div><p><br></p>`);
      return;
    case "table": {
      const cols = Math.max(2, Math.min(6, +prompt("열 개수 (2~6)", "2") || 2));
      const rows = Math.max(1, Math.min(20, +prompt("내용 행 개수 (1~20)", "3") || 3));
      let h = "<table><tr>";
      for (let c = 0; c < cols; c++) h += `<th>${c === 0 ? "항목" : "내용"}</th>`;
      h += "</tr>";
      for (let r = 0; r < rows; r++){
        h += "<tr>";
        for (let c = 0; c < cols; c++) h += "<td>&nbsp;</td>";
        h += "</tr>";
      }
      h += "</table><p><br></p>";
      insertBlock(ed, h);
      return;
    }
    case "divider":
      insertBlock(ed, `<hr style="border:none;border-top:1px solid var(--border-1);margin:26px 0"><p data-focus><br></p>`);
      return;
    case "imgrow": pendingEditor = ed; document.getElementById("rowPicker").click(); return;
    case "cards": openCards(ed); return;
    case "image": pickImage(ed); return;
    case "video": insertVideo(ed); return;
    case "clear": document.execCommand("removeFormat"); break;
  }
  flush();
}

const BADGE_CLASS = { "민트":"", "초록":" l2", "주황":" l1" };
const CLASS_BADGE = { "":"민트", "l2":"초록", "l1":"주황" };
let cardRows = [];   // [{ico:{type:'img'|'emoji'|null,val:''}, name, badge, color}]
let cardTargetGrid = null;

/* 커서가 카드 묶음 안에 있으면 그 묶음을 편집 대상으로 잡는다 */
function findGrid(ed){
  const s2 = window.getSelection();
  if (!s2.rangeCount) return null;
  let n = s2.anchorNode;
  while (n && n !== ed){
    if (n.nodeType === 1 && n.classList && n.classList.contains("skill-grid")) return n;
    n = n.parentNode;
  }
  return null;
}

/* ============================================================
   영상 카드 — 유튜브 썸네일 + 재생 아이콘. 사이트에서 누르면 새 창으로 영상이 열린다.

function ytId(url){
  const m = String(url||"").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/);
  return m ? m[1] : null;
}
function vidHtml(id, cap){
  return `<a class="vid" href="https://youtu.be/${id}" target="_blank" rel="noopener" contenteditable="false">` +
    `<img src="https://img.youtube.com/vi/${id}/maxresdefault.jpg" alt="${esc(cap)} 썸네일">` +
    `<span class="vid-play"></span><span class="vid-cap">${esc(cap)}</span></a>`;
}
function insertVideo(ed, cur){
  const url = prompt("유튜브 영상 주소", cur ? cur.getAttribute("href") : "https://youtu.be/");
  if (url == null) return;
  const id = ytId(url);
  if (!id) return toast("유튜브 주소가 아닙니다 (youtu.be/… 또는 youtube.com/watch?v=…)", true);
  const capEl = cur && cur.querySelector(".vid-cap");
  const cap = prompt("카드에 보일 이름", capEl ? capEl.textContent : "플레이 영상");
  if (cap == null) return;
  const html = vidHtml(id, cap.trim() || "플레이 영상");
  if (cur){
    const frag = document.createRange().createContextualFragment(html);
    cur.replaceWith(frag);
    clearBlkSel(); hideBlkTools(); flush(); buildRail();
    return toast("영상 카드를 바꿨습니다");
  }
  insertBlock(ed, html + `<p data-focus><br></p>`);
  toast("영상 카드를 넣었습니다 — 더블클릭하면 주소·이름을 바꿉니다");
}
/* 편집기에 올라온 카드는 통째로 잡히게, 저장할 때는 그 표시를 뗀다 */
function armVids(ed){

}
/* 이미지 도구·끌기 대상이 되는 img — 영상 카드 안의 썸네일은 제외 */
function imgAt(t){

  return (im && !im.closest(".vid")) ? im : null;
}
document.addEventListener("click", e => {

document.addEventListener("dblclick", e => {
