document.getElementById("imgPicker").onchange = e => {
  const f = e.target.files[0];
  if (f && pendingEditor) addImage(f, pendingEditor);
  e.target.value = "";
};
const MAX_ROW = 4;          /* 한 줄에 나란히 놓을 수 있는 최대 장수 */
const MAX_BYTES = 4 * 1024 * 1024;
let imgClip = [];           /* 편집기 안에서 Ctrl+C로 복사해 둔 이미지 */

function readFiles(files){
  return Promise.all([...files].map(f => new Promise(res => {
    const r = new FileReader();
    r.onload  = () => res({ url:r.result, name:(f.name || "image.png").replace(/[^\w.\-]/g, "_") });
    r.onerror = () => res(null);
    r.readAsDataURL(f);
  }))).then(l => l.filter(Boolean));
}
function tooBig(files){
  const over = [...files].find(f => f.size > MAX_BYTES);
  if (over) toast(`4MB를 넘는 이미지가 있습니다 — ${over.name || ""}`, true);
  return !!over;
}
function imgHtml(x){
  return `<img class="doc-img" src="${x.url}" alt="${esc(x.name)}" data-name="${esc(x.name)}">`;
}
const CAPTION = `<p style="text-align:center;font-size:12px;color:var(--ink-3)" data-focus>[이미지 설명]</p>`;

/* 한 장이면 단독 블록, 여러 장이면 한 줄(img-row)로 넣는다 */
function placeImages(list, ed){
  if (!list || !list.length || !ed) return;
  if (list.length > MAX_ROW){
    toast(`한 줄에는 ${MAX_ROW}장까지입니다. 앞의 ${MAX_ROW}장만 넣습니다`, true);
    list = list.slice(0, MAX_ROW);
  }
  if (list.length === 1){
    const x = list[0];
    insertBlock(ed,
      `<img class="doc-img" src="${x.url}" alt="${esc(x.name)}" data-name="${esc(x.name)}" style="width:100%">
       ${CAPTION}`);
    return toast("이미지를 넣었습니다");
  }
  insertBlock(ed, `<div class="img-row">${list.map(imgHtml).join("")}</div>${CAPTION}`);
  toast(`이미지 ${list.length}장을 한 줄에 넣었습니다`);
}

/* 이미 있는 줄 뒤에 이어 붙인다 */
function appendToRow(row, list){
  const room = MAX_ROW - row.querySelectorAll("img").length;
  if (room <= 0) return toast(`한 줄에는 ${MAX_ROW}장까지입니다`, true);
  if (list.length > room){
    toast(`자리가 ${room}장 남아 그만큼만 넣었습니다`, true);
    list = list.slice(0, room);
  }
  list.forEach(x => {
    const im = document.createElement("img");
    im.className = "doc-img"; im.src = x.url;
    im.setAttribute("data-name", x.name); im.alt = x.name;
    row.appendChild(im);
  });
  evenRow(row);
  flush(); buildRail();
  toast(`${list.length}장을 줄에 더했습니다`);
}
function evenRow(row){
  [...row.querySelectorAll("img")].forEach(im => {
    im.style.flex = ""; im.style.width = ""; im.style.height = "";
  });
}

/* 붙여넣기·끌어놓기 공통 진입점.
   이미지를 골라 둔 상태라면 그 이미지 옆에 나란히 붙인다 — 별도 버튼 없이 병렬 배치가 되게. */
function dropImages(list, ed){
  if (!list || !list.length || !ed) return;
  if (selImg && ed.contains(selImg)){
    if (inRow(selImg)) return appendToRow(selImg.parentElement, list);
    const row = document.createElement("div");
    row.className = "img-row";
    selImg.before(row); row.appendChild(selImg);
    selImg.style.width = ""; selImg.style.flex = "";
    return appendToRow(row, list);
  }
  placeImages(list, ed);
}

/* 다른 곳에서 복사해 온 서식은 벗겨서 넣는다 — 남의 색·글꼴이 섞이면 사이트 디자인이 깨진다 */
const PASTE_TAGS = {P:1,BR:1,STRONG:1,B:1,EM:1,I:1,U:1,UL:1,OL:1,LI:1,H2:1,H3:1,A:1,
                    TABLE:1,THEAD:1,TBODY:1,TR:1,TH:1,TD:1,IMG:1,HR:1,SPAN:1,DIV:1};
const PASTE_CLASS = /^(doc-img|img-row|callout|callout-ico|callout-body|insight|problem|quote|mark|center|skill|skill-grid|skill-head|skill-ico|skill-ico-emoji|skill-name|skill-level|l1|l2|timeline|when|vid|vid-play|vid-cap)$/;
function cleanPaste(html){
  const box = document.createElement("div");
  box.innerHTML = html;
  box.querySelectorAll("script,style,meta,link,noscript,iframe,object").forEach(n => n.remove());
  /* 웹에서 복사한 이미지는 주소가 곧 만료된다(노션 서명 URL). 파일로 붙여넣게 유도한다 */
  let dropped = 0;
  box.querySelectorAll("img").forEach(im => {
    if (!/^(data:|https:\/\/img\.youtube\.com\/)/i.test(im.getAttribute("src") || "")){ im.remove(); dropped++; }
  });
  [...box.querySelectorAll("*")].forEach(el => {
    const tag = el.tagName;
    if (tag === "H1" || tag === "H4" || tag === "H5" || tag === "H6" || tag === "BLOCKQUOTE"){
      const rep = document.createElement(tag === "H1" ? "h2" : tag === "BLOCKQUOTE" ? "p" : "h3");
      rep.innerHTML = el.innerHTML;
      el.replaceWith(rep);
      return;
    }
    if (!PASTE_TAGS[tag]) return el.replaceWith(...el.childNodes);
    const keep = (el.getAttribute("class") || "").split(/\s+/).filter(c => PASTE_CLASS.test(c));
    /* 글자 크기(px)만은 살린다 — 편집기 안에서 복사한 글이 크기를 잃지 않게 */
    const fs = tag === "SPAN"
      ? ((el.getAttribute("style") || "").match(/font-size:\s*(\d{1,2})px/) || [])[1] : null;
    /* 남의 사이트에서 온 껍데기 DIV/SPAN은 벗겨 낸다. 그대로 두면 블록 하나에 문서 전체가 들어간다 */
    if ((tag === "DIV" || tag === "SPAN") && !keep.length && !fs) return el.replaceWith(...el.childNodes);
    [...el.attributes].forEach(a => {
      const n = a.name.toLowerCase();
      if (n === "href" || n === "src" || n === "alt" || n === "data-name") return;
      el.removeAttribute(a.name);
    });
    if (keep.length) el.setAttribute("class", keep.join(" "));
    if (fs) el.style.fontSize = fs + "px";
  });
  if (dropped) toast(`웹에서 복사한 이미지 ${dropped}장은 주소가 곧 만료돼 빼놨습니다. 이미지 파일로 붙여넣어 주세요`, true);
  return box.innerHTML;
}

function onPaste(e){
  const ed = e.currentTarget;
  const dt = e.clipboardData;
  if (!dt) return;
  const files = [...(dt.items || [])]
    .filter(i => i.kind === "file" && i.type.startsWith("image/"))
    .map(i => i.getAsFile()).filter(Boolean);
  if (files.length){
    e.preventDefault();
    if (tooBig(files)) return;
    readFiles(files).then(l => dropImages(l, ed));
    return;
  }
  const text = (dt.getData("text/plain") || "").trim();
  if (!text && imgClip.length){          /* 편집기 안에서 복사해 둔 이미지 */
    e.preventDefault();
    return dropImages(imgClip.slice(), ed);
  }
  const html = dt.getData("text/html");
  if (html){
    e.preventDefault();
    document.execCommand("insertHTML", false, cleanPaste(html));
    flush(); buildRail(); markEmpty();
  }
}

function onDrop(e){
  const ed = e.currentTarget;
  const files = [...(e.dataTransfer.files || [])].filter(x => x.type.startsWith("image/"));
  if (!files.length) return;
  e.preventDefault();
  if (tooBig(files)) return;
  readFiles(files).then(l => dropImages(l, ed));
}

document.getElementById("rowPicker").onchange = e => {
  const files = [...e.target.files].filter(f => f.type.startsWith("image/"));
  e.target.value = "";
  const ed = pendingEditor || document.getElementById("editor");
  if (!files.length || !ed || tooBig(files)) return;
  readFiles(files).then(l => placeImages(l, ed));
};

let rowTarget = null;
document.getElementById("rowAddPicker").onchange = e => {
  const files = [...e.target.files].filter(f => f.type.startsWith("image/"));
  e.target.value = "";
  const row = rowTarget; rowTarget = null;
  if (!files.length || !row || tooBig(files)) return;
  readFiles(files).then(l => appendToRow(row, l));
};

function addImage(file, ed){
  if (tooBig([file])) return;
  readFiles([file]).then(l => dropImages(l, ed));
}

/* 고른 이미지를 Ctrl+C / Ctrl+X 로 다루게 한다 */
function clipTarget(){
  if (!selImg) return null;
  const s = window.getSelection();
  if (s && !s.isCollapsed && String(s).trim()) return null;   /* 글자 선택이 우선 */
  return { url: selImg.src, name: selImg.getAttribute("data-name") || "image.png" };
}
document.addEventListener("copy", e => {
  const t = clipTarget(); if (!t) return;
  imgClip = [t];
  try { e.clipboardData.setData("text/plain", ""); } catch(_){}
  e.preventDefault();
  toast("이미지를 복사했습니다 · 붙여넣을 이미지를 고르고 Ctrl+V");
});
document.addEventListener("cut", e => {
  const t = clipTarget(); if (!t) return;
  imgClip = [t];
  try { e.clipboardData.setData("text/plain", ""); } catch(_){}
  e.preventDefault();
  const im = selImg, row = im.parentElement;
  deselectImg(); im.remove();
  if (row && row.classList && row.classList.contains("img-row") && !row.querySelector("img")) row.remove();
  flush(); buildRail();
  toast("이미지를 잘라냈습니다 · Ctrl+V로 옮겨 붙이세요");
});

/* ============================================================
   이미지 크기 조절 — 클릭 → 핸들 드래그 / 배율 버튼 / Ctrl+휠
   ============================================================ */
const tools = document.getElementById("imgTools");
const itBar = tools.querySelector(".it-bar");
const itHandle = document.getElementById("itHandle");
const itPct = document.getElementById("itPct");
let selImg = null;

function inRow(img){ return !!(img && img.parentElement && img.parentElement.classList
                                    && img.parentElement.classList.contains("img-row")); }

/* 같은 줄 안에서 좌우로 자리를 바꾼다 */
function moveImgInRow(img, dir){
  if (!inRow(img)) return toast("줄 안의 이미지가 아닙니다", true);
  const sib = dir < 0 ? img.previousElementSibling : img.nextElementSibling;
  if (!sib) return toast(dir < 0 ? "이미 맨 왼쪽입니다" : "이미 맨 오른쪽입니다", true);
  dir < 0 ? sib.before(img) : sib.after(img);
  flush(); placeTools(); buildRail();
}

function widthPct(img){
  if (inRow(img)){
    const f = img.style.flexBasis || "";
    if (f.endsWith("%")) return Math.round(parseFloat(f));
    const row = img.parentElement.clientWidth || 1;
    return Math.max(1, Math.min(100, Math.round(img.getBoundingClientRect().width / row * 100)));
  }
  const w = img.style.width;
  if (w && w.endsWith("%")) return Math.round(parseFloat(w));
  const parent = img.parentElement;
  const base = (parent && parent.clientWidth) || img.naturalWidth || 1;
  return Math.max(1, Math.min(100, Math.round(img.getBoundingClientRect().width / base * 100)));
}
function setWidth(img, pct){
  pct = Math.max(10, Math.min(100, Math.round(pct)));
  if (inRow(img)){
    img.style.flex = `0 0 ${pct}%`;
    img.style.width = "auto";
    img.style.height = "auto";
    itPct.textContent = pct + "%";
    placeTools(); markPresets(pct); flush();
    return;
  }
  img.style.flex = "";
  img.style.width = pct + "%";
  img.style.height = "auto";
  if (!img.classList.contains("doc-img")) img.classList.add("doc-img");
  itPct.textContent = pct + "%";
  placeTools();
  markPresets(pct);
  flush();
}
function markPresets(pct){
  itBar.querySelectorAll("[data-w]").forEach(b =>
    b.classList.toggle("on", +b.dataset.w === pct));
  itBar.querySelectorAll("[data-align]").forEach(b =>
    b.classList.toggle("on", selImg &&
      ((b.dataset.align === "center") === selImg.classList.contains("center"))));
}
function placeTools(){
  if (!selImg) return;
  const ed = document.getElementById("editor");
  if (!ed || !ed.contains(selImg)) return deselectImg();
  const r = selImg.getBoundingClientRect();
  const main = document.querySelector(".main");
  const vr = main ? main.getBoundingClientRect() : { top:0, bottom:innerHeight };
  /* 화면 밖으로 스크롤되면 숨긴다 */
  if (r.bottom < vr.top || r.top > vr.bottom){ tools.hidden = true; return; }
  tools.hidden = false;
  const bw = itBar.offsetWidth, bh = itBar.offsetHeight;
  /* 막대는 이미지 안쪽 가운데 위에 얹는다. 이미지가 낮으면 위로 뺀다.
     이미지 위쪽이 화면 밖으로 밀리면 보이는 영역 맨 위에 붙어 따라온다 */
  let top  = r.height >= bh + 28 ? r.top + 8 : r.top - bh - 6;
  top  = Math.max(vr.top + 4, Math.min(top, Math.min(r.bottom - bh - 4, innerHeight - bh - 8)));
  let left = r.left + r.width / 2 - bw / 2;
  left = Math.max(8, Math.min(left, innerWidth - bw - 8));
  itBar.style.left = left + "px";
  itBar.style.top  = top + "px";
  itHandle.style.left = (r.right - 7) + "px";
  itHandle.style.top  = (r.bottom - 7) + "px";
}
function selectImg(img){
  deselectImg();
  selImg = img;
  img.classList.add("img-sel");
  const p = widthPct(img);
  itPct.textContent = p + "%";
  markPresets(p);
  placeTools();
}
function deselectImg(){
  if (selImg) selImg.classList.remove("img-sel");
  selImg = null;
  tools.hidden = true;
}

document.addEventListener("click", e => {
  const ed = document.getElementById("editor");
  if (!ed) return deselectImg();
  const img = imgAt(e.target);
  if (img && ed.contains(img) && !img.classList.contains("skill-ico")) return selectImg(img);
  if (!e.target.closest("#imgTools")) deselectImg();
});
itBar.addEventListener("click", e => {
  if (!selImg) return;
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.w) setWidth(selImg, +b.dataset.w);
  if (b.dataset.align){
    selImg.classList.toggle("center", b.dataset.align === "center");
    if (!selImg.classList.contains("doc-img")) selImg.classList.add("doc-img");
    markPresets(widthPct(selImg)); flush();
  }
  if (b.dataset.mv) return moveImgInRow(selImg, +b.dataset.mv);
  if (b.hasAttribute("data-imgcopy")){
    imgClip = [{ url: selImg.src, name: selImg.getAttribute("data-name") || "image.png" }];
    return toast("복사했습니다 · 붙여넣을 이미지를 고르고 Ctrl+V");
  }
  if (b.hasAttribute("data-rowadd")){
    rowTarget = inRow(selImg) ? selImg.parentElement : null;
    if (!rowTarget){
      /* 단독 이미지라면 그 자리에 줄을 만들어 준다 */
      const row = document.createElement("div");
      row.className = "img-row";
      selImg.before(row); row.appendChild(selImg);
      selImg.style.width = ""; selImg.style.flex = "";
      rowTarget = row;
    }
    document.getElementById("rowAddPicker").click();
    return;
  }
  if (b.hasAttribute("data-rowout")){
    const row = selImg.parentElement;
    if (!row || !row.classList.contains("img-row")) return toast("줄 안의 이미지가 아닙니다", true);
    selImg.style.flex = ""; selImg.style.width = "100%";
    row.after(selImg);
    if (!row.querySelector("img")) row.remove();
    flush(); placeTools(); toast("줄에서 빼냈습니다");
    if (typeof buildRail === "function") buildRail();
    return;
  }
  if (b.hasAttribute("data-imgdel")){
    const t = selImg, row = t.parentElement;
    deselectImg(); t.remove();
    if (row && row.classList.contains("img-row") && !row.querySelector("img")) row.remove();
    flush(); toast("이미지를 지웠습니다");
    if (typeof buildRail === "function") buildRail();
  }
});
/* 핸들 드래그 */
itHandle.addEventListener("mousedown", e => {
  if (!selImg) return;
  e.preventDefault();
  const startX = e.clientX;
  const startW = selImg.getBoundingClientRect().width;
  const base = selImg.parentElement.clientWidth || startW;
  const move = ev => setWidth(selImg, (startW + (ev.clientX - startX)) / base * 100);
  const up = () => { document.removeEventListener("mousemove", move);
                     document.removeEventListener("mouseup", up); };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
});
/* Ctrl(⌘)+휠 */
document.addEventListener("wheel", e => {
  if (!selImg || !(e.ctrlKey || e.metaKey)) return;
  const img = imgAt(e.target);
  if (img !== selImg && !e.target.closest("#imgTools")) return;
  e.preventDefault();
  setWidth(selImg, widthPct(selImg) + (e.deltaY < 0 ? 5 : -5));
}, { passive:false });

/* .main 뿐 아니라 .editor(overflow:auto) 안쪽 스크롤도 잡아야 해서 캡처 단계에서 듣는다 */
document.addEventListener("scroll", placeTools, true);
window.addEventListener("resize", placeTools);


/* ============================================================
   본문 블록 조작 — 문단·표·박스·이미지를 통째로 옮기고 지운다
   ============================================================ */
const blkTools = document.getElementById("blkTools");
const railEl = () => document.getElementById("blkRail");
let curBlk = null, dragBlk = null, dragImg = null, dragPack = [];

function edEl(){ return document.getElementById("editor"); }
function topBlock(node, ed){
  while (node && node.parentNode !== ed) node = node.parentNode;
  return (node && node !== ed) ? node : null;
}
function saveBlocks(){
  const ed = edEl(), cur = current();
  if (ed && cur){ cur.l.html = edHtml(ed); save(); }
  histRecord("op");
  buildRail();
}

/* ---- 왼쪽 손잡이 레일: 블록마다 하나씩 세운다 ---- */
let railJob = null;
function buildRail(){
  cancelAnimationFrame(railJob);
  railJob = requestAnimationFrame(() => {
    const ed = edEl(), blkRail = railEl();
    if (!ed || !blkRail) return;
    blkRail.innerHTML = "";
    [...ed.children].forEach((blk, i) => {
      const top = (ed.offsetTop + blk.offsetTop + Math.min(6, blk.offsetHeight / 2 - 12)) + "px";
      const plus = document.createElement("div");
      plus.className = "g plus";
      plus.textContent = "＋";
      plus.dataset.i = i;
      plus.title = "아래에 블록 추가";
      plus.style.top = top;
      blkRail.appendChild(plus);
      const g = document.createElement("div");
      g.className = "g";
      g.textContent = "⠿";
      g.draggable = true;
      g.dataset.i = i;
      g.title = "드래그해서 옮기기 · 클릭하면 도구";
      g.style.top = top;
      blkRail.appendChild(g);
    });
  });
}
function blkAt(i){ const ed = edEl(); return ed ? ed.children[+i] : null; }

function highlight(blk){
  if (curBlk && curBlk !== blk) curBlk.classList.remove("blk-hi");
  curBlk = blk || null;
  if (curBlk) curBlk.classList.add("blk-hi");
  const rail = railEl();
  if (rail) [...rail.children].forEach(g =>
    g.classList.toggle("on", curBlk && blkAt(g.dataset.i) === curBlk));
}
function showBlkTools(blk, near){
  if (!blk) return hideBlkTools();
  const multi = blkSel.length > 1;
  if (multi){
    if (curBlk) curBlk.classList.remove("blk-hi");
    curBlk = null;
  } else highlight(blk);
  const cnt = document.getElementById("blkCnt");
  if (cnt){ cnt.hidden = !multi; cnt.textContent = multi ? blkSel.length + "개" : ""; }
  const r = (near || blk).getBoundingClientRect();
  blkTools.classList.add("show");
  const w = blkTools.offsetWidth || 104;
  let left = r.left - w - 6;
  if (left < 8) left = r.right + 6;
  blkTools.style.left = Math.max(8, Math.min(left, innerWidth - w - 8)) + "px";
  blkTools.style.top = Math.max(8, r.top - 1) + "px";
}
function hideBlkTools(){
  if (curBlk) curBlk.classList.remove("blk-hi");
  curBlk = null;
  blkTools.classList.remove("show");
  const rail = railEl();
  if (rail) [...rail.children].forEach(g => g.classList.remove("on"));
}

/* 손잡이: 올리면 강조, 누르면 도구 */
document.addEventListener("mouseover", e => {
  if (!e.target || !e.target.closest) return;
  const g = e.target.closest("#blkRail .g"); if (!g) return;
  highlight(blkAt(g.dataset.i));
});
document.addEventListener("click", e => {
  if (!e.target || !e.target.closest) return;
  const g = e.target.closest("#blkRail .g"); if (!g) return;
  if (g.classList.contains("plus")) return addBlockAfter(blkAt(g.dataset.i));
  const blk = blkAt(g.dataset.i);
  /* Shift로 누르면 먼저 고른 블록까지 범위로 넓힌다 */
  if (e.shiftKey && blkAnchor){
    setBlkSel(blkRange(blkAnchor, blk), true);
    return showBlkTools(blkSel[0], g);
  }
  clearBlkSel();
  blkAnchor = blk;
  showBlkTools(blk, g);
});

/* ＋ 를 누르면 빈 문단을 만들고 곧바로 블록 목록을 띄운다 */
function addBlockAfter(blk){
  const ed = edEl(); if (!ed) return;
  const p = document.createElement("p");
  p.innerHTML = "<br>";
  blk ? blk.after(p) : ed.appendChild(p);
  const rg = document.createRange();
  rg.selectNodeContents(p); rg.collapse(true);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(rg);
  ed.focus();
  saveBlocks();
  document.execCommand("insertText", false, "/");
  slashOpen();
}

/* 드래그로 옮기기 */
document.addEventListener("dragstart", e => {
  if (!e.target || !e.target.closest) return;
  const g = e.target.closest("#blkRail .g"); if (!g) return;
  dragBlk = blkAt(g.dataset.i);
  if (!dragBlk) return e.preventDefault();
  /* 여러 개를 고른 상태에서 그중 하나를 끌면 전부 같이 옮긴다 */
  dragPack = blkSel.length > 1 && blkSel.includes(dragBlk) ? blkSel.slice() : [dragBlk];
  dragPack.forEach(b => b.classList.add("blk-drag"));
  hideBlkTools();
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", "blk");
});
/* 이미지 자체를 끌어서 옮긴다 — 손잡이를 잡지 않아도 병렬 배치·순서 변경이 되게 */
document.addEventListener("dragstart", e => {
  const ed = edEl(); if (!ed || !e.target || !e.target.closest) return;
  const im = imgAt(e.target);
  if (!im || !ed.contains(im) || im.classList.contains("skill-ico")) return;
  dragImg = im;
  im.classList.add("img-drag");
  hideBlkTools(); deselectImg(); slashClose();
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", "img");
});

document.addEventListener("dragend", () => {
  if (dragImg){ dragImg.classList.remove("img-drag"); dragImg = null; }
  dragPack.forEach(b => b.classList.remove("blk-drag"));
  if (dragBlk) dragBlk.classList.remove("blk-drag");
  dragPack = []; dragBlk = null;
  clearMarks();
  buildRail();
});

/* 끌고 있는 이미지를 놓을 대상 이미지와 좌·우 어느 쪽인지 */
function imgDropTarget(e){
  const ed = edEl();
  if (!dragImg || !ed || !e.target || !e.target.closest) return null;
  const im = e.target.closest("img");
  if (!im || im === dragImg || !ed.contains(im) || im.classList.contains("skill-ico")) return null;
  const r = im.getBoundingClientRect();
  return { img: im, side: e.clientX > r.left + r.width / 2 ? "right" : "left" };
}

/* 대상 이미지의 옆자리로 옮긴다. 대상이 단독 이미지면 그 자리에 줄을 만든다 */
function moveImageNextTo(src, target, side){
  const srcRow = inRow(src) ? src.parentElement : null;
  let row = inRow(target) ? target.parentElement : null;
  if (!row){
    row = document.createElement("div");
    row.className = "img-row";
    target.before(row); row.appendChild(target);
    target.style.width = ""; target.style.flex = "";
  }
  if (row !== srcRow && row.querySelectorAll("img").length >= MAX_ROW){
    toast(`한 줄에는 ${MAX_ROW}장까지입니다`, true);
    return false;
  }
  side === "right" ? target.after(src) : target.before(src);
  if (srcRow && srcRow !== row && !srcRow.querySelector("img")) srcRow.remove();
  evenRow(row);
  return true;
}
function dropTarget(e){
  const ed = edEl();
  if (!ed || !e.target || !e.target.closest) return null;
  if (!ed.contains(e.target)) return null;
  const blk = topBlock(e.target, ed);
  return (blk && !dragPack.includes(blk)) ? blk : null;
}
function isImgBlock(el){
  return el && (el.tagName === "IMG" || el.classList.contains("img-row"));
}
/* 이미지 블록을 끌어 다른 이미지 위에 올렸을 때 — 좌·우 바깥 1/3 이면 그 옆에 나란히 놓는다.
   가운데 1/3 은 위/아래로 옮기는 자리다. 대상이 이미지 줄이면 포인터 아래 이미지가 기준(anchor)이 된다 */
const MERGE_ZONE = 1 / 3;
function mergeSide(e, blk){
  const pack = dragPack.length ? dragPack : [dragBlk];
  if (!isImgBlock(blk) || !pack.every(isImgBlock)) return null;
  const hov = imgAt(e.target);
  const anchor = blk.tagName === "IMG" ? blk : (hov && blk.contains(hov) ? hov : null);
  const r = (anchor || blk).getBoundingClientRect();
  if (!r.width) return null;
  const x = (e.clientX - r.left) / r.width;
  if (x > MERGE_ZONE && x < 1 - MERGE_ZONE) return null;
  return { side: x >= 1 - MERGE_ZONE ? "right" : "left", anchor };
}
function markMerge(m, blk){
  if (m.anchor) m.anchor.classList.add(m.side === "right" ? "img-drop-right" : "img-drop-left");
  else blk.classList.add(m.side === "right" ? "blk-drop-right" : "blk-drop-left");
}
function clearMarks(){
  document.querySelectorAll(".blk-drop,.blk-drop-after,.blk-drop-left,.blk-drop-right,.img-drop-left,.img-drop-right")
    .forEach(x => x.classList.remove("blk-drop","blk-drop-after","blk-drop-left","blk-drop-right",
                                     "img-drop-left","img-drop-right"));
}
document.addEventListener("dragover", e => {
  if (dragImg){
    const ed = edEl();
    if (!ed || !ed.contains(e.target)) return;
    e.preventDefault();
    clearMarks();
    const t = imgDropTarget(e);
    if (t) return t.img.classList.add(t.side === "right" ? "img-drop-right" : "img-drop-left");
    const b = topBlock(e.target, ed);
    if (!b || b === dragImg) return;
    const br = b.getBoundingClientRect();
    b.classList.add(e.clientY > br.top + br.height / 2 ? "blk-drop-after" : "blk-drop");
    return;
  }
  if (!dragBlk) return;
  const blk = dropTarget(e); if (!blk) return;
  e.preventDefault();
  clearMarks();
  const m = mergeSide(e, blk);
  if (m) return markMerge(m, blk);
  const r = blk.getBoundingClientRect();
  blk.classList.add(e.clientY > r.top + r.height / 2 ? "blk-drop-after" : "blk-drop");
});
document.addEventListener("drop", e => {
  if (dragImg){
    const ed = edEl();
    if (!ed || !ed.contains(e.target)) return;
    e.preventDefault();          /* 브라우저 기본 이동을 막고 우리가 옮긴다 */
    clearMarks();
    const im = dragImg;
    const t = imgDropTarget(e);
    let moved = false;
    if (t){
      moved = moveImageNextTo(im, t.img, t.side);
      if (moved) toast(`같은 줄에 나란히 놓았습니다 (${t.img.parentElement.querySelectorAll("img").length}장)`);
    } else {
      const b = topBlock(e.target, ed);
      if (b && b !== im){
        const srcRow = inRow(im) ? im.parentElement : null;
        const br = b.getBoundingClientRect();
        (e.clientY > br.top + br.height / 2) ? b.after(im) : b.before(im);
        im.style.flex = ""; im.style.width = "100%";
        if (srcRow && !srcRow.querySelector("img")) srcRow.remove();
        else if (srcRow) evenRow(srcRow);
        moved = true;
        toast("이미지를 옮겼습니다");
      }
    }
    im.classList.remove("img-drag");
    dragImg = null;
    if (moved) saveBlocks(); else buildRail();
    return;
  }
  if (!dragBlk) return;
  const blk = dropTarget(e); if (!blk) return;
  e.preventDefault();
  const m = mergeSide(e, blk);
  clearMarks();

  if (m){
    /* 이미지끼리 합쳐 한 줄로 만든다. 여러 개를 골라 끌었으면 전부 들어간다 */
    const pack = dragPack.length ? dragPack : [dragBlk];
    const moving = [];
    pack.forEach(b => b.tagName === "IMG" ? moving.push(b) : moving.push(...b.querySelectorAll("img")));
    let row = blk.classList.contains("img-row") ? blk : null;
    if (!row){
      row = document.createElement("div");
      row.className = "img-row";
      blk.before(row);
      row.appendChild(blk);
    }
    if (row.querySelectorAll("img").length + moving.length > MAX_ROW){
      toast(`한 줄에는 ${MAX_ROW}장까지입니다`, true);
      return;                       /* dragend 가 표시 클래스를 정리한다 */
    }
    moving.forEach(im => { im.style.flex = ""; im.style.width = ""; im.style.height = ""; });
    const anchor = m.anchor || (blk.tagName === "IMG" ? blk : null);
    if (anchor) m.side === "right" ? anchor.after(...moving) : anchor.before(...moving);
    else        m.side === "right" ? row.append(...moving)   : row.prepend(...moving);
    /* 비어 버린 원래 줄은 치운다 */
    pack.forEach(b => { if (b.classList && b.classList.contains("img-row") && !b.querySelector("img")) b.remove(); });
    evenRow(row);
    dragBlk = null; dragPack = [];
    saveBlocks();
    toast(`같은 줄에 합쳤습니다 (${row.querySelectorAll("img").length}장)`);
    return;
  }

  const r = blk.getBoundingClientRect();
  const pack = dragPack.length ? dragPack : [dragBlk];
  if (e.clientY > r.top + r.height / 2) blk.after(...pack);
  else blk.before(...pack);
  saveBlocks();
  if (pack.length > 1) setBlkSel(pack, true);
  toast(pack.length > 1 ? `${pack.length}개를 옮겼습니다` : "블록을 옮겼습니다");
});

/* ---- 여러 블록 동시 선택 ----
   글자를 끌어 두 블록 이상에 걸치면 블록 단위 선택으로 바꾼다(노션과 같은 방식).
   레일 빈 곳을 끌어 범위로 고르거나, 손잡이를 Shift로 눌러 범위를 넓힐 수도 있다. */
let blkSel = [];
let blkAnchor = null;
let blkManual = false;   /* 레일에서 직접 고른 선택인가 (글자 선택으로 지워지면 안 된다) */

function setBlkSel(list, manual){
  blkSel.forEach(b => b.classList.remove("blk-sel"));
  blkSel = (list || []).filter(Boolean);
  blkSel.forEach(b => b.classList.add("blk-sel"));
  const rail = railEl();
  if (rail) [...rail.children].forEach(g =>
    g.classList.toggle("sel", blkSel.includes(blkAt(g.dataset.i))));
  blkManual = !!manual;
  if (blkSel.length > 1) showBlkTools(blkSel[0]);
}
function clearBlkSel(){
  blkManual = false;
  if (!blkSel.length) return;
  setBlkSel([]);
  hideBlkTools();
}
function blkRange(a, b){
  const ed = edEl(); if (!ed) return [];
  const kids = [...ed.children];
  let i = kids.indexOf(a), j = kids.indexOf(b);
  if (i < 0 || j < 0) return [];
  if (i > j) [i, j] = [j, i];
  return kids.slice(i, j + 1);
}
/* 글자 선택이 블록을 넘어가면 블록 선택으로 승격한다 */
function syncBlkSel(){
  const ed = edEl();
  if (!ed) return clearBlkSel();
  const s = window.getSelection();
  if (!s || !s.rangeCount || s.isCollapsed ||
      !ed.contains(s.anchorNode) || !ed.contains(s.focusNode))
    return blkManual ? undefined : clearBlkSel();
  const a = topBlock(s.anchorNode, ed), b = topBlock(s.focusNode, ed);
  if (!a || !b || a === b) return clearBlkSel();
  blkAnchor = a;
  setBlkSel(blkRange(a, b));
}
/* 도구가 실제로 다룰 블록들 */
function blkTargets(){
  return blkSel.length > 1 ? blkSel.slice() : (curBlk ? [curBlk] : []);
}

/* 본문을 직접 누르면 블록 선택은 푼다 */
document.addEventListener("mousedown", e => {

});

/* 빈 곳을 끌어 범위 고르기 — 레일, 편집 칸 좌우의 어두운 여백, 본문 아래 빈 곳 어디서든 시작된다.
   글자·입력칸·버튼·도구막대 위에서는 시작하지 않는다(거기서는 각자의 동작이 있다) */
const band = document.createElement("div");
band.id = "blkBand"; band.hidden = true;
function bandStartOK(e){
  const rail = railEl(), t = e.target;
  if (!rail || !t || !t.closest || e.button !== 0) return false;
  if (t === rail) return true;
  if (t.closest("#editor,.toolbar,.field,.linkrow,button,input,select,textarea,a,label," +
                "#blkTools,#imgTools,#selBar,#tblTools,#slashMenu,#overlay,.side,.topbar,.note")) return false;
  return !!t.closest(".main");
}
document.addEventListener("mousedown", e => {
  if (!bandStartOK(e)) return;
  const rail = railEl();
  const ed = edEl(); if (!ed) return;
  e.preventDefault();
  clearBlkSel(); hideBlkTools(); deselectImg();
  const wrap = rail.parentElement;
  const wr = wrap.getBoundingClientRect();
  const x0 = e.clientX, y0 = e.clientY;
  wrap.appendChild(band);
  band.hidden = false;
  const move = ev => {
    const top = Math.min(y0, ev.clientY) - wr.top;
    band.style.top = top + "px";
    band.style.height = Math.abs(ev.clientY - y0) + "px";
    band.style.left = (Math.min(x0, ev.clientX) - wr.left) + "px";
    band.style.width = Math.max(2, Math.abs(ev.clientX - x0)) + "px";
    const lo = Math.min(y0, ev.clientY), hi = Math.max(y0, ev.clientY);
    setBlkSel([...ed.children].filter(b => {
      const r = b.getBoundingClientRect();
      return r.bottom > lo && r.top < hi;
    }), true);
  };
  const up = () => {
    band.hidden = true; band.remove();
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    blkManual = blkSel.length > 0;
    if (blkSel.length === 1){ highlight(blkSel[0]); showBlkTools(blkSel[0]); }
    if (blkSel.length) blkAnchor = blkSel[0];
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
});

/* 도구 버튼 — 하나든 여럿이든 같은 경로로 다룬다 */
blkTools.addEventListener("click", e => {
  const b = e.target.closest("[data-blk]");
  if (!b) return;
  const list = blkTargets();
  if (!list.length) return;
  const ed = edEl(), act = b.dataset.blk;

  if (act === "turn") return openTurn(b, list);
  if (act === "up"){
    const p = list[0].previousElementSibling;
    if (p) list[list.length - 1].after(p);
  } else if (act === "down"){
    const n = list[list.length - 1].nextElementSibling;
    if (n) list[0].before(n);
  } else if (act === "dup"){
    let at = list[list.length - 1];
    list.forEach(x => { const c = x.cloneNode(true); at.after(c); at = c; });
    toast(list.length > 1 ? `${list.length}개를 복제했습니다` : "복제했습니다");
  } else if (act === "del"){
    const n = list.length;
    hideBlkTools(); clearBlkSel();
    list.forEach(x => x.remove());
    if (!ed.children.length) ed.innerHTML = "<p><br></p>";
    toast(n > 1 ? `${n}개를 지웠습니다` : "블록을 지웠습니다");
  }
  saveBlocks();
  if (blkSel.length > 1) setBlkSel(blkSel, true);
  else if (curBlk) showBlkTools(curBlk);
});

/* ---- 블록 종류 바꾸기 ---- */
const TURN_ITEMS = [
  { k:"h2",      n:"큰 제목" },

  { k:"p",       n:"본문" },
  { k:"ul",      n:"글머리 목록" },
  { k:"ol",      n:"번호 목록" },
  { k:"callout", n:"💬 강조 박스" },
  { k:"insight", n:"💡 회고 박스" },
  { k:"problem", n:"⚠ 문제 박스" },
  { k:"quote",   n:"❝ 인용구" }
];
function openTurn(anchor, list){
  slashIdx = 0;
  slashMenu.innerHTML = TURN_ITEMS.map((it, i) =>
    `<div class="sm-i${i ? "" : " on"}" data-turn="${it.k}"><span class="k">⇄</span>` +

let turnTargets = [];

/* 블록의 알맹이만 뽑아낸다. 상자·목록마다 내용이 든 자리가 다르다 */
function innerParts(el){
  if (el.classList && el.classList.contains("callout")){
    const body = el.querySelector(".callout-body");
    return body ? [...body.children].map(c => c.innerHTML).filter(x => x.trim()) : [el.innerHTML];
  }
  if (el.classList && el.classList.contains("quote")){
    return [...el.childNodes].map(n => n.nodeType === 1 ? n.innerHTML : esc(n.textContent))
      .filter(x => x.trim());
  }
  if (el.tagName === "UL" || el.tagName === "OL")
    return [...el.children].map(li => li.innerHTML);
  return [el.innerHTML];
}
function makeBlocks(kind, parts){
  const p = parts.length ? parts : ["<br>"];
  if (kind === "ul" || kind === "ol"){
    const list = document.createElement(kind);
    p.forEach(h => { const li = document.createElement("li"); li.innerHTML = h; list.appendChild(li); });
    return [list];
  }
  if (kind === "callout" || kind === "insight" || kind === "problem"){
    const ico = { callout:"💬", insight:"💡", problem:"⚠" }[kind];
    const box = document.createElement("div");
    box.className = "callout" + (kind === "callout" ? "" : " " + kind);
    box.innerHTML = `<div class="callout-ico">${ico}</div><div class="callout-body">` +
      p.map(h => `<p>${h}</p>`).join("") + `</div>`;
    return [box];
  }
  if (kind === "quote"){
    const q = document.createElement("div");
    q.className = "quote";
    q.innerHTML = p.map((h, i) => i === 0
      ? `<span style="display:inline;font-size:inherit;font-weight:inherit;color:inherit">${h}</span>`
      : `<span>${h}</span>`).join("");
    return [q];
  }
  return p.map(h => { const el = document.createElement(kind); el.innerHTML = h || "<br>"; return el; });
}
function turnInto(list, kind){
  const ed = edEl(); if (!ed || !list.length) return;
  /* 목록끼리는 알맹이를 합쳐 한 덩어리로 만든다 */
  const merge = (kind === "ul" || kind === "ol" || kind === "quote" ||
                 kind === "callout" || kind === "insight" || kind === "problem") && list.length > 1;
  let made = [];
  if (merge){
    const parts = list.flatMap(innerParts);
    made = makeBlocks(kind, parts);
    list[0].before(...made);
    list.forEach(x => x.remove());
  } else {
    list.forEach(x => {
      const els = makeBlocks(kind, innerParts(x));
      x.before(...els);
      x.remove();
      made.push(...els);
    });
  }
  clearBlkSel();
  hideBlkTools();
  saveBlocks();
  if (made.length > 1) setBlkSel(made, true);
  else if (made[0]){
    const rg = document.createRange();
    rg.selectNodeContents(made[0]); rg.collapse(false);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(rg);
    ed.focus();
  }
  toast("블록 종류를 바꿨습니다");
}

/* ============================================================
   노션식 편집 보조 — 슬래시 메뉴 · 선택 툴바 · 마크다운 단축 입력
   ============================================================ */
const slashMenu = document.getElementById("slashMenu");
const selBar    = document.getElementById("selBar");

const SLASH_ITEMS = [
  { cmd:"h2",      key:"H2", name:"큰 제목",    desc:"섹션을 나눈다",       kw:"h2 큰제목 heading title" },
  { cmd:"h3",      key:"H3", name:"소제목",      desc:"큰 제목 아래 단계",   kw:"h3 소제목 subtitle" },
  { cmd:"p",       key:"¶",  name:"본문",        desc:"보통 문단",           kw:"p 본문 문단 text" },
  { cmd:"ul",      key:"•",  name:"글머리 목록", desc:"점으로 나열",         kw:"ul list 목록 불릿 bullet" },
  { cmd:"ol",      key:"1.", name:"번호 목록",   desc:"순서대로 나열",       kw:"ol number 번호 순서" },
  { cmd:"image",   key:"🖼", name:"이미지",      desc:"한 장 넣기",          kw:"image img 사진 그림 이미지" },
  { cmd:"imgrow",  key:"▥",  name:"이미지 줄",   desc:"여러 장을 한 줄에",   kw:"imgrow 나란히 병렬 여러장 gallery" },
  { cmd:"video",   key:"▶",  name:"영상 카드",   desc:"유튜브 썸네일 + 재생",  kw:"video youtube 영상 유튜브 동영상 movie" },
  { cmd:"table",   key:"▦",  name:"표",          desc:"행과 열",             kw:"table 표 그리드 grid" },
  { cmd:"cards",   key:"▤",  name:"카드 묶음",   desc:"툴·역량 격자",        kw:"cards 카드 skill 격자" },
  { cmd:"callout", key:"💬", name:"강조 박스",   desc:"눈에 띄게",           kw:"callout 강조 박스 note" },
  { cmd:"insight", key:"💡", name:"회고 박스",   desc:"배운 점·인사이트",    kw:"insight 회고 인사이트 배움" },
  { cmd:"problem", key:"⚠",  name:"문제 박스",   desc:"이슈·리스크",         kw:"problem 문제 이슈 경고" },
  { cmd:"quote",   key:"❝",  name:"인용구",      desc:"핵심 문장",           kw:"quote 인용 문장" },
  { cmd:"divider", key:"―",  name:"구분선",      desc:"내용을 끊는다",       kw:"divider hr 구분선 선" }
];
let slashCache = null, slashIdx = 0;

/* 커서 앞이 "/검색어" 꼴이면 그 위치를 돌려준다 */
function slashCtx(){
  const ed = edEl(); if (!ed) return null;
  const s = window.getSelection();
  if (!s || !s.rangeCount || !s.isCollapsed) return null;
  const node = s.anchorNode;
  if (!node || node.nodeType !== 3 || !ed.contains(node)) return null;
  const before = node.textContent.slice(0, s.anchorOffset);
  const m = before.match(/(?:^|\s)\/([^\s/]{0,24})$/);
  if (!m) return null;
  return { node, from: s.anchorOffset - m[1].length - 1, to: s.anchorOffset, q: m[1] };
}
function slashHits(q){
  const k = (q || "").trim().toLowerCase();
  if (!k) return SLASH_ITEMS;
  return SLASH_ITEMS.filter(it => (it.name + " " + it.kw).toLowerCase().indexOf(k) >= 0);
}
function caretRect(){
  const ed = edEl();
  const s = window.getSelection();
  if (!s || !s.rangeCount) return null;
  const rg = s.getRangeAt(0);
  const r = rg.getBoundingClientRect();
  if (r && (r.width || r.height || r.top)) return r;
  const blk = ed ? topBlock(rg.startContainer, ed) : null;
  return blk ? blk.getBoundingClientRect() : null;
}
function placeNear(el, r, gap){
  if (!r) return;
  const w = el.offsetWidth, h = el.offsetHeight;
  let top = r.bottom + gap;
  if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - gap);
  el.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + "px";
  el.style.top  = top + "px";
}
function slashOpen(){
  const ctx = slashCtx();
  if (!ctx) return slashClose();
  slashCache = ctx;
  const hits = slashHits(ctx.q);
  if (!hits.length){
    slashMenu.innerHTML = `<div class="sm-empty">"${esc(ctx.q)}" 에 맞는 블록이 없습니다</div>`;
  } else {
    if (slashIdx >= hits.length) slashIdx = 0;
    slashMenu.innerHTML = hits.map((it, i) =>
      `<div class="sm-i${i === slashIdx ? " on" : ""}" data-cmd="${it.cmd}">` +
      `<span class="k">${it.key}</span>` +
      `<span><span class="n">${it.name}</span><br><span class="d">${it.desc}</span></span></div>`).join("");
  }
  slashMenu.hidden = false;
  placeNear(slashMenu, caretRect(), 6);
}
function slashClose(){
  if (slashMenu){ slashMenu.hidden = true; delete slashMenu.dataset.turn; }
  slashCache = null; slashIdx = 0; turnTargets = [];
}
/* 커서가 놓인 블록에 명령을 적용한다.
   execCommand("formatBlock")은 빈 문단에서 캐럿을 엉뚱한 블록으로 날려 버리는 일이 잦아서
   제목·본문 전환만은 DOM을 직접 바꾼다. (증상: 친 글자가 앞 블록 안으로 들어감) */
const PLAIN_BLOCK = { h2:"h2", h3:"h3", p:"p" };
const LIST_BLOCK  = { ul:"ul", ol:"ol" };
function applyBlockCmd(cmd, ed){
  const s = window.getSelection();
  const blk = (s && s.rangeCount && ed.contains(s.anchorNode)) ? topBlock(s.anchorNode, ed) : null;
  /* DIV는 브라우저가 엔터로 만들어 놓은 문단이다. class가 붙은 DIV(강조박스·이미지줄)는 건드리지 않는다.
     여러 블록을 걸쳐 고른 상태라면 execCommand가 더 잘 처리하므로 그쪽에 맡긴다 */
  const swappable = !!blk && s.isCollapsed &&
    (/^(P|H2|H3|H4)$/.test(blk.tagName) || (blk.tagName === "DIV" && !blk.getAttribute("class")));

  if (swappable && PLAIN_BLOCK[cmd])
    return swapBlock(blk, document.createElement(PLAIN_BLOCK[cmd]), ed, null);
  if (swappable && LIST_BLOCK[cmd]){
    const list = document.createElement(LIST_BLOCK[cmd]);
    const li = document.createElement("li");
    list.appendChild(li);
    return swapBlock(blk, list, ed, li);
  }
  runCmd(cmd, ed);
}

/* 블록을 통째로 갈아 끼우고 캐럿을 새 블록 안에 다시 놓는다.
   execCommand("formatBlock" / "insertUnorderedList")는 빈 문단에서 캐럿을 앞 블록으로 흘려보낸다.
   실제로 "## 제목 → 엔터 → - " 를 치면 목록이 앞의 제목을 통째로 삼켰다. 그래서 직접 바꾼다. */
function swapBlock(blk, el, ed, inner){
  const box = inner || el;
  while (blk.firstChild) box.appendChild(blk.firstChild);
  const empty = !box.textContent.trim() && !box.querySelector("br,img");
  if (empty) box.appendChild(document.createElement("br"));
  blk.replaceWith(el);
  const rg = document.createRange();
  if (empty){ rg.setStart(box, 0); rg.setEnd(box, 0); }
  else { rg.selectNodeContents(box); rg.collapse(false); }
  const s = window.getSelection();
  s.removeAllRanges(); s.addRange(rg);
  ed.focus();
  tidyBlocks(ed, el);
  saveBlocks();
}

/* 블록을 갈아 끼울 때 브라우저가 남기는 빈 문단(<p></p>, br조차 없는 것)을 치운다.
   사용자가 일부러 만든 빈 줄에는 <br>이 들어 있으므로 지워지지 않는다 */
function tidyBlocks(ed, keep){
  [...ed.children].forEach(b => {
    if (b === keep) return;
    if (b.tagName === "P" && !b.textContent && !b.querySelector("br,img")) b.remove();
  });
  if (!ed.children.length) ed.innerHTML = "<p><br></p>";
}

function slashApply(cmd){
  const ed = edEl();
  const ctx = slashCtx() || slashCache;
  slashClose();
  if (!ed || !ctx) return;
  try {
    const rg = document.createRange();
    const len = ctx.node.textContent.length;
    rg.setStart(ctx.node, Math.min(ctx.from, len));
    rg.setEnd(ctx.node, Math.min(ctx.to, len));
    rg.deleteContents();
    rg.collapse(true);
    const s = window.getSelection();
    s.removeAllRanges(); s.addRange(rg);
  } catch(_) {}
  ed.focus();
  applyBlockCmd(cmd, ed);
  markEmpty();
}
if (slashMenu){
  slashMenu.addEventListener("mousedown", e => e.preventDefault());
  slashMenu.addEventListener("click", e => {
    const it = e.target.closest(".sm-i");
    if (!it) return;
    if (it.dataset.turn){
      const list = turnTargets; turnTargets = [];
      slashClose();
      return turnInto(list, it.dataset.turn);
    }
    slashApply(it.dataset.cmd);
  });
}

/* 빈 문단에 "/" 안내를 띄운다 */
function markEmpty(){
  const ed = edEl(); if (!ed) return;
  [...ed.children].forEach(b => {
    b.classList.remove("is-empty");
    if (b.getAttribute("class") === "") b.removeAttribute("class");
  });
  const s = window.getSelection();
  if (!s || !s.rangeCount || !ed.contains(s.anchorNode)) return;
  const b = topBlock(s.anchorNode, ed);
  if (b && b.tagName === "P" && !b.textContent.trim() && !b.querySelector("img"))
    b.classList.add("is-empty");
}

/* ============================================================
   되돌리기 / 다시 실행 (Ctrl+Z · Ctrl+Y)
   브라우저의 undo 는 execCommand 로 바꾼 것만 기억한다. 블록 삭제·이동·표 편집·이미지 배치처럼
   DOM 을 직접 고친 작업은 남지 않으므로, 편집 칸 전체를 스냅샷으로 남겨 우리가 직접 되돌린다.
   연속 타이핑은 1초 안이면 한 단계로 묶는다. 문서를 바꾸면 그 문서의 이력으로 넘어간다.
   ============================================================ */
const HIST_MAX = 200;
const hist = { key:null, past:[], future:[], present:null, lastKind:null, lastAt:0 };

/* 선택 영역을 편집 칸 기준 경로로 적어 둔다. innerHTML 을 갈아 끼운 뒤 같은 자리를 찾기 위해서다 */
function caretPath(ed){
  const s = window.getSelection();
  if (!s || !s.rangeCount || !ed.contains(s.anchorNode)) return null;
  const rg = s.getRangeAt(0);
  const path = (node, off) => {
    const p = [];
    let n = node;
    while (n && n !== ed){ p.unshift([...n.parentNode.childNodes].indexOf(n)); n = n.parentNode; }
    return n ? { p, off } : null;
  };
  return { a: path(rg.startContainer, rg.startOffset), b: path(rg.endContainer, rg.endOffset) };
}
function restoreCaret(ed, c){
  if (!c || !c.a) return;
  const find = q => { let n = ed; for (const i of q.p){ n = n.childNodes[i]; if (!n) return null; } return n; };
  const cap = (n, off) => Math.min(off, n.nodeType === 3 ? n.length : n.childNodes.length);
  const a = find(c.a), b = c.b ? find(c.b) : null;
  if (!a) return;
  try {
    const rg = document.createRange();
    rg.setStart(a, cap(a, c.a.off));
    if (b) rg.setEnd(b, cap(b, c.b.off)); else rg.collapse(true);
    const s = window.getSelection();
    s.removeAllRanges(); s.addRange(rg);
  } catch(_){}
}
function histSnap(ed){ return { html: edHtml(ed), caret: caretPath(ed) }; }
/* 문서를 열 때 부른다. 같은 문서면(링크 칸을 고쳐 폼만 다시 그린 경우) 이력을 잇는다 */
function histInit(key){
  const ed = edEl(); if (!ed) return;
  if (hist.key === key && hist.present){ histRecord("op"); return; }
  hist.key = key; hist.past = []; hist.future = []; hist.lastKind = null;
  hist.present = histSnap(ed);
  updateUndoBtns();
}
/* kind: "type" 은 연속 타이핑을 한 단계로 묶는다, 그 밖은 "op" */
function histRecord(kind){
  const ed = edEl(); if (!ed) return;
  if (!hist.present){ hist.present = histSnap(ed); return updateUndoBtns(); }
  const html = edHtml(ed);
  if (html === hist.present.html) return;
  const now = Date.now();
  const merge = kind === "type" && hist.lastKind === "type" && now - hist.lastAt < 1000;
  if (!merge){
    hist.past.push(hist.present);
    if (hist.past.length > HIST_MAX) hist.past.shift();
  }
  hist.present = { html, caret: caretPath(ed) };
  hist.future = [];
  hist.lastKind = kind; hist.lastAt = now;
  updateUndoBtns();
}
function histApply(state){
  const ed = edEl(); if (!ed || !state) return;
  deselectImg(); hideBlkTools(); clearBlkSel(); slashClose();
  ed.innerHTML = state.html;
  armVids(ed);
  const cur = current();
  if (cur){ cur.l.html = state.html; save(); }
  buildRail();
  ed.focus();
  restoreCaret(ed, state.caret);
  markEmpty();
}
function undo(){
  histRecord("op");                       /* 아직 안 적힌 변화가 있으면 먼저 적는다 */
  if (!hist.past.length) return toast("되돌릴 것이 없습니다", true);
  hist.future.push(hist.present);
  hist.present = hist.past.pop();
  hist.lastKind = null;
  histApply(hist.present);
  updateUndoBtns();
}
function redo(){
  if (!hist.future.length) return toast("다시 실행할 것이 없습니다", true);
  hist.past.push(hist.present);
  hist.present = hist.future.pop();
  hist.lastKind = null;
  histApply(hist.present);
  updateUndoBtns();
}
function updateUndoBtns(){
  document.querySelectorAll("[data-hist]").forEach(b => {
    b.disabled = b.dataset.hist === "undo" ? !hist.past.length : !hist.future.length;
  });
}
/* 편집 칸 안이든, 블록 도구를 누른 뒤 포커스가 빠져 있든 Ctrl+Z 는 편집기 이력을 되돌린다.
   글 입력칸(제목·태그·링크)과 모달 안에서는 브라우저에 맡긴다 */
document.addEventListener("keydown", e => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k !== "z" && k !== "y") return;
  const ed = edEl(), t = e.target;
  if (!ed) return;
  if (t && t.closest && t.closest("input,textarea,select")) return;
  if (t && t !== ed && t.isContentEditable && !ed.contains(t)) return;
  const ov = document.getElementById("overlay");
  if (ov && !ov.hidden) return;
  e.preventDefault();
  if (k === "y" || e.shiftKey) redo(); else undo();
});

/* ---- 글자 크기 ----
   선택한 글자를 <span style="font-size:Npx"> 로 감싼다. execCommand("fontSize")가 남기는
   <font size="7"> 을 span 으로 바꾸는 방식이라 굵게·링크 같은 안쪽 서식이 그대로 살아남는다 */
const SIZE_STEPS = [10,11,12,13,14,15,16,17,18,20,22,24,28,32,36,40,48,56,64];
const selSize = document.getElementById("selSize");
let sizeRange = null;      /* 크기 입력칸으로 포커스가 옮겨 가는 동안 지켜 둘 편집기 선택 영역 */

function selFontSize(){
  const s = window.getSelection();
  if (!s || !s.rangeCount) return 16;
  let n = s.anchorNode;
  if (n && n.nodeType === 3) n = n.parentNode;
  return n ? Math.round(parseFloat(getComputedStyle(n).fontSize)) || 16 : 16;
}
function restoreSizeRange(){
  const ed = edEl();
  if (!sizeRange || !ed) return false;
  ed.focus();
  const s = window.getSelection();
  s.removeAllRanges(); s.addRange(sizeRange);
  return true;
}
function applyFontSize(px, ed){
  const s = window.getSelection();
  if (!s || !s.rangeCount || s.isCollapsed) return toast("크기를 바꿀 글자를 먼저 선택하세요", true);
  if (px != null) px = Math.max(8, Math.min(96, Math.round(px)));
  ed.focus();
  document.execCommand("styleWithCSS", false, false);
  document.execCommand("fontSize", false, "7");
  const made = [];
  ed.querySelectorAll('font[size="7"],span[style*="xx-large"]').forEach(f => {
    const sp = document.createElement("span");
    sp.innerHTML = f.innerHTML;
    /* 안쪽에 남아 있던 크기 지정은 새 값에 덮이므로 벗겨 낸다 */
    sp.querySelectorAll("span[style*='font-size']").forEach(x => {
      x.style.fontSize = "";
      if (!x.getAttribute("style") && !x.getAttribute("class")) x.replaceWith(...x.childNodes);
    });
    if (px != null){
      sp.style.fontSize = px + "px";
      f.replaceWith(sp); made.push(sp);
      /* 부모가 크기만 가진 span 이고 알맹이가 이 span 뿐이면 부모의 크기는 의미가 없다 */
      const par = sp.parentElement;
      if (par && par.tagName === "SPAN" && par.childNodes.length === 1 && par.style.fontSize){
        par.style.fontSize = "";
        if (!par.getAttribute("style") && !par.getAttribute("class")) par.replaceWith(sp);
      }
    } else {
      const kids = [...sp.childNodes];
      f.replaceWith(...kids); made.push(...kids);
      /* 원래대로 — 바깥 span 의 크기도 걷어 낸다 */
      let par = kids[0] && kids[0].parentElement;
      while (par && par !== ed && par.tagName === "SPAN" && par.style.fontSize){
        par.style.fontSize = "";
        const next = par.parentElement;
        if (!par.getAttribute("style") && !par.getAttribute("class")) par.replaceWith(...par.childNodes);
        par = next;
      }
    }
  });
  if (made.length){
    const rg = document.createRange();
    rg.setStartBefore(made[0]); rg.setEndAfter(made[made.length - 1]);
    s.removeAllRanges(); s.addRange(rg);
  }
  flush();
  setTimeout(updateSelBar, 0);
}
function stepFontSize(dir, ed){
  const cur = selFontSize();
  let next;
  if (dir > 0) next = SIZE_STEPS.find(v => v > cur) || cur + 4;
  else { const under = SIZE_STEPS.filter(v => v < cur); next = under.length ? under[under.length - 1] : Math.max(8, cur - 1); }
  applyFontSize(next, ed);
}
if (selSize){
  selSize.addEventListener("keydown", e => {
    if (e.key === "Enter"){
      e.preventDefault();
      const v = +selSize.value;
      if (restoreSizeRange() && v) applyFontSize(v, edEl());
    } else if (e.key === "Escape"){
      e.preventDefault(); restoreSizeRange();
    }
    e.stopPropagation();
  });
  /* 목록(datalist)에서 골랐을 때는 inputType 이 없다. 타이핑 중에는 Enter 를 기다린다 */
  selSize.addEventListener("input", e => {
    if (e.inputType) return;
    const v = +selSize.value;
    if (restoreSizeRange() && v) applyFontSize(v, edEl());
  });
}

/* 글자를 선택하면 그 위에 서식 도구를 띄운다 */
function updateSelBar(){
  const ed = edEl();
  if (!selBar) return;
  /* 크기 입력칸에 커서가 있는 동안은 편집기 선택이 사라져 보여도 툴바를 그대로 둔다 */
  if (selSize && document.activeElement === selSize) return;
  const s = window.getSelection();
  /* 블록 단위로 넘어갔으면 블록 도구가 맡는다. 툴바 두 개가 겹치면 읽을 수가 없다 */
  if (blkSel.length > 1){ selBar.hidden = true; return; }
  if (!ed || !s || !s.rangeCount || s.isCollapsed || !String(s).trim() ||
      !ed.contains(s.anchorNode) || !ed.contains(s.focusNode)){
    selBar.hidden = true; return;
  }
  selBar.hidden = false;
  if (selSize) selSize.value = selFontSize();
  const r = s.getRangeAt(0).getBoundingClientRect();
  const w = selBar.offsetWidth, h = selBar.offsetHeight;
  selBar.style.left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8)) + "px";
  selBar.style.top  = Math.max(8, r.top - h - 8) + "px";
}
if (selBar){
  selBar.addEventListener("mousedown", e => {
    /* 선택 영역을 지킨다. 입력칸은 포커스를 받아야 하므로 대신 선택 영역을 복사해 둔다 */
    const s = window.getSelection();
    if (s && s.rangeCount) sizeRange = s.getRangeAt(0).cloneRange();
    if (!e.target.closest("input")) e.preventDefault();
  });
  selBar.addEventListener("click", e => {
    const ed = edEl(); if (!ed) return;
    const sz = e.target.closest("[data-size]");
    if (sz){ stepFontSize(+sz.dataset.size, ed); return; }
    if (e.target.closest("[data-sizereset]")){ applyFontSize(null, ed); return; }
    const b = e.target.closest("[data-cmd]");
    if (!b) return;
    applyBlockCmd(b.dataset.cmd, ed);
    setTimeout(updateSelBar, 0);
  });
}
/* 블록 선택을 먼저 갱신해야 아래 두 개가 최신 상태를 보고 판단한다 */

/* 줄 맨 앞에서 쓰는 마크다운식 단축 입력 */
const MD_SPACE = { "#":"h2", "##":"h3", "###":"h3", "-":"ul", "*":"ul", "+":"ul",
                   "1.":"ol", ">":"callout", "\"":"quote" };

function onEditorKey(e){
  const ed = edEl(); if (!ed) return;

  /* --- 슬래시 메뉴가 열려 있을 때 --- */
  if (slashMenu && !slashMenu.hidden){
    const items = [...slashMenu.querySelectorAll(".sm-i")];
    if (e.key === "Escape"){ e.preventDefault(); return slashClose(); }
    if (items.length && (e.key === "ArrowDown" || e.key === "ArrowUp")){
      e.preventDefault();
      slashIdx = (slashIdx + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length;
      items.forEach((el, i) => el.classList.toggle("on", i === slashIdx));
      items[slashIdx].scrollIntoView({ block:"nearest" });
      return;
    }
    if (items.length && (e.key === "Enter" || e.key === "Tab")){
      e.preventDefault();
      const it = items[slashIdx];
      if (it.dataset.turn){
        const list = turnTargets; turnTargets = [];
        slashClose();
        return turnInto(list, it.dataset.turn);
      }
      return slashApply(it.dataset.cmd);
    }
  }

  /* --- 단축키 --- */
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && !e.altKey &&
      (e.code === "Period" || e.code === "Comma")){
    e.preventDefault();
    return stepFontSize(e.code === "Period" ? 1 : -1, ed);
  }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey){
    const k = e.key.toLowerCase();
    if (k === "k"){ e.preventDefault(); return runCmd("link", ed); }
    if (k === "e"){ e.preventDefault(); return runCmd("mark", ed); }
    if (k === "d"){
      e.preventDefault();
      const s = window.getSelection();
      if (!s.rangeCount) return;
      const blk = topBlock(s.anchorNode, ed);
      if (!blk) return;
      blk.after(blk.cloneNode(true));
      saveBlocks();
      return toast("블록을 복제했습니다");
    }
  }

  /* --- 스페이스로 블록 바꾸기 (# / - / 1. / > …) --- */
  if (e.key === " " && !e.ctrlKey && !e.metaKey && !e.altKey){
    const s = window.getSelection();
    if (!s.rangeCount || !s.isCollapsed) return;
    const node = s.anchorNode;
    if (!node || node.nodeType !== 3 || node.previousSibling) return;
    const blk = topBlock(node, ed);
    if (!blk || node.parentNode !== blk) return;
    if (blk.tagName === "UL" || blk.tagName === "OL" || blk.tagName === "TABLE") return;
    const cmd = MD_SPACE[node.textContent.slice(0, s.anchorOffset)];
    if (!cmd) return;
    e.preventDefault();
    const rest = node.textContent.slice(s.anchorOffset);
    const rg = document.createRange();
    if (rest){
      node.textContent = rest;
      rg.setStart(node, 0);
    } else {
      blk.innerHTML = "<br>";
      rg.setStart(blk, 0);
    }
    rg.collapse(true);
    s.removeAllRanges(); s.addRange(rg);
    applyBlockCmd(cmd, ed);
    return markEmpty();
  }

  /* --- --- 를 치고 엔터 = 구분선 --- */
  if (e.key === "Enter" && !e.shiftKey){
    const s = window.getSelection();
    if (!s.rangeCount || !s.isCollapsed) return;
    const blk = topBlock(s.anchorNode, ed);
    if (blk && /^(---|___|\*\*\*)$/.test(blk.textContent.trim())){
      e.preventDefault();
      blk.textContent = "";
      const rg = document.createRange();
      rg.selectNodeContents(blk); rg.collapse(true);
      s.removeAllRanges(); s.addRange(rg);
      applyBlockCmd("divider", ed);
      return markEmpty();
    }
  }
}

/* 여러 블록을 고른 상태의 키보드 조작 */
document.addEventListener("keydown", e => {

  if (blkSel.length < 2 && !oneVid) return;

    e.preventDefault();
    const n = blkSel.length, list = blkSel.slice();
    clearBlkSel(); hideBlkTools();
    list.forEach(x => x.remove());
    if (!ed.children.length) ed.innerHTML = "<p><br></p>";
    saveBlocks();
    return toast(`${n}개를 지웠습니다`);
  }
  if (e.key === "Escape"){ e.preventDefault(); return clearBlkSel(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "d"){
    e.preventDefault();
    let at = blkSel[blkSel.length - 1];
    const made = blkSel.map(x => { const c = x.cloneNode(true); at.after(c); at = c; return c; });
    saveBlocks(); setBlkSel(made, true);
    return toast(`${made.length}개를 복제했습니다`);
  }
  if (e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown")){
    e.preventDefault();
    if (e.key === "ArrowUp"){
      const p = blkSel[0].previousElementSibling;
      if (p) blkSel[blkSel.length - 1].after(p);
    } else {
      const n = blkSel[blkSel.length - 1].nextElementSibling;
      if (n) blkSel[0].before(n);
    }
    saveBlocks(); setBlkSel(blkSel, true);
  }
});

/* ============================================================
   표 편집 — 커서가 셀 안에 있으면 행·열 도구를 띄운다
   ============================================================ */
const tblTools = document.getElementById("tblTools");
let curCell = null;

function cellAt(){
  const ed = edEl(); if (!ed) return null;
  const s = window.getSelection();
  if (!s || !s.rangeCount || !ed.contains(s.anchorNode)) return null;
  const n = s.anchorNode;
  const el = n.nodeType === 1 ? n : n.parentElement;
  const cell = el && el.closest ? el.closest("th,td") : null;
  return (cell && ed.contains(cell)) ? cell : null;
}
function updateTblTools(){
  if (!tblTools) return;
  const cell = cellAt();
  curCell = cell;
  if (!cell){ tblTools.hidden = true; return; }
  const tbl = cell.closest("table");
  const r = tbl.getBoundingClientRect();
  const ed = edEl(), edr = ed.getBoundingClientRect();
  if (r.bottom < edr.top || r.top > edr.bottom){ tblTools.hidden = true; return; }
  tblTools.hidden = false;
  const w = tblTools.offsetWidth;
  tblTools.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + "px";
  tblTools.style.top = Math.max(8, r.top - tblTools.offsetHeight - 6) + "px";
}
function cellIndex(cell){ return [...cell.parentElement.children].indexOf(cell); }
function newCell(tag){
  const c = document.createElement(tag);
  c.innerHTML = "&nbsp;";
  return c;
}
if (tblTools) tblTools.addEventListener("mousedown", e => e.preventDefault());
if (tblTools) tblTools.addEventListener("click", e => {
  const b = e.target.closest("[data-tbl]");
  if (!b || !curCell) return;
  const row = curCell.parentElement;
  const tbl = curCell.closest("table");
  const rows = [...tbl.rows];
  const ci = cellIndex(curCell);
  const act = b.dataset.tbl;

  if (act === "rowUp" || act === "rowDown"){
    const nr = document.createElement("tr");
    [...row.children].forEach(c => nr.appendChild(newCell(c.tagName === "TH" && act === "rowUp" && row === rows[0] ? "th" : "td")));
    act === "rowUp" ? row.before(nr) : row.after(nr);
  }
  else if (act === "rowDel"){
    if (rows.length <= 1) return toast("마지막 행은 지울 수 없습니다", true);
    row.remove(); curCell = null; tblTools.hidden = true;
  }
  else if (act === "colLeft" || act === "colRight"){
    rows.forEach(r2 => {
      const ref = r2.children[ci];
      const c = newCell(ref && ref.tagName === "TH" ? "th" : "td");
      if (!ref) return r2.appendChild(c);
      act === "colLeft" ? ref.before(c) : ref.after(c);
    });
  }
  else if (act === "colDel"){
    if (rows[0].children.length <= 1) return toast("마지막 열은 지울 수 없습니다", true);
    rows.forEach(r2 => { const c = r2.children[ci]; if (c) c.remove(); });
    curCell = null; tblTools.hidden = true;
  }
  else if (act === "head"){
    const first = rows[0];
    const toTh = first.children[0] && first.children[0].tagName === "TD";
    [...first.children].forEach(c => {
      const n = document.createElement(toTh ? "th" : "td");
      n.innerHTML = c.innerHTML;
      c.replaceWith(n);
    });
    curCell = null;
    toast(toTh ? "첫 줄을 제목 행으로 바꿨습니다" : "제목 행을 보통 줄로 바꿨습니다");
  }
  saveBlocks();
  setTimeout(updateTblTools, 0);
});
document.addEventListener("selectionchange", updateTblTools);

function markExported(units){

function download(name, text, type){
  const blob = new Blob([text], { type: type || "text/javascript;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---- 최소 ZIP 작성기 (무압축 store 방식, 외부 라이브러리 없음) ---- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(buf){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files){          // files: [{name, data:Uint8Array}]
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  const now = new Date();
  const time = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
  const date = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;

  for (const f of files){
    const name = enc.encode(f.name);
    const crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);     lh.setUint16(8, 0, true);
    lh.setUint16(10, time, true);      lh.setUint16(12, date, true);
    lh.setUint32(14, crc, true);       lh.setUint32(18, size, true);
    lh.setUint32(22, size, true);      lh.setUint16(26, name.length, true);
    lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), name, f.data);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true);         cd.setUint16(8, 0x0800, true);
    cd.setUint16(10, 0, true);         cd.setUint16(12, time, true);
    cd.setUint16(14, date, true);      cd.setUint32(16, crc, true);
    cd.setUint32(20, size, true);      cd.setUint32(24, size, true);
    cd.setUint16(28, name.length, true);
    cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), name);
    offset += 30 + name.length + size;
  }
  const cdSize = central.reduce((a, c) => a + c.length, 0);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);
  eo.setUint16(8, files.length, true); eo.setUint16(10, files.length, true);
  eo.setUint32(12, cdSize, true);      eo.setUint32(16, offset, true);
  return new Blob([...chunks, ...central, new Uint8Array(eo.buffer)], { type:"application/zip" });
}
function b64ToBytes(b64){
  const bin = atob(b64);
  const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}

/* 이미지를 images/ 로 분리한 결과물을 만든다 */
function buildSplit(){
  const units = deepCopy(data.units);
  const files = [];
  let n = 0;
  const used = new Set();
  const walk = html => html.replace(/<img([^>]*?)src="data:image\/([a-zA-Z+]+);base64,([^"]+)"([^>]*)>/g,
    (m, pre, ext, b64, post) => {
      n++;
      ext = ext.replace("svg+xml", "svg").replace("jpeg", "jpg");
      const nameAttr = (m.match(/data-name="([^"]+)"/) || [])[1];
      const base = nameAttr ? nameAttr.replace(/\.[^.]+$/, "") : "img";
      let fname = `${String(n).padStart(2,"0")}-${base}.${ext}`;
      while (used.has(fname)) fname = `${String(++n).padStart(2,"0")}-${base}.${ext}`;
      used.add(fname);
      files.push({ name: fname, data: b64ToBytes(b64) });
      return `<img${pre}src="images/${fname}"${post}>`;
    });
  units.forEach(u => u.mids.forEach(m => {
    // 썸네일도 파일로 분리
    if (m.cover && m.cover.startsWith("data:image/")){
      const mm = m.cover.match(/^data:image\/([a-zA-Z+]+);base64,(.+)$/);
      if (mm){
        n++;
        const ext = mm[1].replace("svg+xml", "svg").replace("jpeg", "jpg");
        const base = (m.coverName || "cover").replace(/\.[^.]+$/, "");
        let fname = `cover-${String(n).padStart(2,"0")}-${base}.${ext}`;
        while (used.has(fname)) fname = `cover-${String(++n).padStart(2,"0")}-${base}.${ext}`;
        used.add(fname);
        files.push({ name: fname, data: b64ToBytes(mm[2]) });
        m.cover = "images/" + fname;
      }
    }
    m.lessons.forEach(l => { l.html = walk(l.html || ""); });
  }));
  return { js: buildDataJs(units, data.profile, data.interview), files, units };
}

function exportZip(){
  const { js, files } = buildSplit();
  const enc = new TextEncoder();
  const zipFiles = [{ name:"data.js", data: enc.encode(js) },
                    ...files.map(f => ({ name:"images/" + f.name, data:f.data }))];
  const a = document.createElement("a");
  a.href = URL.createObjectURL(makeZip(zipFiles));
  a.download = "portfolio-data.zip";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  closeModal();
  toast(`ZIP으로 받았습니다 (이미지 ${files.length}장)`);
}

/* 저장소 — IndexedDB를 쓰되, 막혀 있으면 localStorage로 대체한다.
   (크롬은 file:// 로 연 페이지에서 IndexedDB를 차단합니다) */
let useIDB = typeof indexedDB !== "undefined" && !IS_FILE;
const LS_VER = "pf-versions";

async function idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open("pf-editor", 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains("meta")) d.createObjectStore("meta");
      if (!d.objectStoreNames.contains("versions")) d.createObjectStore("versions", { keyPath:"id" });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbRun(store, mode, fn){
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const rq = fn(t.objectStore(store));
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}

function lsVersions(){
  try { return JSON.parse(localStorage.getItem(LS_VER) || "[]"); } catch(_) { return []; }
}
function lsWrite(list){
  // 용량이 넘치면 오래된 것부터 버린다
  let arr = list.slice();
  while (arr.length){
    try { localStorage.setItem(LS_VER, JSON.stringify(arr)); return arr.length; }
    catch(_) { arr = arr.slice(0, -1); }
  }
  try { localStorage.removeItem(LS_VER); } catch(_) {}
  return 0;
}

/* 공용 API — 어느 저장소든 같은 방식으로 쓴다 */
async function verAll(){
  if (useIDB){
    try { return await idbRun("versions", "readonly", s => s.getAll()); }
    catch(_) { useIDB = false; }
  }
  return lsVersions();
}
async function verPut(v){
  if (useIDB){
    try { await idbRun("versions", "readwrite", s => s.put(v)); return true; }
    catch(_) { useIDB = false; }
  }
  const list = lsVersions().filter(x => x.id !== v.id);
  list.push(v);
  list.sort((a, b) => b.id - a.id);
  const kept = lsWrite(list.slice(0, MAX_VERSIONS));
  if (!kept) throw new Error("저장 공간이 부족합니다. 이미지가 많으면 ZIP으로 백업하세요.");
  return kept < list.length;   // 잘렸는지 여부
}
async function verDel(id){
  if (useIDB){
    try { await idbRun("versions", "readwrite", s => s.delete(id)); return; }
    catch(_) { useIDB = false; }
  }
  lsWrite(lsVersions().filter(x => x.id !== id));
}
async function metaPut(k, v){
  if (!useIDB) return;
  try { await idbRun("meta", "readwrite", s => s.put(v, k)); } catch(_) {}
}
async function metaGet(k){
  if (!useIDB) return null;
  try { return await idbRun("meta", "readonly", s => s.get(k)); } catch(_) { return null; }
}

async function connectFolder(){
  if (IS_FILE){
    alert("크롬은 file:// 로 연 페이지에서 폴더 접근을 차단합니다.\n\n" +
          "· 지금은 ZIP으로 받기를 쓰세요.\n" +
          "· 폴더 저장을 쓰려면 로컬 서버로 열어야 합니다. (저장 창의 안내 참고)");
    return false;
  }
  if (!canFS){
    alert("이 브라우저는 폴더 저장을 지원하지 않습니다.\nChrome 또는 Edge에서 열어 주세요.");
    return false;
  }
  try {
    dirHandle = await window.showDirectoryPicker({ mode:"readwrite" });
    await metaPut("dir", dirHandle);
    updateFolderBadge();
    toast(`"${dirHandle.name}" 폴더에 연결했습니다`);
    return true;
  } catch(err){
    if (err.name !== "AbortError") alert("폴더 연결 실패\n\n" + err.name + ": " + err.message);
    return false;
  }
}
async function ensurePerm(){
  if (!dirHandle) return false;
  const opts = { mode:"readwrite" };
  if (await dirHandle.queryPermission(opts) === "granted") return true;
  return await dirHandle.requestPermission(opts) === "granted";
}
async function saveToFolder(silent){
  if (!dirHandle && !(await connectFolder())) return false;
  if (!(await ensurePerm())){ toast("폴더 쓰기 권한이 필요합니다", true); return false; }
  try {
    const { js, files, units } = buildSplit();
    const fh = await dirHandle.getFileHandle("data.js", { create:true });
    const w = await fh.createWritable(); await w.write(js); await w.close();
    if (files.length){
      const imgs = await dirHandle.getDirectoryHandle("images", { create:true });
      for (const f of files){
        const h = await imgs.getFileHandle(f.name, { create:true });
        const ww = await h.createWritable(); await ww.write(f.data); await ww.close();
      }
    }
    dirty = false; markExported(units);
    setStatus(`저장됨 · ${new Date().toLocaleTimeString("ko-KR")}`, "saved");
    if (!silent) toast(`저장 완료 — data.js${files.length ? ` + 이미지 ${files.length}장` : ""}`);
    return true;
  } catch(err){
    toast("저장 실패: " + err.message, true);
    return false;
  }
}
function updateFolderBadge(){
  const b = document.getElementById("saveBtn");
  const st = document.getElementById("status");
  /* GitHub 로 저장할 때는 상태 글씨가 설정 문이다 — 토큰이 만료되면 여기서 새 토큰을 넣는다 */
  st.style.cursor = ghReady() ? "pointer" : "";
  st.onclick = ghReady() ? openGhSettings : null;
  if (ghReady()){
    b.textContent = "🚀 저장 · 배포";
    b.title = `${gh.repo} 에 커밋 (Ctrl+S) — 상태 글씨를 누르면 GitHub 연결 설정`;
  } else {
    b.textContent = dirHandle ? "💾 저장" : "💾 저장";
    b.title = dirHandle ? `${dirHandle.name} 폴더에 저장 (Ctrl+S)` : "저장 방법을 고릅니다 (Ctrl+S)";
  }
}
(async () => {
  try {
    const h = await metaGet("dir");
    if (h){ dirHandle = h; updateFolderBadge(); }
  } catch(_) {}
})();

/* ============================================================
   GitHub에 바로 커밋 — 저장 한 번으로 사이트까지 반영
   ============================================================ */
const GH_KEY = "pf-github";
let gh = null;
try { gh = JSON.parse(localStorage.getItem(GH_KEY) || "null"); } catch(_) {}

function ghReady(){ return !!(gh && gh.repo && gh.token); }
let ghLastError = "";
/* GitHub 응답을 사람 말로 — 대부분 토큰 만료 아니면 권한 문제다 */
function ghWhy(msg){
  msg = String(msg || "");
  if (/401|Bad credentials/i.test(msg))
    return "토큰이 만료됐거나 잘못됐습니다.\nGitHub → Settings → Developer settings → Personal access tokens →\nFine-grained tokens 에서 토큰을 새로 만들어 아래 설정에 붙여 넣으세요.";
  if (/403/.test(msg))
    return "토큰에 이 저장소를 고칠 권한이 없습니다.\n토큰의 Repository access 에 이 저장소가 들어 있고,\nPermissions → Contents 가 Read and write 인지 확인하세요.";
  if (/404/.test(msg))
    return "저장소나 브랜치를 찾지 못했습니다.\n· 저장소가 owner/repo 형식인지 (예: Sprin9wind/portfolio)\n· 브랜치 이름이 맞는지 (보통 main)\n· 토큰의 Repository access 에 이 저장소가 들어 있는지 확인하세요.";
  if (/not a fast forward|409|422/i.test(msg))
    return "저장소가 편집기보다 앞서 있습니다. 다른 곳에서 파일을 올렸거나 저장이 겹친 경우입니다.\n잠시 뒤 다시 저장하고, 그래도 안 되면 새로고침한 뒤 저장하세요.";
  if (/Failed to fetch|NetworkError|network/i.test(msg))
    return "GitHub 에 연결하지 못했습니다. 인터넷 연결, 방화벽, 광고 차단 확장 프로그램을 확인하세요.";
  return "· 저장소가 owner/repo 형식인지\n· 브랜치 이름이 맞는지\n· 토큰에 Contents: Read and write 권한이 있는지 확인하세요.";
}
function bytesToB64(bytes){
  let bin = "";
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(bin);
}
function textToB64(str){ return bytesToB64(new TextEncoder().encode(str)); }

async function ghApi(path, opts){
  const res = await fetch("https://api.github.com" + path, {
    ...opts,
    headers: {
      "Authorization": "Bearer " + gh.token,
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json",
      ...(opts && opts.headers)
    }
  });
  if (!res.ok){
    let msg = res.status + " " + res.statusText;
    try { const j = await res.json(); if (j.message) msg += " — " + j.message; } catch(_) {}
    throw new Error(msg);
  }
  return res.status === 204 ? null : res.json();
}

async function saveToGitHub(silent){
  if (!ghReady()){ openGhSettings(); return false; }
  const branch = gh.branch || "main";
  const prefix = (gh.path||"").replace(/^\/+|\/+$/g,"");
  const p = prefix ? prefix + "/" : "";
  const btn = document.getElementById("saveBtn");
  const label = () => { btn.textContent = "🚀 저장 · 배포"; };
  try {
    btn.textContent = "올리는 중…";
    const { js, files, units } = buildSplit();

    /* 1) 파일을 blob으로 올린다 — 내용 기반이라 한 번만 올리면 된다 */
    const blobs = [];
    const jb = await ghApi(`/repos/${gh.repo}/git/blobs`, { method:"POST",
      body: JSON.stringify({ content: textToB64(js), encoding:"base64" }) });
    blobs.push({ path:p+"data.js", mode:"100644", type:"blob", sha: jb.sha });
    for (let i = 0; i < files.length; i++){
      btn.textContent = `이미지 ${i+1}/${files.length}`;
      const b = await ghApi(`/repos/${gh.repo}/git/blobs`, { method:"POST",
        body: JSON.stringify({ content: bytesToB64(files[i].data), encoding:"base64" }) });
      blobs.push({ path:p+"images/"+files[i].name, mode:"100644", type:"blob", sha:b.sha });
    }

    /* 2) 커밋을 얹는다. 그 사이 저장소가 앞서 나갔으면 최신 위에 다시 시도 */
    let lastErr = null;
    for (let attempt = 1; attempt <= 4; attempt++){
      try {
        if (attempt > 1) btn.textContent = `최신 반영 후 재시도 ${attempt-1}`;
        const ref = await ghApi(`/repos/${gh.repo}/git/ref/heads/${branch}`);
        const head = ref.object.sha;
        const hc = await ghApi(`/repos/${gh.repo}/git/commits/${head}`);
        const nt = await ghApi(`/repos/${gh.repo}/git/trees`, { method:"POST",
          body: JSON.stringify({ base_tree: hc.tree.sha, tree: blobs }) });
        const cm = await ghApi(`/repos/${gh.repo}/git/commits`, { method:"POST",
          body: JSON.stringify({ message:`포트폴리오 내용 수정 (${new Date().toLocaleString("ko-KR")})`,
                                 tree: nt.sha, parents:[head] }) });
        await ghApi(`/repos/${gh.repo}/git/refs/heads/${branch}`, { method:"PATCH",
          body: JSON.stringify({ sha: cm.sha }) });
        dirty = false; markExported(units);
        setStatus(`GitHub 반영됨 · ${new Date().toLocaleTimeString("ko-KR")}`, "saved");
        label();
        if (!silent) toast("커밋 완료 — 1분 내 사이트에 반영됩니다");
        return true;
      } catch(err){
        lastErr = err;
        if (!/not a fast forward|422|409/i.test(err.message || "")) throw err;
        await new Promise(r => setTimeout(r, 700 * attempt));
      }
    }
    throw lastErr;
  } catch(err){
    ghLastError = (err && err.message) || String(err);
    console.error("GitHub 저장 실패:", err);
    setStatus("GitHub 저장 실패", "dirty");
    document.getElementById("status").title = ghLastError;
    label();
    const race = /not a fast forward/i.test(ghLastError);
    alert("GitHub 저장에 실패했습니다.\n\n" + ghLastError + "\n\n" + ghWhy(ghLastError));
    if (!race) openGhSettings();   /* 바로 「연결 확인」을 눌러 볼 수 있게 */
    return false;
  }
}
