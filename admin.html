<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포트폴리오 편집기</title>
<script src="data.js"></script>
<style>
:root{
  --radius-1:10px; --radius-2:16px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:36px;
  --topbar-h:56px;
  --font:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,monospace;
}
:root,[data-theme="dark"]{
  --bg-0:#000000; --bg-1:#000000; --bg-2:#0c0c0c; --bg-3:#161616;
  --border-1:#1f1f1f; --border-2:#2e2e2e;
  --text-1:#f6f3ee; --text-2:#a5a099; --text-3:#6f6a63;
  --accent:#f0b429; --accent-2:#ffcf5c; --accent-dim:rgba(240,180,41,.12); --accent-text:#140d00;
  --primary:#b5793d; --primary-hover:#c98d4f; --primary-text:#fff;
  --danger:#e0785c; --warn:#f0b429; --info:#ffcf5c;
  --advanced:#f0b429; --advanced-dim:rgba(240,180,41,.12);
  --practice-dim:rgba(181,121,61,.15);
  --shadow-1:0 2px 14px rgba(0,0,0,.7); --shadow-2:0 18px 54px rgba(0,0,0,.85);
}
[data-theme="light"]{
  --bg-0:#e9e2d5; --bg-1:#f7f3ec; --bg-2:#fffdf9; --bg-3:#f0ebe1;
  --border-1:#e2dacc; --border-2:#cdc2ae;
  --text-1:#2b2419; --text-2:#6b6053; --text-3:#96897a;
  --accent:#a97a12; --accent-2:#8a6209; --accent-dim:#f8eed6; --accent-text:#fffdf9;
  --primary:#8a5a2b; --primary-hover:#6f4720; --primary-text:#fff;
  --danger:#b6553c; --warn:#a97a12; --info:#8a6209;
  --advanced:#8a6209; --advanced-dim:#f8eed6; --practice-dim:#f2e6d8;
  --shadow-1:0 1px 2px rgba(43,36,25,.05),0 6px 20px rgba(43,36,25,.06);
  --shadow-2:0 6px 18px rgba(43,36,25,.10),0 22px 50px rgba(43,36,25,.10);
}
*,::before,::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.5;color:var(--text-1);
  background:var(--bg-1);-webkit-font-smoothing:antialiased}
#app{height:100%;display:flex;flex-direction:column}
.topbar{flex:0 0 var(--topbar-h);height:var(--topbar-h);display:flex;align-items:center;
  gap:var(--space-2);padding:0 var(--space-4);background:var(--bg-2);
  border-bottom:1px solid var(--border-1);z-index:50}
.topbar-title{font-size:15px;font-weight:600}
.topbar-title small{font-weight:400;color:var(--text-3);margin-left:8px;font-size:12px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-1);
  background:var(--bg-2);color:var(--text-1);border:1px solid var(--border-1);
  border-radius:var(--radius-1);padding:6px 12px;font-family:var(--font);font-size:13px;
  line-height:1.4;cursor:pointer;transition:background .12s,border-color .12s;
  user-select:none;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--bg-3);border-color:var(--border-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--bg-3);color:var(--text-1)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.btn.accent:hover{background:var(--accent-2);border-color:var(--accent-2);color:var(--accent-text)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.xs{padding:1px 6px;font-size:11px;border-radius:4px}

/* 레이아웃 */
.wrap{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:300px 1fr}
.side{border-right:1px solid var(--border-1);background:var(--bg-2);overflow:auto;padding:var(--space-3)}
.main{overflow:auto;padding:var(--space-5) var(--space-5) 80px}
.main-inner{max-width:820px;margin:0 auto}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{border-right:none;border-bottom:1px solid var(--border-1);max-height:38vh}
  .main{padding:var(--space-4)}
}

/* 사이드 트리 */
.tree-unit{margin-bottom:var(--space-3)}
.tree-unit-head{display:flex;align-items:center;gap:6px;padding:6px 4px;font-weight:700;font-size:13px}
.tree-unit-head input{flex:1 1 auto;min-width:0}
.tree-mid{margin:4px 0 4px 8px;padding-left:8px;border-left:2px solid var(--border-1)}
.tree-mid-head{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px;
  font-weight:600;color:var(--text-2)}
.tree-mid-head input{flex:1 1 auto;min-width:0}
.tree-lesson{display:flex;align-items:center;gap:4px;width:100%;text-align:left;
  padding:7px 10px;margin:2px 0;background:var(--bg-1);border:1px solid var(--border-1);
  border-radius:var(--radius-1);cursor:pointer;color:var(--text-1);font-size:13px;
  font-family:var(--font)}
.tree-lesson:hover{background:var(--bg-3);border-color:var(--border-2)}
.tree-lesson.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent-2);font-weight:600}
.tree-lesson span{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-add{width:100%;margin:2px 0;padding:5px;background:transparent;border:1px dashed var(--border-1);
  border-radius:var(--radius-1);color:var(--text-3);font-size:12px;cursor:pointer;font-family:var(--font)}
.tree-add:hover{border-color:var(--accent);color:var(--accent-2)}
.icon-btn{flex:0 0 auto;width:20px;height:20px;padding:0;display:flex;align-items:center;
  justify-content:center;background:transparent;border:none;color:var(--text-3);
  cursor:pointer;border-radius:4px;font-size:12px;line-height:1}
.icon-btn:hover{background:var(--bg-3);color:var(--text-1)}
.icon-btn.del:hover{background:var(--danger);color:#fff}

/* 폼 */
.field{display:flex;flex-direction:column;gap:var(--space-1);margin-bottom:var(--space-3)}
.field>label{font-size:12px;color:var(--text-2);font-weight:600}
.field>.hint{font-size:11px;color:var(--text-3)}
input[type=text],textarea,select{background:var(--bg-2);color:var(--text-1);
  border:1px solid var(--border-1);border-radius:var(--radius-1);padding:7px 10px;
  font-family:var(--font);font-size:13px;outline:none;width:100%;
  transition:border-color .12s,box-shadow .12s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
.row{display:flex;gap:var(--space-3)}
.row>*{flex:1 1 0;min-width:0}
.section-title{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);margin:var(--space-5) 0 var(--space-2);
  padding-bottom:6px;border-bottom:1px solid var(--border-1)}
.section-title:first-child{margin-top:0}

/* 툴바 + 에디터 */
.toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:8px;background:var(--bg-2);
  border:1px solid var(--border-1);border-bottom:none;border-radius:var(--radius-1) var(--radius-1) 0 0}
.toolbar .sep{width:1px;background:var(--border-1);margin:2px 4px}
.editor{min-height:340px;max-height:none;padding:var(--space-4) var(--space-5);
  background:var(--bg-1);border:1px solid var(--border-1);
  border-radius:0 0 var(--radius-1) var(--radius-1);outline:none;overflow:auto}
.editor:focus{border-color:var(--accent)}
.editor h2{font-size:19px;font-weight:700;margin:var(--space-5) 0 var(--space-3);
  padding-bottom:6px;border-bottom:1px solid var(--border-1)}
.editor h2:first-child{margin-top:0}
.editor h3{font-size:15px;font-weight:700;margin:var(--space-4) 0 var(--space-2);color:var(--accent-2)}
.editor p{margin:0 0 var(--space-3)}
.editor ul{margin:0 0 var(--space-4);padding-left:20px}
.editor li{margin-bottom:6px;color:var(--text-2)}
.editor strong{color:var(--text-1);font-weight:600}
.editor em{font-style:normal;color:var(--accent-2);font-weight:600}
.editor img{max-width:100%;border-radius:8px;border:1px solid var(--border-1);display:block;margin:0 0 8px}
.editor .doc-img.center{margin-left:auto;margin-right:auto}
.editor img.img-sel{outline:2px solid var(--accent);outline-offset:2px}

#imgTools{position:fixed;z-index:150;pointer-events:none}
#imgTools[hidden]{display:none}
#imgTools .it-bar{position:absolute;display:flex;align-items:center;gap:3px;padding:4px;
  background:var(--bg-2);border:1px solid var(--border-2);border-radius:var(--radius-1);
  box-shadow:var(--shadow-1);pointer-events:auto;white-space:nowrap}
#imgTools .it-bar button{background:transparent;border:none;color:var(--text-2);
  font-family:var(--font);font-size:12px;padding:3px 7px;border-radius:4px;cursor:pointer}
#imgTools .it-bar button:hover{background:var(--bg-3);color:var(--text-1)}
#imgTools .it-bar button.on{background:var(--accent-dim);color:var(--accent-2);font-weight:600}
#imgTools .it-bar button.del:hover{background:var(--danger);color:#fff}
#imgTools .it-bar .sep{width:1px;height:14px;background:var(--border-1);margin:0 2px}
#imgTools .it-bar .pct{font-size:11px;color:var(--text-3);padding:0 4px;min-width:34px;text-align:right}
#imgTools .it-handle{position:absolute;width:14px;height:14px;background:var(--accent);
  border:2px solid var(--bg-1);border-radius:3px;cursor:nwse-resize;pointer-events:auto}
.editor table{width:100%;border-collapse:collapse;margin:0 0 var(--space-4);font-size:13px}
.editor th,.editor td{border:1px solid var(--border-1);padding:8px 12px;text-align:left;vertical-align:top}
.editor th{background:var(--bg-2);color:var(--text-2);font-weight:600;font-size:12px}
.editor td{color:var(--text-2)}
.editor .skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:var(--space-2);margin:0 0 var(--space-4)}
.editor .skill{display:flex;flex-direction:column;align-items:flex-start;gap:9px;
  padding:14px 16px;background:var(--bg-2);border:1px solid var(--border-1);
  border-radius:var(--radius-2);transition:border-color .12s,background .12s}
.editor .skill:hover{border-color:var(--border-2);background:var(--bg-3)}
.editor .skill-head{display:flex;align-items:center;gap:9px;min-width:0;width:100%}
.editor .skill-ico{flex:0 0 auto;width:22px;height:22px;object-fit:contain;display:block;
  border:none;border-radius:4px;margin:0;padding:0;background:none}
.editor .skill-ico-emoji{flex:0 0 auto;font-size:19px;line-height:1}
.editor .skill-name{flex:1 1 auto;min-width:0;font-weight:600;font-size:15px;color:var(--text-1);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.editor .skill-level{font-size:11px;padding:3px 9px;border-radius:12px;
  background:var(--accent-dim);color:var(--accent-2);white-space:nowrap}
.editor .skill-level.l2{background:var(--advanced-dim);color:var(--advanced)}
.editor .skill-level.l1{background:var(--practice-dim);color:var(--warn)}
.callout{display:flex;gap:12px;padding:14px 16px;background:var(--bg-2);
  border:1px solid var(--border-1);border-left:3px solid var(--accent);
  border-radius:var(--radius-1);margin:0 0 var(--space-4)}
.callout.insight{border-left-color:var(--advanced);background:var(--advanced-dim)}
.callout.problem{border-left-color:var(--warn);background:var(--practice-dim)}
.callout-ico{flex:0 0 auto;font-size:15px}
.callout-body{flex:1 1 auto;min-width:0}
.callout-body p:last-child{margin-bottom:0}
.quote{margin:0 0 var(--space-4);padding:var(--space-4) var(--space-5);background:var(--bg-2);
  border:1px solid var(--border-1);border-radius:var(--radius-2);
  font-size:16px;font-weight:600;line-height:1.6;text-align:center}
.quote span{display:block;margin-top:6px;font-size:13px;font-weight:400;color:var(--text-3)}

/* 링크 목록 */
.linkrow{display:flex;gap:var(--space-2);margin-bottom:var(--space-2)}
.linkrow input{flex:1 1 0}
.linkrow input.lbl{flex:0 0 150px}

/* 상태 표시 */
.status{font-size:12px;color:var(--text-3);margin-right:var(--space-2)}
.status.saved{color:var(--advanced)}
.status.dirty{color:var(--warn)}

/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;
  justify-content:center;z-index:100;padding:var(--space-4)}
.overlay[hidden]{display:none}
.modal{background:var(--bg-1);border:1px solid var(--border-1);border-radius:var(--radius-2);
  box-shadow:var(--shadow-2);width:min(560px,100%);max-height:85vh;display:flex;flex-direction:column}
.modal-header{padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--border-1);
  font-weight:600}
.modal-body{padding:var(--space-4);overflow:auto;display:flex;flex-direction:column;gap:var(--space-3)}
.modal-footer{padding:var(--space-3) var(--space-4);border-top:1px solid var(--border-1);
  display:flex;justify-content:flex-end;gap:var(--space-2)}
.note{padding:12px 14px;background:var(--bg-2);border:1px solid var(--border-1);
  border-left:3px solid var(--accent);border-radius:var(--radius-1);font-size:13px;color:var(--text-2)}
.note.warn{border-left-color:var(--warn);background:var(--practice-dim)}
.note b{color:var(--text-1)}
.toast-root{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;
  gap:var(--space-2);z-index:200;pointer-events:none}
.toast{min-width:200px;background:var(--bg-2);border:1px solid var(--border-1);
  border-left:3px solid var(--accent);border-radius:var(--radius-1);box-shadow:var(--shadow-1);
  padding:12px 16px;font-size:13px}
.toast.err{border-left-color:var(--danger)}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-title">포트폴리오 편집기<small id="crumb"></small></div>
    <div class="topbar-right">
      <span class="status" id="status">불러오는 중</span>
      <a class="btn ghost" href="index.html" title="포트폴리오 화면으로">← 사이트</a>
      <button class="btn ghost" id="versionBtn">🕘 버전</button>
      <button class="btn ghost" id="loadBtn">불러오기</button>
      <button class="btn ghost" id="profileBtn">프로필</button>
      <button class="btn ghost" id="previewBtn">미리보기</button>
      <button class="btn ghost" id="themeBtn">☾ 어둡게</button>
      <button class="btn primary" id="saveBtn" title="Ctrl+S">💾 저장</button>
    </div>
  </header>
  <div class="wrap">
    <aside class="side" id="side"></aside>
    <main class="main"><div class="main-inner" id="form"></div></main>
  </div>
</div>

<div class="overlay" id="overlay" hidden><div class="modal">
  <div class="modal-header" id="modalTitle"></div>
  <div class="modal-body" id="modalBody"></div>
  <div class="modal-footer" id="modalFooter"></div>
</div></div>
<div class="toast-root" id="toastRoot"></div>
<input type="file" id="imgPicker" accept="image/*" hidden>
<input type="file" id="dataPicker" accept=".js,text/javascript" hidden>
<input type="file" id="icoPicker" accept="image/*" hidden>
<input type="file" id="coverPicker" accept="image/*" hidden>
<div id="imgTools" hidden>
  <div class="it-bar">
    <span class="pct" id="itPct">100%</span>
    <span class="sep"></span>
    <button data-w="25">25</button><button data-w="50">50</button>
    <button data-w="75">75</button><button data-w="100">100</button>
    <span class="sep"></span>
    <button data-align="left" title="왼쪽 정렬">⇤</button>
    <button data-align="center" title="가운데 정렬">↔</button>
    <span class="sep"></span>
    <button class="del" data-imgdel title="이미지 삭제">✕</button>
  </div>
  <div class="it-handle" id="itHandle"></div>
</div>

<script>
/* ============================================================
   상태
   ============================================================ */
const LS_KEY = "portfolio-draft-v1";
let data = null;      // { profile, units }
let sel = null;       // "ui-mi-li"
let dirty = false;

function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }

let hasBase = false;   // data.js를 정상적으로 읽었는가

function countLessons(units){
  return (units || []).reduce((a,u) =>
    a + (u.mids||[]).reduce((b,m) => b + (m.lessons||[]).length, 0), 0);
}

function loadData(){
  hasBase = !!(window.PORTFOLIO_PROFILE && window.PORTFOLIO_UNITS);
  const base = hasBase
    ? { profile: deepCopy(window.PORTFOLIO_PROFILE), units: deepCopy(window.PORTFOLIO_UNITS) }
    : null;

  let draft = null;
  try { const raw = localStorage.getItem(LS_KEY); if (raw) draft = JSON.parse(raw); } catch(_) {}

  // 빈 작업본이 멀쩡한 원본을 가리는 사고 방지
  if (draft && countLessons(draft.units) === 0 && base && countLessons(base.units) > 0){
    try { localStorage.removeItem(LS_KEY); } catch(_) {}
    draft = null;
  }

  if (draft && draft.units){
    data = draft;
    setStatus(`작업본 · 문서 ${countLessons(data.units)}개`, "saved");
  } else if (base){
    data = base;
    setStatus(`원본 · 문서 ${countLessons(data.units)}개`, "saved");
  } else {
    data = { profile:{ name:"", title:"", tagline:"", cards:[
      {label:"직무",value:""},{label:"소속",value:""},{label:"연락처",value:""}] }, units:[] };
    setStatus("data.js 없음", "dirty");
  }
}

/* data.js를 직접 골라서 불러오기 — 폴더·파일명이 어긋나도 해결됩니다 */
document.getElementById("loadBtn").onclick = () => document.getElementById("dataPicker").click();
document.getElementById("dataPicker").onchange = e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const box = {};
      new Function("window", r.result)(box);
      if (!box.PORTFOLIO_UNITS) throw new Error("PORTFOLIO_UNITS 없음");
      const n = countLessons(box.PORTFOLIO_UNITS);
      if (!confirm(`문서 ${n}개를 찾았습니다.\n지금 편집 중인 내용을 이걸로 바꿀까요?`)) return;
      data = { profile: box.PORTFOLIO_PROFILE || data.profile, units: box.PORTFOLIO_UNITS };
      hasBase = true; sel = null;
      save(); renderSide(); renderForm();
      toast(`문서 ${n}개를 불러왔습니다`);
    } catch(err){
      toast("data.js를 읽지 못했습니다: " + err.message, true);
    }
  };
  r.readAsText(f, "utf-8");
};

function save(){
  dirty = true;
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(data));
    setStatus("자동 저장됨", "saved");
  } catch(_) {
    setStatus("저장 실패 — 내보내기로 보관하세요", "dirty");
  }
}
function setStatus(msg, cls){
  const el = document.getElementById("status");
  el.textContent = msg; el.className = "status " + (cls || "");
}
function toast(msg, isErr){
  const t = document.createElement("div");
  t.className = "toast" + (isErr ? " err" : "");
  t.textContent = msg;
  document.getElementById("toastRoot").appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
window.addEventListener("error", e => toast("오류: " + e.message, true));
window.addEventListener("unhandledrejection", e =>
  toast("오류: " + ((e.reason && e.reason.message) || e.reason), true));

const IS_FILE = location.protocol === "file:";

function esc(s){ return String(s == null ? "" : s)
  .replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* 홈에서의 표시 방식 */
const LAYOUT_ORDER = ["gallery", "cards", "list", "inline"];
const LAYOUT_ICON = { gallery:"▦", cards:"▤", list:"☰", inline:"⊞" };
const LAYOUT_NAME = { gallery:"큰 썸네일 카드", cards:"중간 카드", list:"간단한 목록", inline:"홈에 내용 펼치기" };

/* ============================================================
   사이드 트리
   ============================================================ */
function renderSide(){
  const side = document.getElementById("side");
  if (!data.units.length){

document.getElementById("side").addEventListener("click", e => {
  const t = e.target;
  const ui = +t.dataset.ui, mi = +t.dataset.mi, li = +t.dataset.li;

  if (t.dataset.add){
    if (t.dataset.add === "unit") data.units.push({ title:"새 단원", mids:[{ title:"새 그룹", lessons:[] }] });
    if (t.dataset.add === "mid")  data.units[ui].mids.push({ title:"새 그룹", lessons:[] });
    if (t.dataset.add === "lesson"){
      data.units[ui].mids[mi].lessons.push({ title:"새 문서", tag:"", html:"<p>내용을 입력하세요.</p>" });
      sel = `${ui}-${mi}-${data.units[ui].mids[mi].lessons.length - 1}`;
    }
    save(); renderSide(); renderForm(); return;
  }
  if (t.dataset.del){
    const what = { unit:"단원", mid:"그룹", lesson:"문서" }[t.dataset.del];
    if (!confirm(what + "을(를) 삭제할까요? 되돌릴 수 없습니다.")) return;
    if (t.dataset.del === "unit")   data.units.splice(ui, 1);
    if (t.dataset.del === "mid")    data.units[ui].mids.splice(mi, 1);
    if (t.dataset.del === "lesson") data.units[ui].mids[mi].lessons.splice(li, 1);
    sel = null; save(); renderSide(); renderForm();
    e.stopPropagation(); return;
  }
  if (t.dataset.move){
    const dir = +t.dataset.dir;
    const arr = t.dataset.move === "unit" ? data.units
              : t.dataset.move === "mid"  ? data.units[ui].mids
              : data.units[ui].mids[mi].lessons;
    const i = t.dataset.move === "unit" ? ui : t.dataset.move === "mid" ? mi : li;
    const j = i + dir;
    if (j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    sel = null; save(); renderSide(); renderForm();
    e.stopPropagation(); return;
  }
  if (t.dataset.layout !== undefined){
    const u2 = data.units[+t.dataset.layout];
    const cur = LAYOUT_ORDER.indexOf(u2.layout || "cards");
    u2.layout = LAYOUT_ORDER[(cur + 1) % LAYOUT_ORDER.length];
    save(); renderSide();
    toast(`홈에서 ${LAYOUT_NAME[u2.layout]}으로 표시합니다`);
    e.stopPropagation(); return;
  }
  if (t.dataset.cover !== undefined){ pickCover(t.dataset.cover); e.stopPropagation(); return; }
  const openBtn = t.closest("[data-open]");
  if (openBtn){ flush(); sel = openBtn.dataset.open; renderSide(); renderForm(); }
});

document.getElementById("side").addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.edit === "unit") data.units[+t.dataset.ui].title = t.value;
  if (t.dataset.edit === "mid")  data.units[+t.dataset.ui].mids[+t.dataset.mi].title = t.value;
  save();
});

}

function flush(){
  const ed = document.getElementById("editor");

  if (ed && cur){ cur.l.html = ed.innerHTML; save(); }
}

/* ============================================================
   툴바 동작
   ============================================================ */
function insertBlock(ed, html){
  ed.focus();
  const sel2 = window.getSelection();
  const frag = document.createRange().createContextualFragment(html);
  const first = frag.firstElementChild;
  if (sel2.rangeCount && ed.contains(sel2.anchorNode)){
    let node = sel2.anchorNode;
    while (node && node.parentNode !== ed) node = node.parentNode;
    if (node) node.after(frag); else ed.appendChild(frag);
  } else ed.appendChild(frag);
  if (first){
    const r = document.createRange();
    const target = first.querySelector("[data-focus]") || first;
    r.selectNodeContents(target); r.collapse(false);
    sel2.removeAllRanges(); sel2.addRange(r);
  }
  flush();
}

function runCmd(cmd, ed){
  ed.focus();
  switch(cmd){
    case "h2": document.execCommand("formatBlock", false, "h2"); break;
    case "h3": document.execCommand("formatBlock", false, "h3"); break;
    case "p":  document.execCommand("formatBlock", false, "p");  break;
    case "ul": document.execCommand("insertUnorderedList"); break;
    case "bold": document.execCommand("bold"); break;
    case "em": {
      const s = window.getSelection().toString();
      if (!s) return toast("강조할 글자를 먼저 선택하세요", true);
      document.execCommand("insertHTML", false, `<em>${esc(s)}</em>`);
      break;
    }
    case "link": {
      const s = window.getSelection().toString();
      if (!s) return toast("링크를 걸 글자를 먼저 선택하세요", true);
      const url = prompt("링크 주소를 입력하세요", "https://");
      if (url) document.execCommand("createLink", false, url);
      break;
    }
    case "callout":
      insertBlock(ed, `<div class="callout"><div class="callout-ico">💬</div><div class="callout-body"><p data-focus>강조할 내용</p></div></div><p><br></p>`);
      return;
    case "insight":
      insertBlock(ed, `<div class="callout insight"><div class="callout-ico">💡</div><div class="callout-body"><p data-focus>회고·인사이트 내용</p></div></div><p><br></p>`);
      return;
    case "problem":
      insertBlock(ed, `<div class="callout problem"><div class="callout-ico">⚠</div><div class="callout-body"><p data-focus>문제 상황</p></div></div><p><br></p>`);
      return;
    case "quote":
      insertBlock(ed, `<div class="quote"><span style="display:inline;font-size:inherit;font-weight:inherit;color:inherit" data-focus>핵심 문장</span><span>부연 설명</span></div><p><br></p>`);
      return;
    case "table": {
      const cols = Math.max(2, Math.min(6, +prompt("열 개수 (2~6)", "2") || 2));
      const rows = Math.max(1, Math.min(20, +prompt("내용 행 개수 (1~20)", "3") || 3));
      let h = "<table><tr>";
      for (let c = 0; c < cols; c++) h += `<th>${c === 0 ? "항목" : "내용"}</th>`;
      h += "</tr>";
      for (let r = 0; r < rows; r++){
        h += "<tr>";
        for (let c = 0; c < cols; c++) h += "<td>&nbsp;</td>";
        h += "</tr>";
      }
      h += "</table><p><br></p>";
      insertBlock(ed, h);
      return;
    }
    case "cards": openCards(ed); return;
    case "image": pickImage(ed); return;
    case "clear": document.execCommand("removeFormat"); break;
  }
  flush();
}

   카드 묶음 (Tools 같은 격자 박스)

const BADGE_CLASS = { "민트":"", "초록":" l2", "주황":" l1" };
const CLASS_BADGE = { "":"민트", "l2":"초록", "l1":"주황" };
let cardRows = [];   // [{ico:{type:'img'|'emoji'|null,val:''}, name, badge, color}]
let cardTargetGrid = null;

/* 커서가 카드 묶음 안에 있으면 그 묶음을 편집 대상으로 잡는다 */
function findGrid(ed){
  const s2 = window.getSelection();
  if (!s2.rangeCount) return null;
  let n = s2.anchorNode;
  while (n && n !== ed){
    if (n.nodeType === 1 && n.classList && n.classList.contains("skill-grid")) return n;
    n = n.parentNode;
  }
  return null;
}

function readGrid(grid){
  return [...grid.querySelectorAll(".skill")].map(c => {
    const img   = c.querySelector(".skill-ico");
    const emoji = c.querySelector(".skill-ico-emoji");
    const lv    = c.querySelector(".skill-level");
    const cls   = lv ? (lv.className.replace("skill-level","").trim()) : "";
    return {
      ico:   img ? { type:"img", val:img.getAttribute("src"), name:img.getAttribute("data-name") || "" }
           : emoji ? { type:"emoji", val:emoji.textContent } : { type:null, val:"" },
      name:  (c.querySelector(".skill-name") || {}).textContent || "",
      badge: lv ? lv.textContent : "",
      color: CLASS_BADGE[cls] || "민트"
    };
  });
}

function blankRow(){ return { ico:{type:null,val:""}, name:"", badge:"", color:"민트" }; }

function openCards(ed){
  cardTargetGrid = findGrid(ed);
  cardRows = cardTargetGrid ? readGrid(cardTargetGrid)
           : [blankRow(), blankRow(), blankRow()];
  showCardModal(ed);
}

function showCardModal(ed){
  openModal(cardTargetGrid ? "카드 묶음 수정" : "카드 묶음 만들기", `

    <div id="cardRows"></div>
    <button class="btn sm" id="cardAdd" style="align-self:flex-start">+ 카드 추가</button>`,
    [{ label:"취소", cls:"btn", fn: () => { cardTargetGrid = null; closeModal(); } },
     { label: cardTargetGrid ? "수정 적용" : "넣기", cls:"btn primary", fn: () => applyCards(ed) }]);

let coverTarget = null;
function pickCover(key){
  coverTarget = key;
  const [ui, mi] = key.split("-").map(Number);
  const m = data.units[ui].mids[mi];
  if (m.cover && !confirm("이미 썸네일이 있습니다. 새 이미지로 바꿀까요?\n(취소를 누르면 삭제 여부를 묻습니다)")){
    if (confirm("썸네일을 지울까요?")){ delete m.cover; save(); renderSide(); toast("썸네일을 지웠습니다"); }

const tools = document.getElementById("imgTools");
const itBar = tools.querySelector(".it-bar");
const itHandle = document.getElementById("itHandle");
const itPct = document.getElementById("itPct");
let selImg = null;

function widthPct(img){
  const w = img.style.width;
  if (w && w.endsWith("%")) return Math.round(parseFloat(w));
  const parent = img.parentElement;
  const base = (parent && parent.clientWidth) || img.naturalWidth || 1;
  return Math.max(1, Math.min(100, Math.round(img.getBoundingClientRect().width / base * 100)));
}
function setWidth(img, pct){
  pct = Math.max(10, Math.min(100, Math.round(pct)));
  img.style.width = pct + "%";
  img.style.height = "auto";
  if (!img.classList.contains("doc-img")) img.classList.add("doc-img");
  itPct.textContent = pct + "%";
  placeTools();
  markPresets(pct);
  flush();
}
function markPresets(pct){
  itBar.querySelectorAll("[data-w]").forEach(b =>
    b.classList.toggle("on", +b.dataset.w === pct));
  itBar.querySelectorAll("[data-align]").forEach(b =>
    b.classList.toggle("on", selImg &&
      ((b.dataset.align === "center") === selImg.classList.contains("center"))));
}
function placeTools(){
  if (!selImg) return;
  const ed = document.getElementById("editor");
  if (!ed || !ed.contains(selImg)) return deselectImg();
  const r = selImg.getBoundingClientRect();
  const edr = ed.getBoundingClientRect();
  // 편집 영역 밖으로 스크롤되면 숨김
  if (r.bottom < edr.top || r.top > edr.bottom){ tools.hidden = true; return; }
  tools.hidden = false;
  itBar.style.left = r.left + "px";
  itBar.style.top  = Math.max(edr.top - 34, r.top - 38) + "px";
  itHandle.style.left = (r.right - 7) + "px";
  itHandle.style.top  = (r.bottom - 7) + "px";
}
function selectImg(img){
  deselectImg();
  selImg = img;
  img.classList.add("img-sel");
  const p = widthPct(img);
  itPct.textContent = p + "%";
  markPresets(p);
  placeTools();
}
function deselectImg(){
  if (selImg) selImg.classList.remove("img-sel");
  selImg = null;
  tools.hidden = true;
}

document.addEventListener("click", e => {
  const ed = document.getElementById("editor");
  if (!ed) return deselectImg();
  const img = e.target.closest("img");
  if (img && ed.contains(img) && !img.classList.contains("skill-ico")) return selectImg(img);
  if (!e.target.closest("#imgTools")) deselectImg();
});
itBar.addEventListener("click", e => {
  if (!selImg) return;
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.w) setWidth(selImg, +b.dataset.w);
  if (b.dataset.align){
    selImg.classList.toggle("center", b.dataset.align === "center");
    if (!selImg.classList.contains("doc-img")) selImg.classList.add("doc-img");
    markPresets(widthPct(selImg)); flush();
  }
  if (b.hasAttribute("data-imgdel")){
    const t = selImg; deselectImg(); t.remove(); flush(); toast("이미지를 지웠습니다");
  }
});
/* 핸들 드래그 */
itHandle.addEventListener("mousedown", e => {
  if (!selImg) return;
  e.preventDefault();
  const startX = e.clientX;
  const startW = selImg.getBoundingClientRect().width;
  const base = selImg.parentElement.clientWidth || startW;
  const move = ev => setWidth(selImg, (startW + (ev.clientX - startX)) / base * 100);
  const up = () => { document.removeEventListener("mousemove", move);
                     document.removeEventListener("mouseup", up); };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
});
/* Ctrl(⌘)+휠 */
document.addEventListener("wheel", e => {
  if (!selImg || !(e.ctrlKey || e.metaKey)) return;
  const img = e.target.closest("img");
  if (img !== selImg && !e.target.closest("#imgTools")) return;
  e.preventDefault();
  setWidth(selImg, widthPct(selImg) + (e.deltaY < 0 ? 5 : -5));
}, { passive:false });

/* ---- 최소 ZIP 작성기 (무압축 store 방식, 외부 라이브러리 없음) ---- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(buf){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files){          // files: [{name, data:Uint8Array}]
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  const now = new Date();
  const time = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
  const date = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;

  for (const f of files){
    const name = enc.encode(f.name);
    const crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);     lh.setUint16(8, 0, true);
    lh.setUint16(10, time, true);      lh.setUint16(12, date, true);
    lh.setUint32(14, crc, true);       lh.setUint32(18, size, true);
    lh.setUint32(22, size, true);      lh.setUint16(26, name.length, true);
    lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), name, f.data);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true);         cd.setUint16(8, 0x0800, true);
    cd.setUint16(10, 0, true);         cd.setUint16(12, time, true);
    cd.setUint16(14, date, true);      cd.setUint32(16, crc, true);
    cd.setUint32(20, size, true);      cd.setUint32(24, size, true);
    cd.setUint16(28, name.length, true);
    cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), name);
    offset += 30 + name.length + size;
  }
  const cdSize = central.reduce((a, c) => a + c.length, 0);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);
  eo.setUint16(8, files.length, true); eo.setUint16(10, files.length, true);
  eo.setUint32(12, cdSize, true);      eo.setUint32(16, offset, true);
  return new Blob([...chunks, ...central, new Uint8Array(eo.buffer)], { type:"application/zip" });
}
function b64ToBytes(b64){
  const bin = atob(b64);
  const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}

/* 이미지를 images/ 로 분리한 결과물을 만든다 */
function buildSplit(){
  const units = deepCopy(data.units);
  const files = [];
  let n = 0;
  const used = new Set();
  const walk = html => html.replace(/<img([^>]*?)src="data:image\/([a-zA-Z+]+);base64,([^"]+)"([^>]*)>/g,
    (m, pre, ext, b64, post) => {
      n++;
      ext = ext.replace("svg+xml", "svg").replace("jpeg", "jpg");
      const nameAttr = (m.match(/data-name="([^"]+)"/) || [])[1];
      const base = nameAttr ? nameAttr.replace(/\.[^.]+$/, "") : "img";
      let fname = `${String(n).padStart(2,"0")}-${base}.${ext}`;
      while (used.has(fname)) fname = `${String(++n).padStart(2,"0")}-${base}.${ext}`;
      used.add(fname);
      files.push({ name: fname, data: b64ToBytes(b64) });
      return `<img${pre}src="images/${fname}"${post}>`;
    });
  units.forEach(u => u.mids.forEach(m => {
    // 썸네일도 파일로 분리
    if (m.cover && m.cover.startsWith("data:image/")){
      const mm = m.cover.match(/^data:image\/([a-zA-Z+]+);base64,(.+)$/);
      if (mm){
        n++;
        const ext = mm[1].replace("svg+xml", "svg").replace("jpeg", "jpg");
        const base = (m.coverName || "cover").replace(/\.[^.]+$/, "");
        let fname = `cover-${String(n).padStart(2,"0")}-${base}.${ext}`;
        while (used.has(fname)) fname = `cover-${String(++n).padStart(2,"0")}-${base}.${ext}`;
        used.add(fname);
        files.push({ name: fname, data: b64ToBytes(mm[2]) });
        m.cover = "images/" + fname;
      }
    }
    m.lessons.forEach(l => { l.html = walk(l.html || ""); });
  }));
  return { js: buildDataJs(units, data.profile), files };
}

function exportZip(){
  const { js, files } = buildSplit();
  const enc = new TextEncoder();
  const zipFiles = [{ name:"data.js", data: enc.encode(js) },
                    ...files.map(f => ({ name:"images/" + f.name, data:f.data }))];
  const a = document.createElement("a");
  a.href = URL.createObjectURL(makeZip(zipFiles));
  a.download = "portfolio-data.zip";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  closeModal();
  toast(`ZIP으로 받았습니다 (이미지 ${files.length}장)`);
}

   ============================================================ */
let dirHandle = null;
const canFS = !!window.showDirectoryPicker;

/* 저장소 — IndexedDB를 쓰되, 막혀 있으면 localStorage로 대체한다.
   (크롬은 file:// 로 연 페이지에서 IndexedDB를 차단합니다) */
let useIDB = typeof indexedDB !== "undefined" && !IS_FILE;
const LS_VER = "pf-versions";

async function idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open("pf-editor", 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains("meta")) d.createObjectStore("meta");
      if (!d.objectStoreNames.contains("versions")) d.createObjectStore("versions", { keyPath:"id" });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbRun(store, mode, fn){
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const rq = fn(t.objectStore(store));
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}

function lsVersions(){
  try { return JSON.parse(localStorage.getItem(LS_VER) || "[]"); } catch(_) { return []; }
}
function lsWrite(list){
  // 용량이 넘치면 오래된 것부터 버린다
  let arr = list.slice();
  while (arr.length){
    try { localStorage.setItem(LS_VER, JSON.stringify(arr)); return arr.length; }
    catch(_) { arr = arr.slice(0, -1); }
  }
  try { localStorage.removeItem(LS_VER); } catch(_) {}
  return 0;
}

/* 공용 API — 어느 저장소든 같은 방식으로 쓴다 */
async function verAll(){
  if (useIDB){
    try { return await idbRun("versions", "readonly", s => s.getAll()); }
    catch(_) { useIDB = false; }
  }
  return lsVersions();
}
async function verPut(v){
  if (useIDB){
    try { await idbRun("versions", "readwrite", s => s.put(v)); return true; }
    catch(_) { useIDB = false; }
  }
  const list = lsVersions().filter(x => x.id !== v.id);
  list.push(v);
  list.sort((a, b) => b.id - a.id);
  const kept = lsWrite(list.slice(0, MAX_VERSIONS));
  if (!kept) throw new Error("저장 공간이 부족합니다. 이미지가 많으면 ZIP으로 백업하세요.");
  return kept < list.length;   // 잘렸는지 여부
}
async function verDel(id){
  if (useIDB){
    try { await idbRun("versions", "readwrite", s => s.delete(id)); return; }
    catch(_) { useIDB = false; }
  }
  lsWrite(lsVersions().filter(x => x.id !== id));
}
async function metaPut(k, v){
  if (!useIDB) return;
  try { await idbRun("meta", "readwrite", s => s.put(v, k)); } catch(_) {}
}
async function metaGet(k){
  if (!useIDB) return null;
  try { return await idbRun("meta", "readonly", s => s.get(k)); } catch(_) { return null; }
}

async function connectFolder(){
  if (IS_FILE){
    alert("크롬은 file:// 로 연 페이지에서 폴더 접근을 차단합니다.\n\n" +
          "· 지금은 ZIP으로 받기를 쓰세요.\n" +
          "· 폴더 저장을 쓰려면 로컬 서버로 열어야 합니다. (저장 창의 안내 참고)");
    return false;
  }
  if (!canFS){
    alert("이 브라우저는 폴더 저장을 지원하지 않습니다.\nChrome 또는 Edge에서 열어 주세요.");
    return false;
  }
  try {
    dirHandle = await window.showDirectoryPicker({ mode:"readwrite" });
    await metaPut("dir", dirHandle);
    updateFolderBadge();
    toast(`"${dirHandle.name}" 폴더에 연결했습니다`);
    return true;
  } catch(err){
    if (err.name !== "AbortError") alert("폴더 연결 실패\n\n" + err.name + ": " + err.message);
    return false;
  }
}
async function ensurePerm(){
  if (!dirHandle) return false;
  const opts = { mode:"readwrite" };
  if (await dirHandle.queryPermission(opts) === "granted") return true;
  return await dirHandle.requestPermission(opts) === "granted";
}
async function saveToFolder(silent){
  if (!dirHandle && !(await connectFolder())) return false;
  if (!(await ensurePerm())){ toast("폴더 쓰기 권한이 필요합니다", true); return false; }
  try {
    const { js, files } = buildSplit();
    const fh = await dirHandle.getFileHandle("data.js", { create:true });
    const w = await fh.createWritable(); await w.write(js); await w.close();
    if (files.length){
      const imgs = await dirHandle.getDirectoryHandle("images", { create:true });
      for (const f of files){
        const h = await imgs.getFileHandle(f.name, { create:true });
        const ww = await h.createWritable(); await ww.write(f.data); await ww.close();
      }
    }
    dirty = false;
    setStatus(`저장됨 · ${new Date().toLocaleTimeString("ko-KR")}`, "saved");
    if (!silent) toast(`저장 완료 — data.js${files.length ? ` + 이미지 ${files.length}장` : ""}`);
    return true;
  } catch(err){
    toast("저장 실패: " + err.message, true);
    return false;
  }
}
function updateFolderBadge(){
  const b = document.getElementById("saveBtn");
  if (ghReady()){
    b.textContent = "🚀 저장 · 배포";
    b.title = `${gh.repo} 에 커밋 (Ctrl+S)`;
  } else {
    b.textContent = dirHandle ? "💾 저장" : "💾 저장";
    b.title = dirHandle ? `${dirHandle.name} 폴더에 저장 (Ctrl+S)` : "저장 방법을 고릅니다 (Ctrl+S)";
  }
}
(async () => {
  try {
    const h = await metaGet("dir");
    if (h){ dirHandle = h; updateFolderBadge(); }
  } catch(_) {}
})();

/* Ctrl+S */
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){
    e.preventDefault(); flush();
    document.getElementById("saveBtn").click();
  }
});


/* ============================================================
   GitHub에 바로 커밋 — 저장 한 번으로 사이트까지 반영
   ============================================================ */
const GH_KEY = "pf-github";
let gh = null;
try { gh = JSON.parse(localStorage.getItem(GH_KEY) || "null"); } catch(_) {}

function ghReady(){ return !!(gh && gh.repo && gh.token); }
function bytesToB64(bytes){
  let bin = "";
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(bin);
}
function textToB64(str){ return bytesToB64(new TextEncoder().encode(str)); }

async function ghApi(path, opts){
  const res = await fetch("https://api.github.com" + path, {
    ...opts,
    headers: {
      "Authorization": "Bearer " + gh.token,
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json",
      ...(opts && opts.headers)
    }
  });
  if (!res.ok){
    let msg = res.status + " " + res.statusText;
    try { const j = await res.json(); if (j.message) msg += " — " + j.message; } catch(_) {}
    throw new Error(msg);
  }
  return res.status === 204 ? null : res.json();
}

async function saveToGitHub(){
  if (!ghReady()){ openGhSettings(); return false; }
  const branch = gh.branch || "main";
  const prefix = (gh.path || "").replace(/^\/+|\/+$/g, "");
  const p = prefix ? prefix + "/" : "";
  setStatus("GitHub에 올리는 중…", "dirty");
  try {
    const { js, files } = buildSplit();

    // 1) 현재 브랜치 끝점
    const ref = await ghApi(`/repos/${gh.repo}/git/ref/heads/${branch}`);
    const headSha = ref.object.sha;
    const headCommit = await ghApi(`/repos/${gh.repo}/git/commits/${headSha}`);

    // 2) 파일들을 blob으로 올린다
    const tree = [];
    const jsBlob = await ghApi(`/repos/${gh.repo}/git/blobs`, {
      method:"POST", body: JSON.stringify({ content: textToB64(js), encoding:"base64" }) });
    tree.push({ path: p + "data.js", mode:"100644", type:"blob", sha: jsBlob.sha });

    for (let i = 0; i < files.length; i++){
      setStatus(`이미지 올리는 중 ${i + 1}/${files.length}`, "dirty");
      const b = await ghApi(`/repos/${gh.repo}/git/blobs`, {
        method:"POST", body: JSON.stringify({ content: bytesToB64(files[i].data), encoding:"base64" }) });
      tree.push({ path: p + "images/" + files[i].name, mode:"100644", type:"blob", sha: b.sha });
    }

    // 3) 트리 → 커밋 → 브랜치 이동
    const newTree = await ghApi(`/repos/${gh.repo}/git/trees`, {
      method:"POST", body: JSON.stringify({ base_tree: headCommit.tree.sha, tree }) });
    const msg = `포트폴리오 내용 수정 (${new Date().toLocaleString("ko-KR")})`;
    const commit = await ghApi(`/repos/${gh.repo}/git/commits`, {
      method:"POST", body: JSON.stringify({ message: msg, tree: newTree.sha, parents:[headSha] }) });
    await ghApi(`/repos/${gh.repo}/git/refs/heads/${branch}`, {
      method:"PATCH", body: JSON.stringify({ sha: commit.sha }) });

    dirty = false;
    setStatus(`GitHub 반영됨 · ${new Date().toLocaleTimeString("ko-KR")}`, "saved");
    toast(`커밋 완료 — data.js${files.length ? ` + 이미지 ${files.length}장` : ""}. 1분 내 사이트 반영됩니다.`);
    return true;
  } catch(err){
    setStatus("GitHub 저장 실패", "dirty");
    alert("GitHub 저장에 실패했습니다.\n\n" + err.message +
      "\n\n· 저장소 이름이 owner/repo 형식인지\n· 브랜치 이름이 맞는지\n· 토큰 권한(Contents: Read and write)이 있는지 확인해 주세요.");
    return false;
  }
}

function openGhSettings(){
  const g = gh || { repo:"", branch:"main", path:"", token:"" };
  openModal("GitHub 연결 설정", `
    <div class="note">
      한 번만 설정하면 <b>저장 버튼이 곧 배포</b>가 됩니다.
      편집 → 저장 → 1분 뒤 사이트 반영. 파일을 옮길 일이 없습니다.
    </div>
    <div class="field"><label>저장소 <span class="hint">owner/repo 형식</span></label>
      <input type="text" id="ghRepo" value="${esc(g.repo)}" placeholder="bbnotest/portfolio"></div>
    <div class="row">
      <div class="field"><label>브랜치</label>
        <input type="text" id="ghBranch" value="${esc(g.branch || "main")}" placeholder="main"></div>
      <div class="field"><label>폴더 경로 <span class="hint">루트면 비움</span></label>
        <input type="text" id="ghPath" value="${esc(g.path)}" placeholder="(비워두기)"></div>
    </div>
    <div class="field"><label>액세스 토큰</label>
      <input type="text" id="ghToken" value="${esc(g.token)}" placeholder="github_pat_...">
      <div class="hint">GitHub → Settings → Developer settings → Personal access tokens →
        Fine-grained tokens → 해당 저장소만 선택 → <b>Contents: Read and write</b></div></div>
    <div class="note warn">
      토큰은 이 브라우저에만 저장됩니다. <b>admin.html을 GitHub에 올리더라도 토큰은 파일에 들어가지 않습니다.</b>
      공용 PC에서는 쓰지 마시고, 유출이 의심되면 GitHub에서 토큰을 폐기하세요.
    </div>`,
    [{ label:"닫기", cls:"btn", fn: closeModal },
     { label:"연결 확인", cls:"btn", fn: async () => {
        const t = { repo: val("ghRepo").trim(), branch: val("ghBranch").trim() || "main",
                    path: val("ghPath").trim(), token: val("ghToken").trim() };
        if (!t.repo || !t.token) return alert("저장소와 토큰을 모두 입력해 주세요.");
        const keep = gh; gh = t;
        try {
          const r = await ghApi(`/repos/${t.repo}/git/ref/heads/${t.branch}`);
          alert(`연결 성공\n\n${t.repo} · ${t.branch}\n최신 커밋 ${r.object.sha.slice(0,7)}`);
        } catch(err){ gh = keep; alert("연결 실패\n\n" + err.message); }
     }},
     { label:"저장", cls:"btn primary", fn: () => {
        gh = { repo: val("ghRepo").trim(), branch: val("ghBranch").trim() || "main",
               path: val("ghPath").trim(), token: val("ghToken").trim() };
        try { localStorage.setItem(GH_KEY, JSON.stringify(gh)); } catch(_) {}
        updateFolderBadge(); closeModal();
        toast(ghReady() ? "GitHub 연결을 저장했습니다" : "설정을 저장했습니다");
     }}]);
}

/* ============================================================
   버전 기록 (최대 10개)
   ============================================================ */
const MAX_VERSIONS = 10;

async function snapshot(label){
  flush();
  const v = { id: Date.now(), label: label || "", at: Date.now(), payload: deepCopy(data) };
  const trimmed = await verPut(v);
  const all = (await verAll()).sort((a, b) => b.id - a.id);
  for (const old of all.slice(MAX_VERSIONS)) await verDel(old.id);
  return trimmed;
}
function fmtTime(ms){
  const d = new Date(ms);
  return d.toLocaleDateString("ko-KR", { month:"2-digit", day:"2-digit" }) + " " +
         d.toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit" });
}
function sizeOf(obj){
  const kb = new Blob([JSON.stringify(obj)]).size / 1024;
  return kb > 1024 ? (kb/1024).toFixed(1) + "MB" : Math.round(kb) + "KB";
}

async function openVersions(){
  try {
  const all = (await verAll()).sort((a, b) => b.id - a.id);
  const rows = all.length ? all.map(v => `
    <div class="linkrow" style="align-items:center">
      <div style="flex:1 1 auto;min-width:0">
        <div style="font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
          ${esc(v.label) || "(이름 없음)"}</div>
        <div style="font-size:11px;color:var(--text-3)">
          ${fmtTime(v.at)} · 문서 ${countLessons(v.payload.units)}개 · ${sizeOf(v.payload)}</div>
      </div>
      <button class="btn sm" data-vres="${v.id}">되돌리기</button>
      <button class="btn danger sm" data-vdel="${v.id}">✕</button>
    </div>`).join("")
    : `<div class="hint" style="color:var(--text-3)">저장된 버전이 없습니다.</div>`;

  openModal("버전 기록", `
    <div class="note">
      지금 상태를 이름 붙여 남겨두고, 나중에 그 시점으로 되돌릴 수 있습니다.
      <b>최대 ${MAX_VERSIONS}개</b>까지 보관하며 넘으면 가장 오래된 것부터 지워집니다.
      <br><span style="font-size:11px;color:var(--text-3)">보관 위치: ${useIDB ? "IndexedDB (넉넉함)" : "localStorage (약 5MB 제한 — 이미지가 많으면 ZIP 백업 권장)"}</span>
    </div>
    <div class="field">
      <label>지금 상태 저장</label>
      <div class="linkrow">
        <input type="text" id="vLabel" placeholder="예: 외노자 이미지 넣기 전">
        <button class="btn primary sm" id="vSave">기록</button>
      </div>
    </div>
    <div class="section-title">보관된 버전 (${all.length}/${MAX_VERSIONS})</div>
    <div id="vList">${rows}</div>
    <div class="section-title">그 외</div>
    <button class="btn danger sm" id="vReset" style="align-self:flex-start">data.js 원본으로 완전 초기화</button>`,
    [{ label:"닫기", cls:"btn", fn: closeModal }]);

  document.getElementById("vSave").onclick = async () => {
    const label = document.getElementById("vLabel").value.trim();
    await snapshot(label || fmtTime(Date.now()));
    toast("버전을 기록했습니다");
    openVersions();
  };
  document.getElementById("vReset").onclick = () => {
    if (!confirm("편집 내용을 모두 버리고 data.js 원본으로 되돌릴까요?\n버전 기록은 남습니다.")) return;
    try { localStorage.removeItem(LS_KEY); } catch(_) {}
    location.reload();
  };
  document.getElementById("vList").onclick = async e => {
    const res = e.target.closest("[data-vres]");
    const del = e.target.closest("[data-vdel]");
    if (res){
      const v = (await verAll()).find(x => x.id === +res.dataset.vres);
      if (!v) return;
      if (!confirm(`"${v.label}" 시점으로 되돌릴까요?\n지금 상태는 "되돌리기 직전"으로 자동 기록됩니다.`)) return;
      await snapshot("되돌리기 직전");
      data = deepCopy(v.payload); sel = null;
      save(); renderSide(); renderForm(); closeModal();
      toast("되돌렸습니다");
    }
    if (del){
      await verDel(+del.dataset.vdel);
      openVersions();
    }
  };
  } catch(err){
    alert("버전 기록을 열지 못했습니다.\n\n" + err.message);
  }
}
document.getElementById("versionBtn").onclick = openVersions;

/* ============================================================
   미리보기 / 모달 / 테마
   ============================================================ */
document.getElementById("previewBtn").onclick = () => {
  flush();
  const w = window.open("index.html", "_blank");
  if (!w) return toast("팝업이 차단됐습니다", true);
  toast("저장한 내용 기준으로 열립니다");
};

function openModal(title, bodyHtml, buttons){
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalBody").innerHTML = bodyHtml;
  const f = document.getElementById("modalFooter");
  f.innerHTML = "";
  buttons.forEach(b => {
    const el = document.createElement("button");
    el.className = b.cls; el.textContent = b.label; el.onclick = b.fn;
    f.appendChild(el);
  });
  document.getElementById("overlay").hidden = false;
}
function closeModal(){ document.getElementById("overlay").hidden = true; }
document.getElementById("overlay").onclick = e => { if (e.target.id === "overlay") closeModal(); };

const themeBtn = document.getElementById("themeBtn");
function setTheme(t){
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === "dark" ? "☀ 밝게" : "☾ 어둡게";
  try { localStorage.setItem("pf-theme", t); } catch(_) {}
}
themeBtn.onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
let savedTheme = "dark";
try { savedTheme = localStorage.getItem("pf-theme") || "dark"; } catch(_) {}
setTheme(savedTheme);

window.addEventListener("beforeunload", e => {
  if (dirty){ e.preventDefault(); e.returnValue = ""; }
});

/* 원본으로 되돌리기 (콘솔용 안전장치) */
window.resetDraft = () => {
  if (confirm("작업본을 버리고 data.js 원본으로 되돌릴까요?")){
    try { localStorage.removeItem(LS_KEY); } catch(_) {}
    location.reload();
  }
};

loadData();
renderSide();
renderForm();
updateFolderBadge();

/* 편집을 시작하고 30분마다 자동으로 버전 한 칸 남긴다 */
setInterval(() => { if (dirty) snapshot("자동 기록").catch(() => {}); }, 30 * 60 * 1000);
</script>
