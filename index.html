<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="게임 기획자 이정훈의 포트폴리오. 시스템 기획과 컨텐츠 기획 작업물을 모았습니다.">
<title>포트폴리오</title>
<style>
/* ============================================================
   디자인 토큰
   기존 크림 지면과 배치를 유지하고 키컬러는 파랑을 쓴다.
   모서리 규칙: 누르는 것(버튼, 탭, 태그) = 8px(--r-ui), 작은 태그 = 6px,
                담는 것(카드, 이미지) = 14px, 큰 판 = 20px. 알약 모양은 쓰지 않는다.
   ============================================================ */
:root{
  --wrap:1080px;
  --nav-h:64px;
  --r-card:14px;
  --r-big:20px;
  --r-pill:999px;
  --r-ui:8px;
  --s1:4px; --s2:8px; --s3:12px; --s4:18px; --s5:28px; --s6:44px; --s7:72px;
  --font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
:root,[data-theme="light"]{
  --bg:#fffaea;
  --band:#f6eed4;
  --card:#ffffff;
  --ink:#2e2c2b;
  /* 글자색 3단계는 모두 크림 지면에서 WCAG AA(4.5:1)를 넘긴다.
     반투명으로 두면 배경이 바뀔 때 대비가 무너지므로 불투명 값을 쓴다 */
  --ink-2:#5f5b56;
  --ink-3:#6f6a62;
  --line:rgba(46,44,43,.16);
  --line-soft:rgba(46,44,43,.09);
  --accent:#315f80;
  --accent-deep:#244b68;
  --accent-soft:rgba(49,95,128,.12);
  --accent-ink:#fffaea;
  --honey:#c98a2e;
  --honey-soft:rgba(201,138,46,.14);
  --deep:#211110;
  --deep-ink:#f1e6d5;
  --shadow:0 1px 2px rgba(46,44,43,.05),0 10px 30px rgba(46,44,43,.07);
  --shadow-lift:0 4px 10px rgba(46,44,43,.07),0 20px 46px rgba(46,44,43,.11);
}
[data-theme="dark"]{
  --bg:#17110f;
  --band:#1f1815;
  --card:#241c19;
  --ink:#f4ece0;
  --ink-2:#b5aca1;
  --ink-3:#948b80;
  --line:rgba(244,236,224,.17);
  --line-soft:rgba(244,236,224,.1);
  --accent:#9cc5de;
  --accent-deep:#c0deef;
  --accent-soft:rgba(156,197,222,.14);
  --accent-ink:#1a0d0c;
  --honey:#e0a951;
  --honey-soft:rgba(224,169,81,.16);
  --deep:#100b0a;
  --deep-ink:#f1e6d5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
  --shadow-lift:0 4px 10px rgba(0,0,0,.45),0 20px 46px rgba(0,0,0,.55);
}

*,::before,::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);font-size:16px;line-height:1.7;color:var(--ink);
  background:var(--bg);-webkit-font-smoothing:antialiased;
  /* 한글은 낱말 단위로 줄을 바꿔야 한다. 없으면 "포트폴리 / 오"처럼 잘린다 */
  word-break:keep-all;overflow-wrap:break-word;
  transition:background .3s var(--ease),color .3s var(--ease)}
a{color:inherit}
img{max-width:100%}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:3px solid transparent;background-clip:padding-box}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrapx{max-width:var(--wrap);margin:0 auto;padding:0 var(--s5)}
@media(max-width:640px){.wrapx{padding:0 var(--s4)}}

/* 형광펜 강조 밴드 */
.mark{color:var(--accent);padding:0 .08em;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
  background:linear-gradient(to top,transparent 0,transparent .05em,
    var(--accent-soft) .05em,var(--accent-soft) .34em,transparent .34em)}

/* ---------- 내비게이션 : 데스크톱에서 항상 한 줄 ---------- */
.nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft)}
@supports not (background:color-mix(in srgb,red 50%,blue)){.nav{background:var(--bg)}}
.nav-in{height:var(--nav-h);display:flex;align-items:center;gap:var(--s4);flex-wrap:nowrap}
.brand{flex:0 0 auto;font-size:19px;font-weight:900;letter-spacing:-.035em;
  text-decoration:none;white-space:nowrap}
.brand b{color:var(--accent)}
.tabs{flex:1 1 auto;min-width:0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;position:relative;background:none;border:0;cursor:pointer;
  padding:8px 12px;font:700 14px var(--font);color:var(--ink-3);white-space:nowrap;
  border-radius:var(--r-pill);transition:color .16s var(--ease)}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;
  background:var(--accent);border-radius:3px 3px 0 0}
.tabs .num{font-size:11px;font-weight:600;color:var(--ink-3);margin-left:5px;
  font-variant-numeric:tabular-nums}
.tabs button.on .num{color:var(--accent)}
.nav-act{flex:0 0 auto;display:flex;align-items:center;gap:var(--s2)}

/* ---------- 버튼 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 18px;border-radius:var(--r-ui);white-space:nowrap;
  font:700 14px var(--font);cursor:pointer;text-decoration:none;
  border:1px solid var(--line);background:transparent;color:var(--ink);
  transition:border-color .16s var(--ease),background .16s var(--ease),
             color .16s var(--ease),transform .1s var(--ease)}
.btn:hover{border-color:var(--ink-3);background:var(--card)}
.btn:active{transform:translateY(1px)}
.btn.key{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.key:hover{background:var(--accent-deep);border-color:var(--accent-deep);color:var(--accent-ink)}
.btn.sm{padding:7px 14px;font-size:13px}
.btn.ghost{border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--line);color:var(--ink)}

/* ---------- 히어로 (About 탭 전용) ---------- */
.hero{display:grid;grid-template-columns:1.08fr .92fr;gap:var(--s6);align-items:center;
  padding:48px 0 44px}
.hero h1{margin:0 0 6px;font-size:clamp(36px,5.6vw,54px);font-weight:900;
  letter-spacing:-.04em;line-height:1.1}
.hero-role{margin:0 0 var(--s4);font-size:clamp(19px,2.4vw,28px);font-weight:800;
  letter-spacing:-.025em;line-height:1.35}
.hero-sub{margin:0 0 var(--s5);font-size:clamp(15px,1.5vw,17.5px);color:var(--ink-2);
  max-width:36ch;line-height:1.65}
.hero-cta{display:flex;flex-wrap:wrap;gap:var(--s2)}
.hero-art{position:relative}
.hero-art .frame{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;
  border-radius:var(--r-card);border:1px solid var(--line);box-shadow:var(--shadow);
  background:var(--band)}
.hero-art .avatar{position:absolute;left:-26px;bottom:-20px;width:96px;height:96px;
  border-radius:50%;object-fit:cover;border:5px solid var(--bg);box-shadow:var(--shadow)}
.hero-art .avatar.ph{display:flex;align-items:center;justify-content:center;
  font-size:42px;font-weight:900;color:var(--deep);
  background:linear-gradient(140deg,var(--accent),var(--honey))}
@media(max-width:860px){
  .hero{grid-template-columns:1fr;gap:var(--s6);padding:36px 0 44px}
  .hero-art{order:-1}
  .hero-art .frame{aspect-ratio:16/9}
  .hero-art .avatar{left:auto;right:16px;bottom:-26px;width:88px;height:88px;font-size:33px}
  .hero-sub{max-width:none}
}

/* About 탭은 히어로 바로 아래에 소개 문서가 온다. 사이를 얇은 선 하나로만 나눈다 */
.pane.about{border-top:1px solid var(--line-soft)}
.pane.about .doc-sec:first-of-type{padding-top:var(--s6)}

/* ---------- 그룹 전환 (하위 탭) ---------- */
.subtabs{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;
  padding:var(--s5) 0 var(--s1)}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:8px 16px 8px 8px;background:var(--card);border:1px solid var(--line-soft);
  border-radius:var(--r-ui);cursor:pointer;font:700 14px var(--font);color:var(--ink-2);
  white-space:nowrap;transition:border-color .16s var(--ease),color .16s var(--ease),
  background .16s var(--ease),transform .1s var(--ease)}
.subtabs button:hover{border-color:var(--ink-3);color:var(--ink)}
.subtabs button:active{transform:translateY(1px)}
.subtabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.subtabs .thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;display:block;
  background:var(--band);flex:0 0 auto}
.subtabs .thumb.ph{display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:var(--ink-3)}
.subtabs button.on .thumb.ph{background:var(--accent-ink);color:var(--accent)}
.subtabs .cnt{font-size:11.5px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
.subtabs button.on .cnt{color:var(--accent-ink)}

/* ---------- 그룹 머리말 ---------- */
.pane{padding-bottom:var(--s6)}
.phead{padding:var(--s6) 0 var(--s2)}
.phead h1{margin:0 0 10px;font-size:clamp(28px,4.4vw,46px);font-weight:900;
  letter-spacing:-.035em;line-height:1.15}
.phead .meta{margin:0;font-size:15px;color:var(--ink-2);font-weight:600}
.phead .links{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4)}
.cover{width:100%;aspect-ratio:21/9;object-fit:cover;display:block;
  border-radius:var(--r-big);border:1px solid var(--line-soft);
  box-shadow:var(--shadow);margin-top:var(--s5)}

/* ---------- 문서 바로가기 ---------- */
.jump{position:sticky;top:var(--nav-h);z-index:20;display:flex;gap:6px;overflow-x:auto;
  scrollbar-width:none;padding:var(--s3) 0;margin-top:var(--s5);
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line-soft)}
@supports not (background:color-mix(in srgb,red 50%,blue)){.jump{background:var(--bg)}}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:0 0 auto;background:transparent;border:1px solid var(--line-soft);
  border-radius:var(--r-ui);padding:6px 14px;font:600 13px var(--font);
  color:var(--ink-3);cursor:pointer;white-space:nowrap;
  transition:color .16s var(--ease),border-color .16s var(--ease),background .16s var(--ease)}
.jump button:hover{color:var(--ink);border-color:var(--ink-3)}
.jump button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep)}

/* ---------- 문서 ---------- */
.doc-sec{padding:var(--s7) 0 var(--s6);scroll-margin-top:calc(var(--nav-h) + 60px)}
.doc-sec + .doc-sec{border-top:1px solid var(--line-soft)}
.doc-head{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:var(--s5)}
.doc-title{margin:0;font-size:clamp(22px,2.6vw,30px);font-weight:900;letter-spacing:-.03em;
  line-height:1.25}
.doc-tag{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:6px;
  background:var(--accent-soft);color:var(--accent-deep)}
.doc-links{display:flex;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s5)}
.doc-head + .vid-row{margin:0 0 var(--s5)}

/* 본문은 틀(--wrap) 전체 폭을 쓴다. 70ch 로 제한하면 오른쪽이 비어 좁아 보인다 */
.doc{max-width:none}
.doc > *:first-child{margin-top:0}
.doc h2{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:var(--s6) 0 var(--s3);
  padding-bottom:9px;border-bottom:1px solid var(--line)}
.doc h3{font-size:16.5px;font-weight:800;margin:var(--s5) 0 var(--s2);color:var(--accent)}
.doc p{margin:0 0 var(--s3)}
.doc ul,.doc ol{margin:0 0 var(--s4);padding-left:22px}
.doc li{margin-bottom:7px;color:var(--ink-2)}
.doc li::marker{color:var(--ink-3)}
.doc li strong,.doc p strong,.doc td strong{color:var(--ink);font-weight:700}
.doc em{font-style:normal;color:var(--accent);font-weight:700}
.doc a{color:var(--accent);text-decoration-color:var(--accent-soft);text-underline-offset:3px}
.doc a:hover{text-decoration-color:var(--accent)}

.callout{display:flex;gap:13px;padding:16px 18px;background:var(--card);
  border:1px solid var(--line-soft);border-left:4px solid var(--accent);
  border-radius:var(--r-card);margin:0 0 var(--s4)}
.callout.insight{border-left-color:var(--accent);background:var(--accent-soft)}
.callout.problem{border-left-color:var(--honey);background:var(--honey-soft)}
.callout-ico{flex:0 0 auto;font-size:16px;line-height:1.6}
.callout-body{flex:1 1 auto;min-width:0}
.callout-body p:last-child{margin-bottom:0}

.quote{margin:0 0 var(--s4);padding:var(--s5) var(--s6);background:var(--band);
  border:1px solid var(--line-soft);border-radius:var(--r-big);
  font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.5;text-align:center}
.quote span{display:block;margin-top:9px;font-size:13.5px;font-weight:600;color:var(--ink-2);
  letter-spacing:0}

table{width:100%;border-collapse:collapse;margin:0 0 var(--s4);font-size:14.5px}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line-soft)}
th{background:var(--band);color:var(--ink-2);font-weight:700;font-size:13px;white-space:nowrap}
td{color:var(--ink-2)}
tr:last-child th,tr:last-child td{border-bottom:0}
.doc table{border:1px solid var(--line-soft);border-radius:var(--r-card);overflow:hidden}

.img-row{display:flex;gap:14px;align-items:flex-start;margin:0 0 var(--s4)}
.img-row > img{flex:1 1 0;min-width:0;width:100%;height:auto;margin:0;display:block}
@media(max-width:640px){.img-row{flex-wrap:wrap}.img-row > img{flex:1 1 46%}}
.doc-img{max-width:100%;height:auto;display:block;border-radius:var(--r-card);
  border:1px solid var(--line-soft);box-shadow:var(--shadow);margin:0 0 var(--s3)}
.doc-img.center{margin-left:auto;margin-right:auto}

/* ---------- 영상 카드 ----------
   유튜브 링크는 버튼 대신 썸네일 + 재생 아이콘으로. 누르면 새 창에서 영상이 열린다 */
.vid{position:relative;display:block;width:100%;max-width:520px;aspect-ratio:16/9;
  border-radius:var(--r-card);overflow:hidden;border:1px solid var(--line-soft);
  box-shadow:var(--shadow);background:#141210;text-decoration:none;color:#fff;
  margin:0 0 var(--s4);cursor:pointer}
.vid img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;
  display:block;margin:0;border:0;border-radius:0;box-shadow:none;transition:transform .5s ease}
.vid::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0) 50%)}
.vid:hover img{transform:scale(1.04)}
.vid-play{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;
  border-radius:50%;background:rgba(255,255,255,.94);box-shadow:0 6px 24px rgba(0,0,0,.35);
  z-index:2;transition:transform .2s ease,background .2s ease}
.vid-play::before{content:"";position:absolute;left:27px;top:20px;border-style:solid;
  border-width:13px 0 13px 22px;border-color:transparent transparent transparent var(--accent)}
.vid:hover .vid-play{transform:scale(1.08);background:#fff}
.vid-cap{position:absolute;left:14px;bottom:12px;z-index:2;font-size:12.5px;font-weight:800;
  color:var(--accent-ink);background:var(--accent);padding:5px 10px;border-radius:6px;
  letter-spacing:-.01em}
.doc .vid,.doc .vid:hover{text-decoration:none}
.vid-row{display:flex;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s4)}
.vid-row .vid{flex:1 1 320px;margin:0}
@media(max-width:640px){.vid{max-width:none}}

.skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:var(--s3);margin:0 0 var(--s4)}
.skill{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px 18px;
  background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-card);
  box-shadow:var(--shadow)}
.skill-head{display:flex;align-items:center;gap:9px;width:100%;min-width:0}
.skill-ico{flex:0 0 auto;width:22px;height:22px;object-fit:contain;border:0;border-radius:5px;
  margin:0;box-shadow:none}
.skill-ico-emoji{flex:0 0 auto;font-size:19px}
.skill-name{flex:1 1 auto;min-width:0;font-weight:700;font-size:15px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.skill-level{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:6px;
  background:var(--accent-soft);color:var(--accent-deep)}
.skill-level.l2,.skill-level.l1{background:var(--honey-soft);color:var(--honey)}

.timeline{margin:0 0 var(--s4);padding:0;list-style:none}
.timeline li{position:relative;padding:0 0 var(--s5) 22px;border-left:1px solid var(--line);
  color:var(--ink-2);margin-bottom:0}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{content:"";position:absolute;left:-5px;top:9px;width:9px;height:9px;
  border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.timeline b{display:block;color:var(--ink);font-size:15.5px;font-weight:700;margin-bottom:2px}
.timeline .when{font-size:12.5px;color:var(--ink-3);font-weight:600}

.empty-note{padding:var(--s5);border:1px dashed var(--line);border-radius:var(--r-card);
  color:var(--ink-3);margin:var(--s6) 0}

/* ---------- 푸터 ---------- */
.foot{background:var(--deep);color:var(--deep-ink);margin-top:var(--s7)}
.foot-in{padding-block:var(--s7) var(--s6)}
.foot-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s3) var(--s6)}
.foot-mail{font-size:clamp(19px,2.6vw,27px);font-weight:900;letter-spacing:-.03em;
  color:var(--deep-ink);text-decoration:none}
.foot-mail:hover{color:#c0deef}
.foot-nav{display:flex;flex-wrap:wrap;gap:var(--s4);margin-left:auto}
.foot-nav a{font-size:14.5px;font-weight:600;color:rgba(241,230,213,.7);text-decoration:none}
.foot-nav a:hover{color:var(--deep-ink)}
.foot-bot{margin-top:var(--s5);padding-top:var(--s4);
  border-top:1px solid rgba(241,230,213,.16);
  display:flex;flex-wrap:wrap;gap:var(--s3);justify-content:space-between;
  font-size:13px;color:rgba(241,230,213,.5)}

/* ---------- 등장 모션 ---------- */
@media(prefers-reduced-motion:no-preference){
  .rv{opacity:0;transform:translateY(20px);
    transition:opacity .65s var(--ease),transform .65s var(--ease)}
  .rv.in{opacity:1;transform:none}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

.wt-motion{margin:24px 0}.wt-motion video{display:block;width:100%;aspect-ratio:2/1;background:#303030;border-radius:10px}.wt-motion p{font-size:12px;color:var(--ink-2)}
/* Who’s Tail: document pages and production comparisons. */
.wt-pages,.wt-compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:24px 0;align-items:start}
.wt-pages figure,.wt-compare figure{margin:0;min-width:0}
.wt-pages a,.wt-compare figure>a{display:block}
.wt-pages img,.wt-compare img{width:100%;height:auto;margin:0;border-radius:10px;border:1px solid var(--line);box-shadow:var(--shadow)}
.wt-pages a:focus-visible,.wt-compare a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.wt-compare video{display:block;width:100%;aspect-ratio:16/10;object-fit:contain;background:#20272b;border-radius:10px}
.wt-pages.shrine-pages{gap:12px;margin:24px 0 40px;padding:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;align-items:stretch}
.wt-pages.shrine-pages figure{background:#f1f2f4}
.wt-pages.shrine-pages img{display:block;border:0;border-radius:0;box-shadow:none}
.wt-pages.shrine-pages a:focus-visible{outline-offset:-4px}
@media(max-width:760px){.wt-pages.shrine-pages{grid-template-columns:1fr;gap:12px}}
.wt-pages figcaption,.wt-compare figcaption{font-size:12px;line-height:1.65;color:var(--ink-2);margin-top:9px}
.wt-doclinks{display:flex;flex-wrap:wrap;gap:12px 24px;margin:18px 0;font-size:14px}
.wt-note{font-size:13px;color:var(--ink-2);border-left:3px solid var(--line);padding:8px 16px;margin:20px 0}
.wt-details{margin:22px 0}.wt-details summary{cursor:pointer;font-weight:700;padding:12px 0}
@media(max-width:640px){.wt-pages,.wt-compare{grid-template-columns:1fr;gap:24px}.doc table{display:block;max-width:100%;overflow-x:auto}}

.skill-use{font-size:12px;color:var(--ink-2);line-height:1.5;margin-top:8px}
.skill-ico[src^="images/tools/"]{background:#fff;padding:2px;box-sizing:content-box}

/* Body: Pretendard. Headings: the actual NanumSquareNeo ExtraBold face. */
@font-face{font-family:Pretendard;src:url('fonts/Pretendard-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Pretendard;src:url('fonts/Pretendard-Bold.woff2') format('woff2');font-weight:600 900;font-display:swap}
@font-face{font-family:NanumSquareNeoExtraBold;src:url('fonts/NanumSquareNeo-ExtraBold.woff2') format('woff2');font-weight:800;font-display:swap}
h1,h2,h3,h4,.hero-role{font-family:NanumSquareNeoExtraBold,Pretendard,sans-serif!important;font-weight:800!important;font-synthesis:none}

/* arena skill detail panels */
.arena-skill-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:20px 0}
.arena-skill-card{min-width:0;padding:20px;border:1px solid var(--line,#aaa);border-radius:12px}
.arena-skill-card h3{margin:0 0 8px}.arena-skill-card details{border-top:1px solid var(--line-soft,#ccc);margin-top:12px}
.arena-skill-card summary{cursor:pointer;font-weight:700;padding:14px 0;min-height:44px}
.arena-skill-card table{width:100%;table-layout:fixed;font-size:13px}.arena-skill-card th{width:30%}
.arena-skill-card td,.arena-skill-card th{overflow-wrap:anywhere;word-break:normal}
.arena-skill-images{display:grid;grid-template-columns:1fr;gap:10px}.arena-skill-images img{width:100%;height:auto;max-height:none}
@media(max-width:700px){.arena-skill-grid{grid-template-columns:1fr}.arena-skill-card{padding:16px}}

/* Main navigation and project card browsing */
.nav{background:var(--bg);box-shadow:none}
.nav-in{min-height:60px;height:auto;gap:28px;padding-top:8px;padding-bottom:8px}
.tabs{flex:0 1 auto;margin-right:auto;padding:0;gap:5px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;overflow:visible;box-shadow:none}
.tabs button{min-width:112px;min-height:40px;font-size:15px;color:var(--ink-2);padding:8px 22px;border:1px solid var(--line-soft);border-bottom:0;border-radius:6px 6px 0 0;background:var(--accent-soft)}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:none}
.tabs button.on::after{display:none}.tabs button:hover:not(.on){border-color:var(--accent);color:var(--ink)}
.gallery-heading{padding:30px 0 24px}.gallery-heading h1{font-size:32px;margin:0 0 10px}.gallery-heading p{margin:0;color:var(--ink-2);font-size:16px}
.project-gallery{padding-bottom:32px}.project-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.project-card{display:flex;flex-direction:column;text-align:left;cursor:pointer;padding:0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;overflow:hidden;font:inherit;box-shadow:0 6px 20px #00000005;transition:box-shadow .18s,border-color .18s,transform .18s}
.project-card:hover{border-color:var(--accent);box-shadow:0 10px 24px #00000012;transform:translateY(-3px)}
.card-image{aspect-ratio:1.85/1;background:var(--band);overflow:hidden}.card-image img{width:100%;height:100%;object-fit:cover;display:block}
.card-content{padding:20px;display:flex;flex-direction:column;flex:1}.card-type{font-size:12px;font-weight:700;color:var(--accent-deep);margin:0 0 8px}.card-content h2{font-size:20px;margin:0 0 10px;line-height:1.4}.card-summary{font-size:14px;color:var(--ink-2);line-height:1.65;margin:0 0 16px}.card-roles{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}.card-roles span{background:var(--accent-soft);color:var(--accent-deep);font-size:12px;font-weight:600;padding:4px 7px;border-radius:5px}.card-more{font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;margin-top:18px}
.project-tools{position:sticky;top:var(--nav-h);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 4px 8px #00000004;padding-top:6px}
.project-mini{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding:0 0 6px}
.mini-card{flex:0 0 auto;display:flex;align-items:center;gap:7px;max-width:240px;min-height:40px;padding:5px 10px 5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink-2);font:700 13px var(--font);cursor:pointer;text-align:left}
.mini-card img{width:28px;height:28px;object-fit:cover;border-radius:4px;flex-shrink:0}.mini-card.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.mini-card:hover:not(.on){border-color:var(--accent)}
.project-tools .jump{position:static;margin:0;padding:5px 0;border-top:1px solid var(--line-soft);border-bottom:0;backdrop-filter:none;background:transparent}.jump button{color:var(--ink-2);font-weight:700}.project-tools .jump button{padding:6px 10px;font-size:12px;min-height:32px}.jump button.on{color:var(--accent-deep)}
#project-detail,.doc-sec{scroll-margin-top:calc(var(--nav-h) + var(--tools-h,60px) + 16px)}
.doc-sec.rv{opacity:1;transform:none}
@media(max-width:1000px){.project-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:740px){.nav-in{gap:4px 16px;flex-wrap:wrap;padding-top:6px;padding-bottom:0;min-height:0}.brand{font-size:18px}.nav-act{margin-left:auto}.tabs{order:3;flex:1 1 100%;justify-content:center;margin:0;width:100%;border-bottom:0}.tabs button{flex:1;min-width:0;min-height:38px;padding:8px;font-size:14px}.nav-act .btn{padding:6px 10px}.gallery-heading{padding:24px 0 20px}.gallery-heading h1{font-size:28px}.gallery-heading p{font-size:15px}.project-tools{padding-top:4px}.mini-card{font-size:12px}.project-tools .jump{padding:4px 0}.project-tools .jump button{min-height:36px}}
@media(max-width:580px){.project-grid{grid-template-columns:1fr;gap:18px}}

<style>

<script>
if (new URLSearchParams(location.search).has("preview")){
  let previewLoaded = false;
  try {
    const key = new URLSearchParams(location.search).get("preview");
    const draft = JSON.parse(sessionStorage.getItem("pf-preview-" + key) || "null");
    if (draft && Array.isArray(draft.units) && draft.profile){
      window.PORTFOLIO_PROFILE = draft.profile; window.PORTFOLIO_UNITS = draft.units;
      previewLoaded = true;
    }
  } catch(_) {}
  const banner = document.createElement("div"); banner.id = "previewNotice";
  banner.textContent = previewLoaded ? "편집본 미리보기 — 아직 공개 사이트에 반영되지 않은 내용입니다." : "미리보기 내용을 찾지 못해 공개 내용을 표시합니다. 편집기에서 다시 열어 주세요.";
  const back = document.createElement("a"); back.href = "admin.html" + location.hash; back.textContent = "편집기로 돌아가기";
  banner.append(back); document.body.prepend(banner);

<script>
const PROFILE = window.PORTFOLIO_PROFILE;
const UNITS   = window.PORTFOLIO_UNITS;
const view    = document.getElementById("view");

if (!PROFILE || !UNITS){
  view.innerHTML = '<div class="wrapx"><div class="empty-note">내용 파일(data.js)을 불러오지 못했습니다.</div></div>';
  throw new Error("data.js missing");
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
/* 미리보기 텍스트는 DOM으로 파싱해야 엔티티가 풀린다. 정규식으로 태그만 지우면 &amp;가 노출됨 */
function textOf(h){ const t=document.createElement("div"); t.innerHTML=h||""; return (t.textContent||"").replace(/\s+/g," ").trim(); }

const docCount = () => UNITS.reduce((a,u)=>a+u.mids.reduce((b,m)=>b+m.lessons.length,0),0);

/* 프로젝트 섹션 찾기.
   layout:"gallery"가 있으면 그걸 쓰고, 값이 없는 예전 데이터에서는
   소개(0번)를 뺀 나머지 중 그룹이 가장 많은 섹션을 프로젝트로 본다 */
const projIx = (() => {
  const g = UNITS.findIndex(u => u.layout === "gallery");
  if (g >= 0) return g;
  let best = -1, most = 1;
  UNITS.forEach((u,i) => { if (i > 0 && u.mids.length >= most){ most = u.mids.length; best = i; } });
  return best;
})();
const projCount = () => projIx < 0 ? 0 : UNITS[projIx].mids.length;

/* 프로필 카드에서 메일 주소를 찾아낸다 (값에 HTML이 섞여 있어도 동작) */
function findMail(){
  const raw = (PROFILE.cards||[]).map(c=>String(c.value||"")).join(" ");
  const m = raw.match(/[\w.+-]+@[\w-]+\.[\w.-]+/);
  return m ? m[0] : "";
}
const MAIL = findMail();

/* 이미지 확장자 자동 탐색 */
const EXT = ["png","jpg","jpeg","webp","PNG","JPG","JPEG"];
function tryImg(el, base, i){
  i = i || 0;
  if (i >= EXT.length) return el.dispatchEvent(new CustomEvent("imgfail"));
  el.onerror = () => tryImg(el, base, i + 1);
  el.src = base + "." + EXT[i];
}
function smartImg(base, cls, alt){
  const img = document.createElement("img");
  if (cls) img.className = cls;
  img.alt = alt || "";
  requestAnimationFrame(() => tryImg(img, base));
  return img;
}

/* ---------- 내비게이션 ---------- */
let curU = 0, curM = 0;

document.getElementById("brand").innerHTML = esc(PROFILE.name) + '<b>.</b>';
document.title = PROFILE.name + ", " + PROFILE.title;

function renderTabs(){
  document.getElementById("tabs").innerHTML = UNITS.map((u,i) => {
    const n = u.mids.reduce((a,m)=>a+m.lessons.length,0);
    return `<button type="button" data-u="${i}"${i===curU?' class="on" aria-current="page"':''}>${esc(u.title)}</button>`;
  }).join("");
}
document.getElementById("tabs").onclick = e => {
  const b = e.target.closest("[data-u]");
  if (b) go(+b.dataset.u);
};

/* ---------- 히어로 + 지표 밴드 (About 탭) ---------- */
function heroHTML(){
  const projBtn = projIx >= 0
    ? `<button class="btn" type="button" data-u="${projIx}">${esc(UNITS[projIx].title)} 보기</button>` : "";
  return `<div class="wrapx"><section class="hero">
    <div>
      <h1>${esc(PROFILE.name)}</h1>
      <p class="hero-role"><span class="mark">${esc(PROFILE.title)}</span></p>
      <p class="hero-sub">${esc(PROFILE.tagline)}</p>
      <div class="hero-cta">${projBtn}</div>
    </div>
    <div class="hero-art"><span id="heroBanner"></span><span id="heroAvatar"></span></div>
  </section></div>`;
}

function mountHeroArt(){
  const bs = document.getElementById("heroBanner");
  if (bs){
    const img = smartImg("banner", "frame", PROFILE.name + " 배너 일러스트");
    img.setAttribute("fetchpriority","high");
    img.addEventListener("imgfail", () => {
      const d = document.createElement("div");
      d.className = "frame";
      d.style.background = "linear-gradient(140deg,var(--accent-soft),var(--honey-soft))";
      if (img.parentNode) img.parentNode.replaceChild(d, img);
    });
    bs.replaceWith(img);
  }
  const as = document.getElementById("heroAvatar");
  if (as){
    const img = smartImg("profile", "avatar", PROFILE.name + " 프로필 사진");
    img.addEventListener("imgfail", () => {
      const ph = document.createElement("div");
      ph.className = "avatar ph";
      ph.textContent = (PROFILE.name||"?").trim().charAt(0);
      if (img.parentNode) img.parentNode.replaceChild(ph, img);
    });
    as.replaceWith(img);
  }
}

/* ---------- 링크 ----------
   유튜브 주소는 버튼이 아니라 썸네일 카드(재생 아이콘)로 보여준다 — 영상임이 한눈에 보이게.
   그 밖의 링크(PDF, 노션 등)는 그대로 버튼. */
function ytId(url){
  const m = String(url||"").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/);
  return m ? m[1] : null;
}
function vidCard(url, label){
  const id = ytId(url), cap = String(label||"").replace(/^[▶►▷]\s*/, "") || "영상 보기";
  return `<a class="vid" href="${esc(url)}" target="_blank" rel="noopener" title="${esc(cap)} — 새 창에서 열림">` +
    `<img src="https://img.youtube.com/vi/${id}/maxresdefault.jpg" alt="${esc(cap)} 썸네일" loading="lazy">` +
    `<span class="vid-play" aria-hidden="true"></span><span class="vid-cap">${esc(cap)}</span></a>`;
}
function linkRow(list, cls, btnCls){
  const btns = list.filter(l => !ytId(l.url)), vids = list.filter(l => ytId(l.url));
  return (btns.length ? `<div class="${cls}">${btns.map(l =>
      `<a class="${btnCls}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}</div>` : "")
    + (vids.length ? `<div class="vid-row">${vids.map(l => vidCard(l.url, l.label)).join("")}</div>` : "");
}
/* 고화질 썸네일(maxresdefault)이 없는 영상은 유튜브가 404 나 아주 작은 회색 그림을 준다 → 기본 썸네일로 바꾼다 */
function fixVidThumbs(root){
  root.querySelectorAll(".vid img").forEach(im => {
    const fb = () => { if (/maxresdefault/.test(im.src)) im.src = im.src.replace("maxresdefault", "hqdefault"); };
    im.addEventListener("error", fb);
    im.addEventListener("load", () => { if (im.naturalWidth && im.naturalWidth < 200) fb(); });
    if (im.complete && im.naturalWidth && im.naturalWidth < 200) fb();
  });
}

/* ---------- 문서 ---------- */
/* 그룹 머리말에 이미 뜬 링크는 문서에서 다시 보여주지 않는다 (같은 버튼 두 번 노출 방지) */
let shownLinks = new Set();
function docSection(l, li){
  const links = linkRow((l.links||[]).filter(x => !shownLinks.has(x.url)), "doc-links", "btn key sm");
  return `<section class="doc-sec rv" id="d${li}">
    <div class="doc-head"><h2 class="doc-title">${esc(l.title)}</h2>${
      l.tag ? `<span class="doc-tag">${esc(l.tag)}</span>` : ""}</div>
    ${links}
    <div class="doc">${l.html||""}</div>
  </section>`;
}

function projectPeriod(m){
 const source=document.createElement('template');
 source.innerHTML=m.lessons?.[0]?.html||'';
 const row=[...source.content.querySelectorAll('tr')].find(r=>r.cells[0]?.textContent.includes('기간'));
 const dates=row?.cells[1]?.textContent.match(/\d{4}\.\d{2}(?:\.\d{2})?\s*~\s*(?:개발 중|현재|(?:\d{4}\.)?\d{2}(?:\.\d{2})?)/g);
 return dates?dates.join(' / '):'';
}
function projectGallery(unit){
 return `<section class="project-gallery" id="project-gallery" aria-label="프로젝트 목록"><div class="gallery-heading"><h1>프로젝트</h1><p>게임의 규칙을 설계하고, 구현과 검증으로 구체화한 작업입니다.</p></div><div class="project-grid">${unit.mids.map((m,i)=>`<button type="button" class="project-card" data-m="${i}" aria-label="${esc(m.title)} 프로젝트 보기"><div class="card-image">${m.cover?`<img src="${esc(m.cover)}" alt="" loading="${i<2?'eager':'lazy'}">`:''}</div><div class="card-content"><p class="card-type">${esc(m.projectType||'팀 프로젝트')}</p><h2>${esc(m.title.replace(/ — .*/,''))}</h2>${projectPeriod(m)?`<p class="card-period"><span>기간</span> ${esc(projectPeriod(m))}</p>`:''}<p class="card-summary">${esc(m.summary||m.meta||'')}</p><div class="card-roles">${(m.roles||[]).map(r=>`<span>${esc(r)}</span>`).join('')}</div><span class="card-more">프로젝트 보기 <span aria-hidden="true">↗</span></span></div></button>`).join('')}</div></section>`;
}
let navigationSizeObserver;
function measureNavigation(){
 if(navigationSizeObserver) navigationSizeObserver.disconnect();
 const nav=document.querySelector('.nav'),tools=view.querySelector('.project-tools');
 const update=()=>{document.documentElement.style.setProperty('--nav-h',nav.offsetHeight+'px');document.documentElement.style.setProperty('--tools-h',(tools?tools.offsetHeight:60)+'px');};
 update();navigationSizeObserver=new ResizeObserver(update);navigationSizeObserver.observe(nav);if(tools)navigationSizeObserver.observe(tools);
 const active=view.querySelector('.mini-card.on');if(active){const strip=active.parentElement;strip.scrollLeft=Math.max(0,active.offsetLeft-strip.offsetLeft-strip.clientWidth/2+active.clientWidth/2);}
}

function renderPane(){
  const u = UNITS[curU]; if (!u) return;
  curM = Math.min(Math.max(0, curM), u.mids.length - 1);
  const m = u.mids[curM];
  const isAbout = curU === 0;

  const isProject = curU === projIx;
  const sub = !isProject && u.mids.length > 1 ? `<div class="subtabs">${u.mids.map((x,i) => `<button type="button" data-m="${i}"${i===curM?' class="on"':''}>${esc(x.title)}</button>`).join("")}</div>` : "";

  const links = m.lessons.flatMap(l => l.links||[]);
  const head = isAbout ? "" : `<header class="phead rv" id="project-detail">
      <h1>${esc(m.title)}</h1>
      ${m.meta ? `<p class="meta">${esc(m.meta)}</p>` : ""}
      ${linkRow(links, "links", "btn key")}
      ${m.cover ? `<img class="cover" src="${esc(m.cover)}" alt="${esc(m.title)} 대표 이미지" loading="lazy">` : ""}
    </header>`;

  shownLinks = isAbout ? new Set() : new Set(links.map(l => l.url));

  const jump = m.lessons.length > 2 ? `<nav class="jump" aria-label="문서 바로가기">${m.lessons.map((l,i) =>
    `<button type="button" data-j="${i}"${i?"":' class="on"'}>${esc(l.title)}</button>`).join("")}</nav>` : "";

  const projectTools = isProject ? `<div class="project-tools"><nav class="project-mini" aria-label="프로젝트 선택">${u.mids.map((x,i)=>`<button type="button" data-m="${i}" class="mini-card${i===curM?' on':''}" aria-pressed="${i===curM}">${x.cover?`<img src="${esc(x.cover)}" alt="">`:''}<span>${esc(x.title.replace(/ — .*/,''))}</span></button>`).join('')}</nav>${jump}</div>` : '';
  view.innerHTML = (isAbout ? heroHTML() : "")
    + `<div class="wrapx"><div class="pane${isAbout ? " about" : ""}">${isProject?projectGallery(u):sub}${projectTools}${head}${isProject?'':jump}${m.lessons.map(docSection).join("")}</div></div>`;
  measureNavigation();

  if (isAbout) mountHeroArt();
  view.querySelectorAll(".doc img").forEach(img => {
    if (!img.classList.contains("skill-ico") && !img.closest(".vid")){
      img.classList.add("doc-img");
      img.loading = "lazy";
      if (!img.closest("a")) {
        img.tabIndex = 0;
        img.setAttribute("role", "link");
        img.setAttribute("aria-label", (img.alt || "기획 자료") + " 이미지 크게 보기");
        img.title = "클릭하여 크게 보기";
        img.style.cursor = "zoom-in";
        const enlarge = () => window.open(img.currentSrc || img.src, "_blank", "noopener");
        img.onclick = enlarge;
        img.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); enlarge(); } };
      }
    }
  });
  fixVidThumbs(view);
  bindJump();
  bindReveal();
  try { window.scrollTo({top:0,behavior:"instant"}); } catch(_) {}
}

/* 그룹 전환 + 히어로의 "프로젝트 보기" */
view.addEventListener("click", e => {
  const m = e.target.closest("[data-m]");
  if (m) return go(curU, +m.dataset.m);
  const u = e.target.closest("[data-u]");
  if (u) return go(+u.dataset.u);
});

/* ---------- 바로가기 활성 표시 (스크롤 이벤트 대신 관찰자 사용) ---------- */
let jumpObs = null, revealObs = null;
function bindJump(){
  if (jumpObs){ jumpObs.disconnect(); jumpObs = null; }
  const btns = [...view.querySelectorAll("[data-j]")];
  if (!btns.length) return;
  const secs = [...view.querySelectorAll(".doc-sec")];
  btns.forEach(b => b.onclick = () => {
    const el = document.getElementById("d" + b.dataset.j);
    if (el) el.scrollIntoView({ behavior:"instant", block:"start" });
  });
  jumpObs = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const i = secs.indexOf(en.target);
      if (i < 0) return;
      btns.forEach((b,j) => b.classList.toggle("on", j === i));
    });
  }, { rootMargin: "-120px 0px -65% 0px", threshold: 0 });
  secs.forEach(s => jumpObs.observe(s));
}

function bindReveal(){
  if (revealObs){ revealObs.disconnect(); revealObs = null; }
  const els = [...view.querySelectorAll(".rv")];
  if (!els.length) return;
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches){
    els.forEach(el => el.classList.add("in"));
    return;
  }
  revealObs = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      en.target.classList.add("in");
      revealObs.unobserve(en.target);
    });
  }, { threshold: .1, rootMargin: "0px 0px -40px 0px" });
  els.forEach(el => revealObs.observe(el));
}

/* ---------- 푸터 ---------- */
function renderFoot(){
  const nav = UNITS.map((u,i) => `<a href="#${i===projIx?i:i+'-0'}">${esc(u.title)}</a>`).join("");
  document.getElementById("foot").innerHTML = `<div class="wrapx foot-in">
    <div class="foot-top">
      ${MAIL ? `<a class="foot-mail" href="mailto:${esc(MAIL)}">${esc(MAIL)}</a>` : `<span class="foot-mail">${esc(PROFILE.name)}</span>`}
      <nav class="foot-nav" aria-label="아래쪽 이동">${nav}<a href="admin.html">편집</a></nav>
    </div>
    <div class="foot-bot">
      <span>&copy; ${new Date().getFullYear()} ${esc(PROFILE.name)}</span>
      <span>${esc(PROFILE.title)}</span>
    </div>
  </div>`;
}

/* ---------- 라우팅 ---------- */
function go(u, m){
  const h = u === projIx && m == null ? `${u}` : `${u}-${m||0}`;
  if (location.hash.slice(1) === h) route(); else location.hash = h;
}
/* 프로젝트 목록은 #1, 상세는 #1-그룹, 문서는 #1-그룹-문서. */
function route(){
  const p = location.hash.slice(1).split("-");
  curU = Math.max(0, Math.min(UNITS.length - 1, +p[0] || 0));
  curM = Math.max(0, +p[1] || 0);
  renderTabs(); renderPane();
  if(curU===projIx && p.length===2) requestAnimationFrame(()=>document.getElementById("project-detail")?.scrollIntoView({block:"start",behavior:"instant"}));
  document.querySelectorAll('a[href^="admin.html"]').forEach(a => a.href = 'admin.html#' + curU + '-' + curM + '-' + (+p[2] || 0));
  if (p.length > 2 && p[2] !== ""){
    const el = document.getElementById("d" + (+p[2] || 0));
    if (el) requestAnimationFrame(() => el.scrollIntoView({ block: "start", behavior:"instant" }));
  }
}
addEventListener("hashchange", route);

/* ---------- 테마 ---------- */
function setTheme(t){
  document.documentElement.dataset.theme = t;
  const b = document.getElementById("themeToggle");
  if (b){
    b.textContent = t === "dark" ? "밝게" : "어둡게";
    b.setAttribute("aria-label", t === "dark" ? "밝은 화면으로 바꾸기" : "어두운 화면으로 바꾸기");
  }
  try { localStorage.setItem("pf-theme", t); } catch(_) {}
}
document.getElementById("themeToggle").onclick = () =>
  setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

let saved = null;
try { saved = localStorage.getItem("pf-theme"); } catch(_) {}
if (!saved && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) saved = "dark";
setTheme(saved || "light");

renderFoot();
</script>
