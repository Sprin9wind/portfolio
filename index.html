<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포트폴리오</title>
<style>
:root{
  --r1:10px; --r2:16px; --r3:22px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:36px;
  --font:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif;
}
:root,[data-theme="dark"]{
  --bg-0:#000000; --bg-1:#000000; --bg-2:#0c0c0c; --bg-3:#161616;
  --border-1:#1f1f1f; --border-2:#2e2e2e;
  --text-1:#f2f5f4; --text-2:#9ea6a4; --text-3:#6b7271;
  --accent:#3ecfb2; --accent-2:#6fe3cb; --accent-dim:rgba(62,207,178,.12); --accent-text:#04231e;
  --brown:#45b8d1; --brown-dim:rgba(69,184,209,.13);
  --danger:#e0785c; --warn:#45b8d1;
  --advanced:#3ecfb2; --advanced-dim:rgba(62,207,178,.12);
  --practice-dim:rgba(69,184,209,.13);
  --shadow-1:0 2px 14px rgba(0,0,0,.7); --shadow-2:0 18px 54px rgba(0,0,0,.85);
}
[data-theme="light"]{
  --bg-0:#e6ece9; --bg-1:#f5f8f7; --bg-2:#ffffff; --bg-3:#eef3f1;
  --border-1:#e0e7e4; --border-2:#c6d2ce;
  --text-1:#1c2624; --text-2:#5d6a67; --text-3:#8b9794;
  --accent:#0b8072; --accent-2:#08675c; --accent-dim:#dcf4ef; --accent-text:#ffffff;
  --brown:#0f7a86; --brown-dim:#ddf0f3;
  --danger:#b6553c; --warn:#0f7a86;
  --advanced:#08675c; --advanced-dim:#dcf4ef; --practice-dim:#ddf0f3;
  --shadow-1:0 1px 2px rgba(28,38,36,.05),0 6px 20px rgba(28,38,36,.06);
  --shadow-2:0 6px 18px rgba(28,38,36,.10),0 22px 50px rgba(28,38,36,.10);
}
*,::before,::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);font-size:14.5px;line-height:1.65;color:var(--text-1);
  background:var(--bg-1);-webkit-font-smoothing:antialiased}
a{color:inherit}
*{scrollbar-width:thin;scrollbar-color:var(--border-2) transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrapx{max-width:1000px;margin:0 auto;padding:0 var(--s5)}
@media(max-width:640px){.wrapx{padding:0 var(--s4)}}

/* ---------- 상단 배너 ---------- */
.mast{position:relative;width:100%;overflow:hidden;border-bottom:1px solid var(--border-1)}
.mast img{width:100%;height:clamp(120px,17vw,190px);object-fit:cover;object-position:center 40%;display:block}
.mast::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.86) 0%,rgba(0,0,0,.55) 42%,rgba(0,0,0,.12) 72%,transparent 100%),
             linear-gradient(180deg,transparent 55%,rgba(0,0,0,.75) 100%)}
[data-theme="light"] .mast::after{
  background:linear-gradient(90deg,rgba(245,248,247,.94) 0%,rgba(245,248,247,.6) 45%,transparent 78%),
             linear-gradient(180deg,transparent 60%,rgba(245,248,247,.8) 100%)}
.mast-in{position:absolute;inset:0;display:flex;align-items:center;z-index:2}
.mast-txt h1{margin:0 0 5px;font-size:clamp(20px,3vw,30px);font-weight:800;letter-spacing:-.03em}
.mast-txt h1 b{color:var(--accent);font-weight:800}
.mast-txt p{margin:0;font-size:13px;color:var(--text-2)}
.mast-act{margin-left:auto;display:flex;gap:7px}
.tinybtn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;
  background:rgba(12,12,12,.7);border:1px solid var(--border-2);color:var(--text-2);
  font:500 12px var(--font);cursor:pointer;text-decoration:none;backdrop-filter:blur(6px)}
.tinybtn:hover{border-color:var(--accent);color:var(--accent)}
[data-theme="light"] .tinybtn{background:rgba(255,255,255,.75)}

/* ---------- 상단 탭 ---------- */
.tabbar{position:sticky;top:0;z-index:40;background:rgba(0,0,0,.93);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-1)}
[data-theme="light"] .tabbar{background:rgba(245,248,247,.93)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;position:relative;background:transparent;border:none;cursor:pointer;
  padding:15px 16px 13px;font:600 14px var(--font);color:var(--text-3);white-space:nowrap;
  transition:color .12s}
.tabs button:hover{color:var(--text-1)}
.tabs button.on{color:var(--accent)}
.tabs button.on::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;
  background:var(--accent);border-radius:2px}
.tabs .num{font-size:10.5px;color:var(--text-3);margin-left:5px;font-weight:500}
.tabs button.on .num{color:var(--accent-2)}

/* ---------- 하위 탭 (프로젝트 전환) ---------- */
.subtabs{display:flex;gap:7px;overflow-x:auto;padding:18px 0 4px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:8px 14px 8px 8px;
  background:var(--bg-2);border:1px solid var(--border-1);border-radius:999px;cursor:pointer;
  font:600 13px var(--font);color:var(--text-2);white-space:nowrap;transition:.14s}
.subtabs button:hover{border-color:var(--border-2);color:var(--text-1)}
.subtabs button.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent-2)}
.subtabs .thumb{width:26px;height:26px;border-radius:50%;object-fit:cover;display:block;
  background:var(--bg-3);flex:0 0 auto}
.subtabs .thumb.ph{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-3)}
.subtabs .cnt{font-size:10.5px;color:var(--text-3);font-weight:500}
.subtabs button.on .cnt{color:var(--accent-2)}

/* ---------- 본문 ---------- */
.pane{padding:8px 0 90px}
.pane-head{padding:22px 0 6px}
.pane-title{margin:0 0 8px;font-size:clamp(23px,3.2vw,32px);font-weight:800;letter-spacing:-.03em}
.pane-meta{margin:0;font-size:13.5px;color:var(--text-2)}
.pane-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.cta{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;
  font:600 12.5px var(--font);cursor:pointer;text-decoration:none;border:1px solid var(--border-2);
  background:transparent;color:var(--text-1);transition:.14s}
.cta:hover{border-color:var(--accent);color:var(--accent-2)}
.cta.key{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.cta.key:hover{background:var(--accent-2);border-color:var(--accent-2)}
.cover{width:100%;aspect-ratio:21/9;object-fit:cover;display:block;border-radius:var(--r2);
  border:1px solid var(--border-1);margin:18px 0 4px}

.doc-sec{padding:34px 0;scroll-margin-top:64px}
.doc-sec + .doc-sec{border-top:1px solid var(--border-1)}
.doc-head{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.doc-title{margin:0;font-size:21px;font-weight:700;letter-spacing:-.02em}
.doc-tag{font-size:10.5px;padding:3px 9px;border-radius:999px;background:var(--accent-dim);
  color:var(--accent-2);font-weight:700}
.jump{display:flex;gap:6px;overflow-x:auto;padding:12px 0;margin-bottom:4px;
  border-bottom:1px solid var(--border-1);scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:0 0 auto;background:transparent;border:1px solid var(--border-1);border-radius:999px;
  padding:5px 12px;font:500 11.5px var(--font);color:var(--text-3);cursor:pointer}
.jump button:hover{color:var(--text-1);border-color:var(--border-2)}
.jump button.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent-2)}

/* ---------- About 프로필 ---------- */
.about{display:grid;grid-template-columns:190px 1fr;gap:var(--s6);align-items:start;
  padding:26px 0 8px}
.about-photo{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r3);
  border:1px solid var(--border-1);display:block}
.about-photo.ph{display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:800;
  color:var(--accent-text);background:linear-gradient(140deg,var(--accent),var(--brown))}
.about-name{margin:0 0 4px;font-size:24px;font-weight:800;letter-spacing:-.02em}
.about-role{margin:0 0 14px;font-size:14px;color:var(--accent)}
.about-tag{margin:0 0 18px;font-size:14px;color:var(--text-2)}
.about-chips{display:flex;flex-wrap:wrap;gap:7px}
.ichip{display:inline-flex;align-items:center;gap:8px;padding:6px 13px 6px 11px;
  background:var(--bg-2);border:1px solid var(--border-1);border-radius:999px;
  font:500 12.5px var(--font);color:var(--text-1)}
.ichip i{font-style:normal;font-size:10.5px;font-weight:700;color:var(--accent);
  padding-right:8px;border-right:1px solid var(--border-2)}
.stats{display:flex;gap:26px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border-1)}
.stats b{display:block;font-size:21px;font-weight:800;color:var(--accent)}
.stats span{font-size:10px;color:var(--text-3);letter-spacing:.08em}
@media(max-width:700px){
  .about{grid-template-columns:1fr;gap:var(--s4)}
  .about-photo{max-width:150px}
}

/* ---------- 문서 본문 ---------- */
.doc h2{font-size:17.5px;font-weight:700;margin:var(--s6) 0 var(--s3);padding-bottom:7px;
  border-bottom:1px solid var(--border-1)}
.doc h2:first-child{margin-top:0}
.doc h3{font-size:14.5px;font-weight:700;margin:var(--s5) 0 var(--s2);color:var(--accent-2)}
.doc p{margin:0 0 var(--s3)}
.doc ul{margin:0 0 var(--s4);padding-left:20px}
.doc li{margin-bottom:6px;color:var(--text-2)}
.doc li strong,.doc p strong{color:var(--text-1);font-weight:600}
.doc em{font-style:normal;color:var(--accent-2);font-weight:600}
.doc a{color:var(--accent-2)}
.callout{display:flex;gap:12px;padding:14px 16px;background:var(--bg-2);border:1px solid var(--border-1);
  border-left:3px solid var(--accent);border-radius:var(--r1);margin:0 0 var(--s4)}
.callout.insight{border-left-color:var(--accent);background:var(--accent-dim)}
.callout.problem{border-left-color:var(--brown);background:var(--brown-dim)}
.callout-ico{flex:0 0 auto;font-size:15px}
.callout-body{flex:1 1 auto;min-width:0}
.callout-body p:last-child{margin-bottom:0}
.quote{margin:0 0 var(--s4);padding:var(--s4) var(--s5);background:var(--bg-2);
  border:1px solid var(--border-1);border-radius:var(--r2);font-size:15.5px;font-weight:600;
  line-height:1.6;text-align:center}
.quote span{display:block;margin-top:6px;font-size:12.5px;font-weight:400;color:var(--text-3)}
table{width:100%;border-collapse:collapse;margin:0 0 var(--s4);font-size:13px}
th,td{border:1px solid var(--border-1);padding:8px 12px;text-align:left;vertical-align:top}
th{background:var(--bg-2);color:var(--text-2);font-weight:600;font-size:12px;white-space:nowrap}
td{color:var(--text-2)}
td strong{color:var(--text-1)}
.img-row{display:flex;gap:12px;align-items:flex-start;margin:0 0 16px}
.img-row > img{flex:1 1 0;min-width:0;width:100%;height:auto;margin:0;display:block}
@media(max-width:640px){.img-row{flex-wrap:wrap}.img-row > img{flex:1 1 46%}}
.doc-img{max-width:100%;height:auto;display:block;border-radius:var(--r1);
  border:1px solid var(--border-1);margin:0 0 8px}
.doc-img.center{margin-left:auto;margin-right:auto}
.lesson-links{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--s4)}
.skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--s2);margin:0 0 var(--s4)}
.skill{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:13px 15px;
  background:var(--bg-2);border:1px solid var(--border-1);border-radius:var(--r1)}
.skill-head{display:flex;align-items:center;gap:8px;width:100%;min-width:0}
.skill-ico{flex:0 0 auto;width:20px;height:20px;object-fit:contain;border:none;border-radius:4px;margin:0}
.skill-ico-emoji{flex:0 0 auto;font-size:18px}
.skill-name{flex:1 1 auto;min-width:0;font-weight:600;font-size:14px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.skill-level{font-size:10.5px;padding:3px 9px;border-radius:999px;background:var(--accent-dim);color:var(--accent-2)}
.skill-level.l2,.skill-level.l1{background:var(--brown-dim);color:var(--brown)}
.timeline{margin:0 0 var(--s4);padding:0;list-style:none}
.timeline li{position:relative;padding:0 0 var(--s4) 20px;border-left:1px solid var(--border-1);color:var(--text-2)}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{content:"";position:absolute;left:-4px;top:6px;width:7px;height:7px;
  border-radius:50%;background:var(--accent)}
.timeline b{display:block;color:var(--text-1);font-size:14px;margin-bottom:2px}
.timeline .when{font-size:11.5px;color:var(--text-3)}
.empty-note{padding:var(--s4);border:1px dashed var(--border-1);border-radius:var(--r1);color:var(--text-3)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="mast" id="mast"></header>
<div class="tabbar"><div class="wrapx"><nav class="tabs" id="tabs"></nav></div></div>
<main class="wrapx" id="view"></main>
<script src="data.js"></script>
<script>
const PROFILE = window.PORTFOLIO_PROFILE;
const UNITS = window.PORTFOLIO_UNITS;
const view = document.getElementById("view");
if (!PROFILE || !UNITS){
  view.innerHTML = '<div class="empty-note" style="margin:40px 0">data.js를 불러오지 못했습니다.</div>';
  throw new Error("data.js missing");
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const docCount = () => UNITS.reduce((a,u)=>a+u.mids.reduce((b,m)=>b+m.lessons.length,0),0);
const projCount = () => { const g = UNITS.find(u=>u.layout==="gallery"); return g?g.mids.length:0; };
function textOf(h){ const t=document.createElement("div"); t.innerHTML=h||""; return (t.textContent||"").replace(/\s+/g," ").trim(); }

/* 이미지 파일 확장자 자동 탐색 */
const EXT = ["png","jpg","jpeg","webp","PNG","JPG","JPEG"];
function tryImg(el, base, i){
  i = i || 0;
  if (i >= EXT.length) return el.dispatchEvent(new CustomEvent("imgfail"));
  el.onerror = () => tryImg(el, base, i + 1);
  el.src = base + "." + EXT[i];
}
function smartImg(base, cls){
  const img = document.createElement("img");
  if (cls) img.className = cls;
  img.alt = "";
  requestAnimationFrame(() => tryImg(img, base));
  return img;
}

/* ---------- 상단 배너 ---------- */
function renderMast(){
  const mast = document.getElementById("mast");
  mast.innerHTML = `<span id="mastImg"></span>
    <div class="mast-in"><div class="wrapx" style="display:flex;align-items:center;width:100%">
      <div class="mast-txt">
        <h1>${esc(PROFILE.name)} <b>${esc(PROFILE.title)}</b></h1>
        <p>${esc(PROFILE.tagline)}</p>
      </div>
      <div class="mast-act">
        <button class="tinybtn" id="themeToggle">☀ 밝게</button>
        <a class="tinybtn" href="admin.html">✏️ 편집</a>
      </div>
    </div></div>`;
  const slot = document.getElementById("mastImg");
  const img = smartImg("banner");
  img.addEventListener("imgfail", () => {
    mast.style.background = "linear-gradient(120deg,var(--accent-dim),var(--brown-dim))";
    mast.style.minHeight = "150px";
    img.remove();
  });
  slot.replaceWith(img);
  bindTheme();
}

/* ---------- 상단 탭 ---------- */
let curU = 0, curM = 0;
function renderTabs(){
  document.getElementById("tabs").innerHTML = UNITS.map((u, i) => {
    const n = u.mids.reduce((a,m)=>a+m.lessons.length,0);
    return `<button data-u="${i}"${i===curU?' class="on"':''}>${esc(u.title)}<span class="num">${n}</span></button>`;
  }).join("");
}
document.getElementById("tabs").onclick = e => {
  const b = e.target.closest("[data-u]"); if (!b) return;
  go(+b.dataset.u, 0);
};

/* ---------- 본문 ---------- */
function docSection(l, li){
  return `<section class="doc-sec" id="d${li}">
    <div class="doc-head"><h2 class="doc-title">${esc(l.title)}</h2>
      ${l.tag?`<span class="doc-tag">${esc(l.tag)}</span>`:""}</div>
    ${(l.links||[]).length?`<div class="lesson-links">${(l.links||[]).map(x=>
      `<a class="cta key" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label)}</a>`).join("")}</div>`:""}
    <div class="doc">${l.html||""}</div>
  </section>`;
}

function renderPane(){
  const u = UNITS[curU]; if (!u) return;
  curM = Math.min(curM, u.mids.length - 1);
  const m = u.mids[curM];
  const multi = u.mids.length > 1;

  const sub = multi ? `<div class="subtabs">${u.mids.map((x, i) => {
    const th = x.cover ? `<img class="thumb" src="${x.cover}" alt="">`
      : `<span class="thumb ph">${esc((x.title||"?").trim().charAt(0))}</span>`;
    return `<button data-m="${i}"${i===curM?' class="on"':''}>${th}${esc(x.title)}
      <span class="cnt">${x.lessons.length}</span></button>`;
  }).join("")}</div>` : "";

  const isAbout = curU === 0;
  const about = isAbout ? `<div class="about">
      <span id="photoSlot"></span>
      <div>
        <h2 class="about-name">${esc(PROFILE.name)}</h2>
        <p class="about-role">${esc(PROFILE.title)}</p>
        <p class="about-tag">${esc(PROFILE.tagline)}</p>
        <div class="about-chips">${(PROFILE.cards||[]).map(c=>
          `<span class="ichip"><i>${esc(c.label)}</i>${textOf(c.value)}</span>`).join("")}</div>
        <div class="stats">
          <div><b>${projCount()}</b><span>PROJECTS</span></div>
          <div><b>${docCount()}</b><span>DOCUMENTS</span></div>
          <div><b>${UNITS.length}</b><span>SECTIONS</span></div>
        </div>
      </div>
    </div>` : "";

  const links = m.lessons.flatMap(l=>l.links||[]);
  const head = (!isAbout) ? `<div class="pane-head">
      <h1 class="pane-title">${esc(m.title)}</h1>
      ${m.meta?`<p class="pane-meta">${esc(m.meta)}</p>`:""}
      ${links.length?`<div class="pane-links">${links.map(l=>
        `<a class="cta key" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}</div>`:""}
      ${m.cover?`<img class="cover" src="${m.cover}" alt="">`:""}
    </div>` : "";

  const jump = m.lessons.length > 2 ? `<div class="jump">${m.lessons.map((l,i)=>
    `<button data-j="${i}"${i?"":' class="on"'}>${esc(l.title)}</button>`).join("")}</div>` : "";

  view.innerHTML = `<div class="pane">${sub}${about}${head}${jump}
    ${m.lessons.map(docSection).join("")}</div>`;

  if (isAbout){
    const slot = document.getElementById("photoSlot");
    if (slot){
      const img = smartImg("profile", "about-photo");
      img.addEventListener("imgfail", () => {
        const ph = document.createElement("div");
        ph.className = "about-photo ph";
        ph.textContent = (PROFILE.name||"?").trim().charAt(0);
        if (img.parentNode) img.parentNode.replaceChild(ph, img);
      });
      slot.replaceWith(img);
    }
  }
  bindJump();
  if (window.scrollTo) try { window.scrollTo(0, 0); } catch(_) {}
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-m]");
  if (b) return go(curU, +b.dataset.m);
});
function bindJump(){
  const btns = [...view.querySelectorAll("[data-j]")];
  if (!btns.length) return;
  btns.forEach(b => b.onclick = () => {
    const el = document.getElementById("d" + b.dataset.j);
    if (el && el.scrollIntoView) el.scrollIntoView({ behavior:"smooth", block:"start" });
  });
  const secs = [...view.querySelectorAll(".doc-sec")];
  addEventListener("scroll", () => {
    if (!document.body.contains(secs[0])) return;
    let cur = 0;
    secs.forEach((s,i)=>{ if (s.getBoundingClientRect().top < 140) cur = i; });
    btns.forEach((b,i)=>b.classList.toggle("on", i===cur));
  }, { passive:true });
}

/* ---------- 라우팅 ---------- */
function go(u, m){
  const h = `${u}-${m||0}`;
  if (location.hash.slice(1) === h) route(); else location.hash = h;
}
function route(){
  const p = location.hash.slice(1).split("-");
  curU = Math.max(0, Math.min(UNITS.length - 1, +p[0] || 0));
  curM = Math.max(0, +p[1] || 0);
  renderTabs(); renderPane();
}
addEventListener("hashchange", route);

/* ---------- 테마 ---------- */
function setTheme(t){
  document.documentElement.dataset.theme = t;
  const b = document.getElementById("themeToggle");
  if (b) b.textContent = t === "dark" ? "☀ 밝게" : "☾ 어둡게";
  try { localStorage.setItem("pf-theme", t); } catch(_) {}
}
function bindTheme(){
  const b = document.getElementById("themeToggle");
  if (b) b.onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
}
let _t = "dark"; try { _t = localStorage.getItem("pf-theme") || "dark"; } catch(_) {}

renderMast();
setTheme(_t);
route();
</script>
