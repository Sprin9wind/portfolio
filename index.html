<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이정훈 · 게임 기획 포트폴리오</title>
<style>
/* ============================================================
   tokens — LearningPage 디자인 시스템 그대로 이식
   ============================================================ */
:root{
  --radius-1:10px; --radius-2:16px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:36px;
  --topbar-h:58px;
  --font:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,monospace;
}
/* 배너에서 뽑은 팔레트 — 수채 민트, 잉크 브라운, 금빛 포인트 */
:root,[data-theme="light"]{
  --bg-0:#e6efe3; --bg-1:#f4f8f1; --bg-2:#ffffff; --bg-3:#eef4ea;
  --border-1:#dde6d7; --border-2:#c3d3ba;
  --text-1:#3d2b21; --text-2:#6d5b4e; --text-3:#9c8b7d;
  --accent:#2f8f63; --accent-2:#1f7350; --accent-dim:#e2f2e7; --accent-text:#ffffff;
  --primary:#2f8f63; --primary-hover:#1f7350; --primary-text:#fff;
  --danger:#c4553b; --warn:#b8830c; --info:#2f8f63;
  --advanced:#2f8f63; --advanced-dim:#e2f2e7;
  --practice-dim:#fdf1d5;
  --gold:#d99b09; --gold-dim:#fdf1d5; --gold-ink:#5a3f06;
  --shadow-1:0 1px 2px rgba(61,43,33,.05),0 6px 18px rgba(61,43,33,.05);
  --shadow-2:0 4px 12px rgba(61,43,33,.09),0 18px 46px rgba(61,43,33,.09);
}
[data-theme="dark"]{
  --bg-0:#1a1613; --bg-1:#221d19; --bg-2:#2b2521; --bg-3:#352e28;
  --border-1:#3d352e; --border-2:#4f453c;
  --text-1:#f2ece4; --text-2:#b6a89a; --text-3:#877a6d;
  --accent:#6cc396; --accent-2:#8fd6b0; --accent-dim:rgba(108,195,150,.15); --accent-text:#14261d;
  --primary:#3f9c6f; --primary-hover:#4fb180; --primary-text:#fff;
  --danger:#e0785c; --warn:#e0ab3c; --info:#8fd6b0;
  --advanced:#8fd6b0; --advanced-dim:rgba(108,195,150,.15);
  --practice-dim:rgba(224,171,60,.13);
  --gold:#f0c04a; --gold-dim:rgba(240,192,74,.15); --gold-ink:#f0c04a;
  --shadow-1:0 2px 10px rgba(0,0,0,.35); --shadow-2:0 12px 40px rgba(0,0,0,.45);
}
/* ============================================================ base */
*,::before,::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.5;color:var(--text-1);
  background:var(--bg-1);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#app{height:100%;display:flex;flex-direction:column}
.topbar{flex:0 0 var(--topbar-h);height:var(--topbar-h);display:flex;align-items:center;
  gap:var(--space-2);padding:0 var(--space-4);background:var(--bg-2);
  border-bottom:1px solid var(--border-1);z-index:50}
.topbar-left{display:flex;align-items:center;gap:var(--space-2);min-width:0}
.topbar-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-2)}
.view{flex:1 1 auto;min-height:0;overflow:auto;position:relative}
.container{max-width:920px;margin:0 auto;padding:var(--space-5) var(--space-4)}
*{scrollbar-width:thin;scrollbar-color:var(--border-2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background-color:var(--border-2);border-radius:8px;
  border:2px solid transparent;background-clip:padding-box}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ============================================================ components */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-1);
  background:var(--bg-2);color:var(--text-1);border:1px solid var(--border-1);
  border-radius:var(--radius-1);padding:6px 12px;font-family:var(--font);font-size:13px;
  line-height:1.4;cursor:pointer;transition:background .12s,border-color .12s,color .12s;
  user-select:none;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--bg-3);border-color:var(--border-2)}
.btn:active{transform:translateY(.5px)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--bg-3);color:var(--text-1)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.btn.accent:hover{background:var(--accent-2);border-color:var(--accent-2);color:var(--accent-text)}
.btn.sm{padding:3px 8px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:var(--space-1);background:var(--bg-2);
  border:1px solid var(--border-1);border-radius:12px;padding:2px 8px;font-size:11px;color:var(--text-2)}
.chip.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent-2)}

/* ============================================================ 홈 (learn) */
.learn-root{padding-top:var(--space-5)}
.learn-intro{margin-bottom:var(--space-6);padding-bottom:var(--space-4);border-bottom:1px solid var(--border-1)}
.learn-eyebrow{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;
  color:var(--text-3);margin-bottom:var(--space-2)}
.learn-intro-title{font-size:28px;font-weight:700;margin:0 0 var(--space-2);letter-spacing:-.01em}
.learn-intro-desc{margin:0;font-size:15px;color:var(--text-3)}
.today-info{margin-top:var(--space-4);padding:14px 18px 16px;background:var(--bg-2);
  border:1px solid var(--border-1);border-radius:var(--radius-2);box-shadow:var(--shadow-1)}
.today-head{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  letter-spacing:.02em;color:var(--accent-2);margin-bottom:12px}
.today-head-ico{font-size:13px;line-height:1}
.today-row{display:flex;align-items:stretch}
.today-card{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:5px;
  padding:0 18px;border-left:1px solid var(--border-1)}
.today-card:first-child{border-left:none;padding-left:0}
.today-label{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--text-3)}
.today-value{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today-value a{color:inherit;text-decoration:none}
.today-value a:hover{color:var(--accent-2)}
@media(max-width:560px){
  .today-row{flex-direction:column;gap:12px}
  .today-card{border-left:none;padding:0}
}
.learn-unit{margin-bottom:var(--space-5)}
.learn-unit-title{font-size:20px;font-weight:700;margin:0 0 var(--space-3)}
.learn-unit-num{color:var(--accent);margin-right:4px}
.learn-mid{position:relative;overflow:hidden;width:100%;display:flex;align-items:center;
  gap:var(--space-2);padding:12px 14px 12px 22px;background:var(--bg-2);
  border:1px solid var(--border-1);border-radius:var(--radius-1);margin-bottom:6px;
  cursor:pointer;text-align:left;color:var(--text-1);font-size:15px;font-family:var(--font);
  transition:background .1s,border-color .1s}
.learn-mid::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;
  background:linear-gradient(180deg,var(--accent),var(--accent-2));transition:width .12s}
.learn-mid:hover{background:var(--bg-3);border-color:var(--border-2)}
.learn-mid:hover::before,.learn-mid.open::before{width:8px}
.learn-caret{flex:0 0 auto;color:var(--text-2);transition:transform .15s;font-size:12px}
.learn-mid.open .learn-caret{transform:rotate(90deg)}
.learn-mid-title{flex:1 1 auto;font-weight:500}
.learn-mid-meta{flex:0 0 auto;font-size:12px;color:var(--text-3)}
.learn-mid-count{flex:0 0 auto;font-size:12px;color:var(--text-3)}
.learn-sublist{display:none;margin:0 0 10px 18px}
.learn-sublist.open{display:block}
.learn-lesson{display:flex;align-items:center;gap:var(--space-2);width:100%;padding:9px 14px;
  background:transparent;border:none;border-left:2px solid var(--border-1);cursor:pointer;
  text-align:left;color:var(--text-2);font-size:14px;font-family:var(--font);
  transition:background .1s,color .1s,border-color .1s}
.learn-lesson:hover{background:var(--accent-dim);color:var(--text-1);border-left-color:var(--accent)}
.learn-lesson-bullet{flex:0 0 auto;color:var(--text-3)}
.learn-lesson-title{flex:1 1 auto}
.learn-lesson-tag{flex:0 0 auto;font-size:11px;color:var(--text-3)}

/* ============================================================ 상세 (lesson) */
.lesson-inner{max-width:860px;margin:0 auto;padding:var(--space-6) var(--space-5) 80px}
.lesson-breadcrumb{color:var(--text-3);font-size:12px;letter-spacing:.5px;margin-bottom:6px}
.lesson-heading{font-size:28px;font-weight:700;margin:0 0 var(--space-3)}
.lesson-links{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-5)}
.lesson-nav{display:flex;gap:var(--space-2);margin-top:var(--space-6);
  padding-top:var(--space-4);border-top:1px solid var(--border-1)}
.lesson-nav .btn{flex:1 1 0;min-width:0;justify-content:flex-start;padding:10px 14px}
.lesson-nav .btn.next{justify-content:flex-end;text-align:right}
.lesson-nav-label{display:block;font-size:11px;color:var(--text-3);margin-bottom:2px}
.lesson-nav-title{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 문서 본문 */
.doc h2{font-size:19px;font-weight:700;margin:var(--space-6) 0 var(--space-3);
  padding-bottom:6px;border-bottom:1px solid var(--border-1)}
.doc h2:first-child{margin-top:0}
.doc h3{font-size:15px;font-weight:700;margin:var(--space-5) 0 var(--space-2);color:var(--accent-2)}
.doc p{margin:0 0 var(--space-3);color:var(--text-1)}
.doc ul{margin:0 0 var(--space-4);padding-left:20px}
.doc li{margin-bottom:6px;color:var(--text-2)}
.doc li strong,.doc p strong{color:var(--text-1);font-weight:600}
.doc em{font-style:normal;color:var(--accent-2);font-weight:600}
.doc a{color:var(--accent-2)}
.callout{display:flex;gap:12px;padding:14px 16px;background:var(--bg-2);
  border:1px solid var(--border-1);border-left:3px solid var(--accent);
  border-radius:var(--radius-1);margin:0 0 var(--space-4);box-shadow:var(--shadow-1)}
.callout.insight{border-left-color:var(--advanced);background:var(--advanced-dim)}
.callout.problem{border-left-color:var(--warn);background:var(--practice-dim)}
.callout-ico{flex:0 0 auto;font-size:15px;line-height:1.4}
.callout-body{flex:1 1 auto;min-width:0;color:var(--text-1)}
.callout-body p:last-child{margin-bottom:0}
.quote{margin:0 0 var(--space-4);padding:var(--space-4) var(--space-5);background:var(--bg-2);
  border:1px solid var(--border-1);border-radius:var(--radius-2);
  font-size:16px;font-weight:600;line-height:1.6;color:var(--text-1);text-align:center}
.quote span{display:block;margin-top:6px;font-size:13px;font-weight:400;color:var(--text-3)}
table{width:100%;border-collapse:collapse;margin:0 0 var(--space-4);font-size:13px}
th,td{border:1px solid var(--border-1);padding:8px 12px;text-align:left;vertical-align:top}
th{background:var(--bg-2);color:var(--text-2);font-weight:600;font-size:12px;
  letter-spacing:.03em;white-space:nowrap}
td{color:var(--text-2)}
td strong{color:var(--text-1)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 var(--space-4)}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:var(--space-3);margin-bottom:var(--space-3)}
.gcard{display:flex;flex-direction:column;padding:0;overflow:hidden;text-align:left;
  background:var(--bg-2);border:1px solid var(--border-1);border-radius:var(--radius-2);
  cursor:pointer;font-family:var(--font);color:var(--text-1);
  transition:border-color .12s,transform .12s,box-shadow .12s}
.gcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-1)}
.gcard-cover{position:relative;width:100%;aspect-ratio:16/9;background:var(--bg-3);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.gcard-cover img{width:100%;height:100%;object-fit:cover;display:block;border:none;border-radius:0;margin:0}
.gcard-ph{font-size:13px;color:var(--text-3);padding:0 14px;text-align:center}
.gcard-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.gcard-title{font-size:15px;font-weight:700}
.gcard-meta{font-size:12px;color:var(--text-3)}
.gcard-count{font-size:11px;color:var(--accent-2);margin-top:2px}
.proj-hero{width:100%;aspect-ratio:21/9;object-fit:cover;border-radius:var(--radius-2);
  border:1px solid var(--border-1);display:block;margin-bottom:var(--space-4)}
.crumb-link{color:inherit;text-decoration:none;cursor:pointer}
.crumb-link:hover{color:var(--accent-2);text-decoration:underline}
.doc-img{max-width:100%;height:auto;display:block;border-radius:8px;
  border:1px solid var(--border-1);margin:0 0 8px}
.doc-img.center{margin-left:auto;margin-right:auto}
.skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:var(--space-2);margin:0 0 var(--space-4)}
.skill{display:flex;flex-direction:column;align-items:flex-start;gap:9px;
  padding:14px 16px;background:var(--bg-2);border:1px solid var(--border-1);
  border-radius:var(--radius-2);transition:border-color .12s,background .12s}
.skill:hover{border-color:var(--border-2);background:var(--bg-3)}
.skill-head{display:flex;align-items:center;gap:9px;min-width:0;width:100%}
.skill-ico{flex:0 0 auto;width:22px;height:22px;object-fit:contain;display:block;
  border:none;border-radius:4px;margin:0;padding:0;background:none}
.skill-ico-emoji{flex:0 0 auto;font-size:19px;line-height:1}
.skill-name{flex:1 1 auto;min-width:0;font-weight:600;font-size:15px;color:var(--text-1);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skill-level{font-size:11px;padding:3px 9px;border-radius:12px;
  background:var(--accent-dim);color:var(--accent-2);white-space:nowrap}
.skill-level.l2{background:var(--advanced-dim);color:var(--advanced)}
.skill-level.l1{background:var(--practice-dim);color:var(--warn)}
.timeline{margin:0 0 var(--space-4);padding:0;list-style:none}
.timeline li{position:relative;padding:0 0 var(--space-4) 20px;border-left:1px solid var(--border-1);
  margin:0;color:var(--text-2)}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{content:"";position:absolute;left:-4px;top:5px;width:7px;height:7px;
  border-radius:50%;background:var(--accent)}
.timeline b{display:block;color:var(--text-1);font-size:14px;margin-bottom:2px}
.timeline .when{font-size:12px;color:var(--text-3)}
.empty-note{padding:var(--space-4);border:1px dashed var(--border-1);border-radius:var(--radius-1);
  color:var(--text-3);font-size:13px;margin:0 0 var(--space-4)}
@media(max-width:640px){
  .lesson-inner{padding:var(--space-5) var(--space-4) 60px}
  .lesson-heading{font-size:23px}
  .learn-intro-title{font-size:23px}
  .lesson-nav{flex-direction:column}
}

/* ============================================================ 포트폴리오 레이아웃 */
.wrapx{max-width:1040px;margin:0 auto;padding:0 var(--space-5)}
@media(max-width:640px){.wrapx{padding:0 var(--space-4)}}

/* 히어로 */
.hero{position:relative;padding:72px 0 56px;overflow:hidden}
.hero::before{content:"";position:absolute;left:-10%;top:-60%;width:70%;height:190%;
  background:radial-gradient(closest-side,var(--accent-dim),transparent 70%);pointer-events:none}
.hero-in{position:relative}
.hero-eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;
  letter-spacing:.16em;color:var(--accent-2);margin-bottom:18px}
.hero-eyebrow::before{content:"";width:22px;height:1px;background:var(--accent)}
.hero h1{margin:0 0 14px;font-size:clamp(34px,6vw,58px);font-weight:800;line-height:1.08;
  letter-spacing:-.03em}
.hero h1 b{color:var(--accent-2);font-weight:800}
.hero-tag{margin:0 0 26px;font-size:clamp(15px,2vw,18px);color:var(--text-2);max-width:34em;line-height:1.6}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;background:var(--bg-2);
  border:1px solid var(--border-1);border-radius:999px;font-size:13px;color:var(--text-2)}
.hchip b{color:var(--text-1);font-weight:600}
.hchip a{color:inherit;text-decoration:none}
.hchip a:hover{color:var(--accent-2)}
.hero-stats{display:flex;gap:28px;margin-top:32px;padding-top:24px;border-top:1px solid var(--border-1)}
.hstat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.hstat span{font-size:11px;color:var(--text-3);letter-spacing:.05em}

/* 섹션 */
.sec{padding:44px 0}
.sec + .sec{border-top:1px solid var(--border-1)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:22px}
.sec-num{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--accent-2)}
.sec-title{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.sec-line{flex:1 1 auto;height:1px;background:var(--border-1)}

/* 큰 카드 (개발 프로젝트) */
.big-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:var(--space-4)}
.bcard{display:flex;flex-direction:column;padding:0;overflow:hidden;text-align:left;cursor:pointer;
  background:var(--bg-2);border:1px solid var(--border-1);border-radius:14px;
  font-family:var(--font);color:var(--text-1);
  transition:border-color .15s,transform .15s,box-shadow .15s}
.bcard:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-2)}
.bcard-cover{position:relative;width:100%;aspect-ratio:16/9;background:var(--bg-3);overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.bcard-cover img{width:100%;height:100%;object-fit:cover;display:block;border:none;border-radius:0;margin:0;
  transition:transform .3s}
.bcard:hover .bcard-cover img{transform:scale(1.04)}
.bcard-ph{font-size:13px;color:var(--text-3);padding:0 16px;text-align:center;
  background:linear-gradient(135deg,var(--accent-dim),transparent);width:100%;height:100%;
  display:flex;align-items:center;justify-content:center}
.bcard-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1 1 auto}
.bcard-title{font-size:17px;font-weight:700;letter-spacing:-.01em}
.bcard-meta{font-size:12px;color:var(--text-3)}
.bcard-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.tg{font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--bg-3);
  color:var(--text-2);border:1px solid var(--border-1)}
.bcard-go{margin-top:auto;padding-top:10px;font-size:12px;font-weight:600;color:var(--accent-2)}

/* 중간 카드 (기획 문서) */
.mid-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--space-3)}
.mcard{display:flex;flex-direction:column;gap:7px;padding:18px;text-align:left;cursor:pointer;
  background:var(--bg-2);border:1px solid var(--border-1);border-radius:12px;
  font-family:var(--font);color:var(--text-1);position:relative;overflow:hidden;
  transition:border-color .15s,transform .15s}
.mcard::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--accent),var(--accent-2));opacity:0;transition:opacity .15s}
.mcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.mcard:hover::after{opacity:1}
.mcard-t{font-size:15px;font-weight:700}
.mcard-d{font-size:12px;color:var(--text-3);line-height:1.55}

/* 목록형 (대외 활동) */
.rowlist{display:flex;flex-direction:column;gap:2px}
.rowitem{display:flex;align-items:center;gap:14px;padding:15px 16px;cursor:pointer;text-align:left;
  background:transparent;border:1px solid transparent;border-radius:10px;
  font-family:var(--font);color:var(--text-1);transition:background .12s,border-color .12s}
.rowitem:hover{background:var(--bg-2);border-color:var(--border-1)}

.doc h2{border-bottom:1.5px dashed var(--border-2)}
.doc h3{color:var(--accent-2)}
.callout{border:1.5px solid var(--border-2);border-left:4px solid var(--accent);border-radius:14px}
.callout.insight{border-left-color:var(--accent)}
.callout.problem{border-left-color:var(--gold)}
.quote{border:1.5px dashed var(--border-2);border-radius:16px;background:var(--bg-2)}
.quote span{color:var(--text-3)}
.doc-img{border:2px solid var(--text-1);border-radius:14px}
.skill{border:1.5px solid var(--border-2);border-radius:14px}
.skill:hover{border-color:var(--text-1);box-shadow:3px 3px 0 var(--gold-dim)}
.skill-level{background:var(--accent-dim);color:var(--accent-2)}
.skill-level.l1{background:var(--gold-dim);color:var(--gold-ink)}
[data-theme="dark"] .skill-level.l1{color:var(--gold)}
table{border-radius:12px;overflow:hidden}
th{background:var(--bg-3)}
.btn{border-radius:999px;border-width:1.5px}
.btn.accent{border-color:var(--accent)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-left" id="topbarLeft"></div>
    <div class="topbar-title" id="topbarTitle">포트폴리오</div>
    <div class="topbar-right">
      <a class="btn ghost" id="notionLink" href="https://app.notion.com/p/0009d4ab6bba82c5b160816e3f7c494a" target="_blank" rel="noopener" title="Notion 원본 문서 열기">↗ Notion</a>
      <button class="btn ghost" id="themeToggle" title="테마 전환">☾ 어둡게</button>
      <a class="btn accent" href="admin.html" title="편집기 열기">✏️ 편집</a>
    </div>
  </header>
  <main class="view" id="view"></main>
</div>
<script src="data.js"></script>
<script>
const PROFILE = window.PORTFOLIO_PROFILE;
const UNITS = window.PORTFOLIO_UNITS;
if (!PROFILE || !UNITS) {
  document.getElementById("view").innerHTML =
    '<div class="wrapx" style="padding-top:40px"><div class="empty-note">data.js를 불러오지 못했습니다. index.html과 같은 폴더에 data.js가 있는지 확인해 주세요.</div></div>';
  throw new Error("data.js missing");
}

const view = document.getElementById("view");
const topbarTitle = document.getElementById("topbarTitle");
const topbarLeft = document.getElementById("topbarLeft");

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function countDocs(){ return UNITS.reduce((a,u)=>a+u.mids.reduce((b,m)=>b+m.lessons.length,0),0); }
function projCount(){ const g = UNITS.find(u=>u.layout==="gallery"); return g ? g.mids.length : 0; }

/* ============================================================
   홈 — 히어로 + 작업물
   ============================================================ */
function renderHome(){
  topbarTitle.textContent = `${PROFILE.name} · ${PROFILE.title}`;
  topbarLeft.innerHTML = "";

  const chips = (PROFILE.cards||[]).map(c =>
    `<span class="hchip"><span>${esc(c.label)}</span><b>${c.value}</b></span>`).join("");

  const hero = `<header class="hero"><div class="wrapx hero-in">
    <div class="hero-eyebrow">PORTFOLIO ${new Date().getFullYear()}</div>
    <h1>${esc(PROFILE.name)}<br><b>${esc(PROFILE.title)}</b></h1>
    <p class="hero-tag">${esc(PROFILE.tagline)}</p>
    <div class="hero-chips">${chips}</div>
    <img class="hero-art" src="banner.png" alt="" onerror="this.remove()">
    <div class="hero-stats">
      <div class="hstat"><b>${projCount()}</b><span>PROJECTS</span></div>
      <div class="hstat"><b>${countDocs()}</b><span>DOCUMENTS</span></div>
      <div class="hstat"><b>${UNITS.length}</b><span>SECTIONS</span></div>
    </div>
  </div></header>`;

  const secs = UNITS.map((u, ui) => {
    const head = `<div class="sec-head">
      <span class="sec-num">${String(ui+1).padStart(2,"0")}</span>
      <h2 class="sec-title">${esc(u.title)}</h2><span class="sec-line"></span></div>`;

    if (u.layout === "inline"){
      const body = u.mids.map(m => m.lessons.map(l =>
        `<div class="pj-sec" style="padding:22px 0">
           <div class="pj-sec-head"><h3 class="pj-sec-title" style="font-size:19px">${esc(l.title)}</h3></div>
           <div class="doc">${l.html||""}</div></div>`).join("")).join("");
      return `<section class="sec"><div class="wrapx">${head}${body}</div></section>`;
    }

    if (u.layout === "list"){
      const rows = u.mids.map((m, mi) => m.lessons.map((l, li) =>
        `<button class="rowitem" data-open="${ui}-${mi}" data-goto="${li}">
           <span class="rowitem-dot"></span>
           <span class="rowitem-t">${esc(l.title)}</span>
           <span class="rowitem-m">${esc(l.tag||"")}</span>
           <span class="rowitem-go">→</span></button>`).join("")).join("");
      return `<section class="sec"><div class="wrapx">${head}<div class="rowlist">${rows}</div></div></section>`;
    }

    if (u.layout === "gallery"){
      const cards = u.mids.map((m, mi) => {
        const tags = [...new Set(m.lessons.map(l=>l.tag).filter(Boolean))]
          .slice(0,4).map(t=>`<span class="tg">${esc(t)}</span>`).join("");
        return `<button class="bcard gcard" data-open="${ui}-${mi}">
          <span class="bcard-cover">${m.cover
            ? `<img src="${m.cover}" alt="${esc(m.title)}">`
            : `<span class="bcard-ph">${esc(m.title)}</span>`}</span>
          <span class="bcard-body">
            <span class="bcard-title">${esc(m.title)}</span>
            ${m.meta?`<span class="bcard-meta">${esc(m.meta)}</span>`:""}
            <span class="bcard-tags">${tags}</span>
            <span class="bcard-go">문서 ${m.lessons.length}개 자세히 보기 →</span>
          </span></button>`;
      }).join("");
      return `<section class="sec"><div class="wrapx">${head}<div class="big-grid gallery-grid" data-ui="${ui}">${cards}</div></div></section>`;
    }

    const cards = u.mids.map((m, mi) => {
      const first = m.lessons[0];
      const plain = first ? (first.html||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim().slice(0,70) : "";
      return `<button class="mcard" data-open="${ui}-${mi}">
        <span class="mcard-t">${esc(m.title)}</span>
        <span class="mcard-d">${esc(plain)}${plain.length>=70?"…":""}</span>
        <span class="bcard-go">문서 ${m.lessons.length}개 →</span></button>`;
    }).join("");
    return `<section class="sec"><div class="wrapx">${head}<div class="mid-grid" data-ui="${ui}">${cards}</div></div></section>`;
  }).join("");

  view.innerHTML = hero + secs + `<div style="height:70px"></div>`;
  view.scrollTop = 0;
}

/* ============================================================
   프로젝트 페이지 — 문서 전체를 한 화면에
   ============================================================ */
function renderProject(key, gotoIdx){
  const [ui, mi] = key.split("-").map(Number);
  const u = UNITS[ui], m = u && u.mids[mi];
  if (!m) return renderHome();

  topbarTitle.textContent = m.title;
  topbarLeft.innerHTML = `<button class="btn ghost" id="backBtn">← 홈</button>`;
  document.getElementById("backBtn").onclick = () => go("");

  const cover = m.cover
    ? `<div class="pj-hero" data-hero="${ui}-${mi}"><img src="${m.cover}" alt=""><div class="pj-hero-fade"></div></div>`
    : `<div class="pj-hero" data-hero="${ui}-${mi}" style="aspect-ratio:auto;height:0;border:none"></div>`;

  const allLinks = m.lessons.flatMap(l => l.links||[]);
  const links = allLinks.map(l =>
    `<a class="btn accent sm" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");

  const toc = m.lessons.length > 1 ? `<div class="toc"><div class="wrapx" style="display:flex;gap:6px;padding:0">
    ${m.lessons.map((l,i)=>`<button data-jump="${i}"${i?"":' class="on"'}>${esc(l.title)}</button>`).join("")}
  </div></div>` : "";

  const secs = m.lessons.map((l, li) => `
    <section class="pj-sec" id="s${li}" data-sec="${ui}-${mi}-${li}">
      <div class="pj-sec-head">
        <h2 class="pj-sec-title">${esc(l.title)}</h2>
        ${l.tag?`<span class="pj-sec-tag">${esc(l.tag)}</span>`:""}
      </div>
      ${(l.links||[]).length?`<div class="lesson-links">${(l.links||[]).map(x=>
        `<a class="btn accent sm" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label)}</a>`).join("")}</div>`:""}
      <div class="doc">${l.html||""}</div>
    </section>`).join("");

  const sibs = u.mids.map((x, i) => i === mi ? "" :
    `<button class="btn" data-open="${ui}-${i}">${esc(x.title)} →</button>`).join("");

  view.innerHTML = cover + `
    <div class="wrapx pj-head">
      <div class="pj-crumb"><a data-home>홈</a> · ${esc(u.title)}</div>
      <h1 class="pj-title">${esc(m.title)}</h1>
      ${m.meta?`<p class="pj-meta">${esc(m.meta)}</p>`:""}
      ${links?`<div class="pj-links">${links}</div>`:""}
    </div>` + toc + `<div class="wrapx">${secs}</div>
    <div class="wrapx pj-foot">${sibs}</div>`;

  view.scrollTop = 0;
  if (gotoIdx != null){
    const el = document.getElementById("s" + gotoIdx);
    if (el) setTimeout(() => el.scrollIntoView({ block:"start" }), 40);
  }
  bindToc(m.lessons.length);
}

function bindToc(n){
  const btns = [...view.querySelectorAll("[data-jump]")];
  if (!btns.length) return;
  btns.forEach(b => b.onclick = () => {
    const el = document.getElementById("s" + b.dataset.jump);
    el && el.scrollIntoView({ behavior:"smooth", block:"start" });
  });
  const secs = [...view.querySelectorAll(".pj-sec")];
  view.addEventListener("scroll", () => {
    let cur = 0;
    secs.forEach((s2, i) => { if (s2.getBoundingClientRect().top < 130) cur = i; });
    btns.forEach((b, i) => b.classList.toggle("on", i === cur));
  }, { passive:true });
}

/* ============================================================
   라우팅
   ============================================================ */
function go(hash){ if (location.hash.slice(1) === hash) route(); else location.hash = hash; }
function route(){
  const k = location.hash.slice(1);
  if (!k) return renderHome();
  if (k.startsWith("p-")) return renderProject(k.slice(2));
  const p = k.split("-");
  if (p.length === 3) return renderProject(p[0]+"-"+p[1], +p[2]);
  renderHome();
}
addEventListener("hashchange", route);

view.addEventListener("click", e => {
  if (e.target.closest("[data-home]")) return go("");
  const o = e.target.closest("[data-open]");
  if (o){
    const gi = o.dataset.goto;
    return go(gi != null ? `${o.dataset.open}-${gi}` : `p-${o.dataset.open}`);
  }
});

/* 테마 */
const themeToggle = document.getElementById("themeToggle");
function setTheme(t){
  document.documentElement.dataset.theme = t;
  themeToggle.textContent = t === "dark" ? "☀ 밝게" : "☾ 어둡게";
  try { localStorage.setItem("pf-theme", t); } catch(_) {}
}
themeToggle.onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
let _t = "light"; try { _t = localStorage.getItem("pf-theme") || "light"; } catch(_) {}
setTheme(_t);

route();

</script>
</body>
</html>
